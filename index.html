wisata", "vi": "địa điểm du lịch"}, {"id": "u09-v66", "idn": "kesan", "vi": "ấn tượng"}, {"id": "u09-v67", "idn": "menceritakan kembali", "vi": "kể lại"}, {"id": "u09-v68", "idn": "terasa", "vi": "cảm thấy"}, {"id": "u09-v69", "idn": "mancakrida", "vi": "hoạt động team building ngoài trời"}, {"id": "u09-v70", "idn": "pegawai", "vi": "nhân viên"}, {"id": "u09-v71", "idn": "institusi", "vi": "cơ quan, tổ chức"}, {"id": "u09-v72", "idn": "melatih", "vi": "rèn luyện"}, {"id": "u09-v73", "idn": "keterampilan", "vi": "kỹ năng"}, {"id": "u09-v74", "idn": "bekerja sama", "vi": "hợp tác"}, {"id": "u09-v75", "idn": "berlatih", "vi": "luyện tập"}, {"id": "u09-v76", "idn": "bersenang-senang", "vi": "vui chơi"}, {"id": "u09-v77", "idn": "peserta", "vi": "người tham gia"}, {"id": "u09-v78", "idn": "gunung", "vi": "núi", "note": "bổ sung", "extra": true}, {"id": "u09-v79", "idn": "danau", "vi": "hồ", "note": "bổ sung", "extra": true}, {"id": "u09-v80", "idn": "pulau", "vi": "đảo", "note": "bổ sung", "extra": true}, {"id": "u09-v81", "idn": "hutan", "vi": "rừng", "note": "bổ sung", "extra": true}, {"id": "u09-v82", "idn": "candi", "vi": "đền, tháp", "note": "bổ sung", "extra": true}], "dialogs": [{"title": "Audio 9 — Kế hoạch nghỉ lễ", "kind": "dialog", "lines": [{"who": "Ira", "idn": "Liburan sebentar lagi, ya. Kamu mau berlibur ke mana, Azka?", "vi": "Sắp đến kỳ nghỉ rồi nhỉ. Bạn định đi nghỉ ở đâu, Azka?"}, {"who": "Azka", "idn": "Aku belum ada rencana. Bagaimana denganmu, Ira?", "vi": "Mình chưa có kế hoạch. Còn bạn thì sao, Ira?"}, {"who": "Ira", "idn": "Aku ingin pergi ke Toraja.", "vi": "Mình muốn đi Toraja."}, {"who": "Azka", "idn": "Rencana yang bagus. Kapan kamu akan pergi?", "vi": "Kế hoạch hay đấy. Khi nào bạn đi?"}, {"who": "Ira", "idn": "Minggu depan. Apa kamu mau ikut?", "vi": "Tuần tới. Bạn có muốn đi cùng không?"}, {"who": "Azka", "idn": "Tidak, terima kasih. Sepertinya aku di rumah saja.", "vi": "Không, cảm ơn. Có lẽ mình ở nhà thôi."}, {"who": "Ira", "idn": "Baiklah. Nanti akan kubawakan oleh-oleh dari sana.", "vi": "Được thôi. Lát nữa mình sẽ mang quà từ đó về cho bạn."}, {"who": "Azka", "idn": "Asyik. Kutunggu, ya!", "vi": "Tuyệt. Mình chờ nhé!"}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/124BIPA_2_UMUM_UNIT_9_AUDIO_9.mp3"}, {"title": "Dialog 9 — Kỳ nghỉ ở Lombok", "kind": "dialog", "lines": [{"who": "Aria", "idn": "Hai, Fi. Ke mana kamu pergi ketika libur semester?", "vi": "Chào Fi. Bạn đi đâu vào kỳ nghỉ học kỳ?"}, {"who": "Lutfi", "idn": "Halo, Aria. Liburan kemarin aku pergi ke Lombok.", "vi": "Chào Aria. Kỳ nghỉ vừa rồi mình đi Lombok."}, {"who": "Aria", "idn": "Wow! Transportasi apa yang kamu gunakan?", "vi": "Ồ! Bạn dùng phương tiện gì?"}, {"who": "Lutfi", "idn": "Aku dan keluargaku naik pesawat ke sana.", "vi": "Mình và gia đình đi máy bay đến đó."}, {"who": "Aria", "idn": "Apa saja yang kamu lakukan di sana?", "vi": "Bạn đã làm những gì ở đó?"}, {"who": "Lutfi", "idn": "Sebagian besar waktu kami habiskan untuk jalan-jalan. Pantai di Lombok memang sangat indah. Sehari sebelum kami pulang kami juga melihat pasar malam.", "vi": "Phần lớn thời gian chúng mình dành để đi dạo. Bãi biển ở Lombok quả thật rất đẹp. Một ngày trước khi về, chúng mình còn xem chợ đêm."}, {"who": "Aria", "idn": "Pasti menyenangkan sekali. Semoga aku bisa ke sana nanti.", "vi": "Chắc vui lắm. Mong là sau này mình cũng đến đó được."}, {"who": "Lutfi", "idn": "Kalau nanti kamu kesana, aku juga mau ikut!", "vi": "Nếu sau này bạn đến đó, mình cũng muốn đi cùng!"}]}, {"title": "Kegiatan 4 — Hỏi bạn về kỳ nghỉ gần nhất", "kind": "dialog", "lines": [{"who": "A", "idn": "Ke mana kamu pergi berlibur?", "vi": "Bạn đi nghỉ ở đâu?"}, {"who": "B", "idn": "Saya pergi ke Taman Nasional Bantimurung.", "vi": "Mình đi vườn quốc gia Bantimurung."}]}, {"title": "Teks 9 — Kỳ nghỉ ở Raja Ampat", "kind": "text", "lines": [{"idn": "Liburan di Raja Ampat", "vi": "Kỳ nghỉ ở Raja Ampat"}, {"idn": "Tahun lalu, saya dan keluarga pergi ke Raja Ampat.", "vi": "Năm ngoái, tôi và gia đình đi Raja Ampat."}, {"idn": "Kami pergi ke sana dengan pesawat.", "vi": "Chúng tôi đến đó bằng máy bay."}, {"idn": "Sesampainya di sana kami langsung masuk ke hotel.", "vi": "Khi đến nơi, chúng tôi vào khách sạn ngay."}, {"idn": "Setelah menyimpan barang-barang, kami memulai beragam aktivitas.", "vi": "Sau khi cất đồ đạc, chúng tôi bắt đầu nhiều hoạt động khác nhau."}, {"idn": "Pada hari pertama, kami bermain di pantai.", "vi": "Ngày đầu tiên, chúng tôi chơi ở bãi biển."}, {"idn": "Pantai di Raja Ampat sangat indah. Lautnya jernih dan bersih.", "vi": "Bãi biển ở Raja Ampat rất đẹp. Nước biển trong và sạch."}, {"idn": "Kami juga tidak lupa untuk snorkeling. Saya melihat banyak ikan yang berwarna-warni.", "vi": "Chúng tôi cũng không quên lặn ngắm san hô. Tôi thấy nhiều cá nhiều màu sắc."}, {"idn": "Setelah itu kami mengunjungi pantai yang berpasir putih.", "vi": "Sau đó chúng tôi đến thăm bãi biển cát trắng."}, {"idn": "Saya dan keluarga tidak lupa untuk berfoto bersama.", "vi": "Tôi và gia đình không quên chụp ảnh cùng nhau."}, {"idn": "Pada hari kedua kami pergi ke Air Terjun Batanta.", "vi": "Ngày thứ hai chúng tôi đến thác Batanta."}, {"idn": "Airnya bersih dan jernih seperti di pantai.", "vi": "Nước ở đó sạch và trong như ở bãi biển."}, {"idn": "Pada hari ketiga kami pulang ke rumah.", "vi": "Ngày thứ ba chúng tôi về nhà."}, {"idn": "Liburan kami terasa amat singkat.", "vi": "Kỳ nghỉ của chúng tôi cảm giác rất ngắn."}, {"idn": "Akan tetapi, saya dan keluarga merasa sangat bahagia.", "vi": "Tuy nhiên, tôi và gia đình cảm thấy rất hạnh phúc."}, {"idn": "Saya ingin kembali ke sana pada lain waktu.", "vi": "Tôi muốn quay lại đó vào dịp khác."}]}, {"title": "Wawasan — Mancakrida", "kind": "text", "lines": [{"idn": "Salah satu acara yang biasanya dilaksanakan di tempat wisata adalah mancakrida.", "vi": "Một sự kiện thường được tổ chức ở địa điểm du lịch là mancakrida."}, {"idn": "Acara itu biasanya diikuti oleh keluarga dan pegawai di suatu kantor/institusi.", "vi": "Sự kiện này thường có gia đình và nhân viên của một cơ quan/tổ chức tham gia."}, {"idn": "Kegiatan itu dilakukan untuk melatih berbagai macam keterampilan.", "vi": "Hoạt động này được thực hiện để rèn luyện nhiều loại kỹ năng."}, {"idn": "Keterampilan yang menjadi fokus kegiatan itu adalah keterampilan dalam bekerja sama.", "vi": "Kỹ năng được tập trung trong hoạt động này là kỹ năng hợp tác."}, {"idn": "Dalam kegiatan itu, peserta dapat berlatih sambil bersenang-senang.", "vi": "Trong hoạt động đó, người tham gia có thể luyện tập mà vẫn vui chơi."}]}], "grammar": [{"title": "Văn bản rekon về kỳ nghỉ", "body": "Cấu trúc giống Unit 8: **Orientasi** (khi nào, với ai, đi đâu, bằng gì: *Tahun lalu, saya dan keluarga pergi ke Raja Ampat.*), **Kejadian** (các hoạt động theo ngày), **Kesimpulan** (cảm xúc: *sangat bahagia*).", "examples": [{"idn": "Tahun lalu, saya dan keluarga pergi ke Raja Ampat.", "vi": "Năm ngoái, tôi và gia đình đi Raja Ampat."}, {"idn": "Saya dan keluarga merasa sangat bahagia.", "vi": "Tôi và gia đình cảm thấy rất hạnh phúc."}]}, {"title": "Hỏi đi đâu, bằng gì, làm gì", "body": "**Ke mana kamu pergi berlibur?** (đi đâu) – **Transportasi apa yang kamu gunakan?** (phương tiện) – **Apa saja yang kamu lakukan di sana?** (làm gì).", "examples": [{"idn": "Ke mana kamu pergi berlibur?", "vi": "Bạn đi nghỉ ở đâu?"}, {"idn": "Aku naik pesawat ke sana.", "vi": "Mình đi máy bay đến đó."}]}, {"title": "Dạng rút gọn: ku- và -ku", "body": "Trong văn nói, **ku-** đứng trước động từ thay cho *aku* (tôi, làm chủ ngữ), như *kubawakan* = *aku bawakan*, *kutunggu* = *aku tunggu*. **-ku** đứng sau danh từ là *của tôi*, như *rumahku*.", "examples": [{"idn": "Nanti akan kubawakan oleh-oleh.", "vi": "Lát nữa mình sẽ mang quà về cho bạn."}, {"idn": "Kutunggu, ya!", "vi": "Mình chờ nhé!"}]}, {"title": "Từ chỉ thời gian: tahun lalu, sebentar lagi, sehari sebelum", "body": "**Tahun lalu** (năm ngoái), **minggu depan** (tuần tới), **sebentar lagi** (sắp tới), **sehari sebelum** (một ngày trước). Dùng để đặt thời điểm trong câu chuyện.", "examples": [{"idn": "Liburan sebentar lagi.", "vi": "Sắp đến kỳ nghỉ rồi."}, {"idn": "Sehari sebelum pulang, kami melihat pasar malam.", "vi": "Một ngày trước khi về, chúng tôi xem chợ đêm."}]}, {"title": "Tính từ mô tả cảnh đẹp", "body": "Nhóm tính từ: **indah** (đẹp), **jernih** (trong), **bersih** (sạch), **singkat** (ngắn), **bahagia** (hạnh phúc). Thêm **sangat/amat** để nhấn mạnh.", "examples": [{"idn": "Pantainya sangat indah.", "vi": "Bãi biển rất đẹp."}, {"idn": "Liburan terasa amat singkat.", "vi": "Kỳ nghỉ cảm giác rất ngắn."}]}], "exercises": [{"id": "u09-x01", "t": "mcq", "q": "\"liburan\" nghĩa là", "opts": ["kỳ nghỉ", "kỳ thi", "bài học", "công việc"], "a": 0, "e": "liburan = kỳ nghỉ."}, {"id": "u09-x02", "t": "mcq", "q": "\"oleh-oleh\" nghĩa là", "opts": ["quà mang về", "hành lý", "vé", "ảnh"], "a": 0, "e": "oleh-oleh = quà mang về từ chuyến đi."}, {"id": "u09-x03", "t": "mcq", "q": "Ira muốn đi nghỉ ở", "opts": ["Toraja", "Lombok", "Raja Ampat", "Bali"], "a": 0, "e": "Aku ingin pergi ke Toraja."}, {"id": "u09-x04", "t": "mcq", "q": "Ira sẽ đi vào", "opts": ["tuần tới", "hôm nay", "tháng sau", "năm sau"], "a": 0, "e": "Minggu depan."}, {"id": "u09-x05", "t": "mcq", "q": "Azka trả lời lời rủ như thế nào?", "opts": ["Từ chối, ở nhà", "Đồng ý đi", "Hẹn lần sau đi", "Không trả lời"], "a": 0, "e": "Tidak, terima kasih. Sepertinya aku di rumah saja."}, {"id": "u09-x06", "t": "mcq", "q": "Ira sẽ đem gì cho Azka?", "opts": ["Quà mang về", "Sách", "Tiền", "Thức ăn"], "a": 0, "e": "akan kubawakan oleh-oleh."}, {"id": "u09-x07", "t": "mcq", "q": "Lutfi đi nghỉ ở đâu kỳ nghỉ học kỳ?", "opts": ["Lombok", "Toraja", "Raja Ampat", "Bantimurung"], "a": 0, "e": "Liburan kemarin aku pergi ke Lombok."}, {"id": "u09-x08", "t": "mcq", "q": "Lutfi đi cùng", "opts": ["gia đình", "bạn bè", "một mình", "đồng nghiệp"], "a": 0, "e": "Aku dan keluargaku."}, {"id": "u09-x09", "t": "mcq", "q": "Lutfi và gia đình đi bằng", "opts": ["máy bay", "tàu hỏa", "xe buýt", "tàu thủy"], "a": 0, "e": "naik pesawat."}, {"id": "u09-x10", "t": "mcq", "q": "Phần lớn thời gian ở Lombok họ dành để", "opts": ["đi dạo", "ngủ", "mua sắm", "học"], "a": 0, "e": "jalan-jalan."}, {"id": "u09-x11", "t": "mcq", "q": "Trước ngày về, họ xem", "opts": ["chợ đêm", "hòa nhạc", "phim", "bóng đá"], "a": 0, "e": "pasar malam."}, {"id": "u09-x12", "t": "mcq", "q": "Tác giả Teks 9 đến Raja Ampat vào", "opts": ["năm ngoái", "tuần trước", "hôm qua", "năm nay"], "a": 0, "e": "Tahun lalu."}, {"id": "u09-x13", "t": "mcq", "q": "Họ đi Raja Ampat bằng", "opts": ["máy bay", "tàu thủy", "tàu hỏa", "xe"], "a": 0, "e": "dengan pesawat."}, {"id": "u09-x14", "t": "mcq", "q": "Ngày đầu tiên họ", "opts": ["chơi ở bãi biển", "thăm thác", "về nhà", "mua quà"], "a": 0, "e": "Pada hari pertama, kami bermain di pantai."}, {"id": "u09-x15", "t": "mcq", "q": "Khi lặn ngắm san hô, tác giả thấy", "opts": ["cá nhiều màu sắc", "rùa", "cá mập", "tàu"], "a": 0, "e": "ikan yang berwarna-warni."}, {"id": "u09-x16", "t": "mcq", "q": "Ngày thứ hai họ đến", "opts": ["thác Batanta", "bãi biển", "khách sạn", "chợ"], "a": 0, "e": "Air Terjun Batanta."}, {"id": "u09-x17", "t": "mcq", "q": "Điểm giống nhau giữa bãi biển và thác nước ở Raja Ampat là", "opts": ["nước sạch và trong", "đông người", "nước ấm", "có sóng"], "a": 0, "e": "bersih dan jernih."}, {"id": "u09-x18", "t": "mcq", "q": "Chuyến nghỉ kéo dài", "opts": ["ba ngày", "một tuần", "một ngày", "hai tuần"], "a": 0, "e": "hari ketiga kami pulang."}, {"id": "u09-x19", "t": "mcq", "q": "Cảm xúc của tác giả là", "opts": ["rất hạnh phúc", "buồn", "tức giận", "mệt"], "a": 0, "e": "sangat bahagia."}, {"id": "u09-x20", "t": "fill", "q": "Tahun ___, saya dan keluarga pergi ke Raja Ampat. (ngoái)", "a": ["lalu"], "e": "tahun lalu = năm ngoái."}, {"id": "u09-x21", "t": "fill", "q": "Nanti akan ___ oleh-oleh dari sana. (mình sẽ mang giúp, dạng rút gọn)", "a": ["kubawakan"], "e": "ku- = aku."}, {"id": "u09-x22", "t": "mcq", "q": "\"jernih\" nghĩa là", "opts": ["trong vắt", "bẩn", "ngắn", "sâu"], "a": 0, "e": "jernih = trong."}, {"id": "u09-x23", "t": "mcq", "q": "\"singkat\" nghĩa là", "opts": ["ngắn", "dài", "mới", "cũ"], "a": 0, "e": "singkat = ngắn."}, {"id": "u09-x24", "t": "mcq", "q": "Mancakrida dùng để rèn luyện", "opts": ["kỹ năng hợp tác", "kỹ năng nấu ăn", "kỹ năng lái xe", "kỹ năng hát"], "a": 0, "e": "keterampilan dalam bekerja sama."}], "culture": {"title": "Mancakrida", "vi": "**Mancakrida** là hoạt động ngoài trời thường tổ chức ở nơi du lịch, có **gia đình và nhân viên của một cơ quan** tham gia. Mục đích là rèn luyện nhiều kỹ năng, đặc biệt là **kỹ năng hợp tác (bekerja sama)**, vừa luyện tập vừa vui chơi."}}, {"id": "u10", "num": 10, "title": "Obat dan Penyakit", "vi_title": "Thuốc và bệnh tật", "goals": ["Hiểu hội thoại về việc chữa bệnh", "Nói công dụng và cách dùng thuốc", "Hiểu văn bản kể về người bị bệnh", "Viết về công dụng thuốc dựa trên thông tin trên bao bì"], "vocab": [{"id": "u10-v01", "idn": "obat", "vi": "thuốc"}, {"id": "u10-v02", "idn": "penyakit", "vi": "bệnh"}, {"id": "u10-v03", "idn": "sakit", "vi": "đau, ốm"}, {"id": "u10-v04", "idn": "sakit kepala", "vi": "đau đầu"}, {"id": "u10-v05", "idn": "pusing", "vi": "chóng mặt, đau đầu"}, {"id": "u10-v06", "idn": "mual", "vi": "buồn nôn"}, {"id": "u10-v07", "idn": "demam", "vi": "sốt"}, {"id": "u10-v08", "idn": "demam berdarah", "vi": "sốt xuất huyết"}, {"id": "u10-v09", "idn": "diare", "vi": "tiêu chảy"}, {"id": "u10-v10", "idn": "meriang", "vi": "ớn lạnh, rét run"}, {"id": "u10-v11", "idn": "masuk angin", "vi": "cảm gió"}, {"id": "u10-v12", "idn": "nyeri otot", "vi": "đau cơ"}, {"id": "u10-v13", "idn": "otot", "vi": "cơ"}, {"id": "u10-v14", "idn": "pucat", "vi": "xanh xao, nhợt nhạt"}, {"id": "u10-v15", "idn": "gejala", "vi": "triệu chứng"}, {"id": "u10-v16", "idn": "penyebab", "vi": "nguyên nhân"}, {"id": "u10-v17", "idn": "disebabkan", "vi": "do, bị gây ra bởi"} 2", "idn": "larutan", "vi": "dung dịch"}, {"id": "u10-v53", "idn": "air hangat", "vi": "nước ấm"}, {"id": "u10-v54", "idn": "tiga kali sehari", "vi": "ba lần một ngày"}, {"id": "u10-v55", "idn": "aturan pakai", "vi": "cách dùng"}, {"id": "u10-v56", "idn": "aturan pemakaian", "vi": "quy định sử dụng"}, {"id": "u10-v57", "idn": "khasiat", "vi": "công dụng"}, {"id": "u10-v58", "idn": "komposisi", "vi": "thành phần"}, {"id": "u10-v59", "idn": "tablet", "vi": "viên nén"}, {"id": "u10-v60", "idn": "dosis", "vi": "liều lượng"}, {"id": "u10-v61", "idn": "maksimum", "vi": "tối đa"}, {"id": "u10-v62", "idn": "produksi", "vi": "sản xuất"}, {"id": "u10-v63", "idn": "mengurangi", "vi": "giảm"}, {"id": "u10-v64", "idn": "frekuensi", "vi": "tần suất"}, {"id": "u10-v65", "idn": "buang air besar", "vi": "đi đại tiện"}, {"id": "u10-v66", "idn": "menyerap", "vi": "hấp thụ"}, {"id": "u10-v67", "idn": "racun", "vi": "độc tố"}, {"id": "u10-v68", "idn": "merepotkan", "vi": "làm phiền"}, {"id": "u10-v69", "idn": "kenapa", "vi": "tại sao, sao"}, {"id": "u10-v70", "idn": "tidak masuk sekolah", "vi": "không đi học"}, {"id": "u10-v71", "idn": "cuaca", "vi": "thời tiết"}, {"id": "u10-v72", "idn": "cerah", "vi": "quang đãng, nắng đẹp"}, {"id": "u10-v73", "idn": "berawan", "vi": "có mây"}, {"id": "u10-v74", "idn": "badai", "vi": "bão"}, {"id": "u10-v75", "idn": "kerokan", "vi": "cạo gió (kerokan)"}, {"id": "u10-v76", "idn": "pengobatan tradisional", "vi": "y học dân gian"}, {"id": "u10-v77", "idn": "menggesekkan", "vi": "cọ xát"}, {"id": "u10-v78", "idn": "benda tumpul", "vi": "vật cùn"}, {"id": "u10-v79", "idn": "perut kembung", "vi": "đầy bụng"}, {"id": "u10-v80", "idn": "flu", "vi": "cúm", "note": "bổ sung", "extra": true}, {"id": "u10-v81", "idn": "batuk", "vi": "ho", "note": "bổ sung", "extra": true}, {"id": "u10-v82", "idn": "pilek", "vi": "sổ mũi", "note": "bổ sung", "extra": true}, {"id": "u10-v83", "idn": "gigi", "vi": "răng", "note": "bổ sung", "extra": true}, {"id": "u10-v84", "idn": "apotek", "vi": "hiệu thuốc", "note": "bổ sung", "extra": true}], "dialogs": [{"title": "Audio 10 — Adit bị ốm", "kind": "dialog", "lines": [{"who": "Adit", "idn": "Aduh, kepalaku pusing sekali.", "vi": "Ôi, đầu mình chóng mặt quá."}, {"who": "Indri", "idn": "Kenapa, Dit? Apa kamu sakit?", "vi": "Sao vậy, Dit? Bạn bị ốm à?"}, {"who": "Adit", "idn": "Iya, Indri. Kemarin hujan deras. Aku kehujanan.", "vi": "Ừ, Indri. Hôm qua mưa to. Mình bị mắc mưa."}, {"who": "Indri", "idn": "Apakah kamu sudah berobat ke dokter?", "vi": "Bạn đã đi khám bác sĩ chưa?"}, {"who": "Adit", "idn": "Belum.", "vi": "Chưa."}, {"who": "Indri", "idn": "Aku buatkan teh panas, ya.", "vi": "Mình pha trà nóng cho bạn nhé."}, {"who": "Adit", "idn": "Terima kasih, Indri. Maaf, ya, merepotkan.", "vi": "Cảm ơn Indri. Xin lỗi nhé, làm phiền bạn."}, {"who": "Indri", "idn": "Tidak merepotkan, Adit. Setelah ini, aku antar ke dokter.", "vi": "Không phiền đâu Adit. Sau đó mình đưa bạn đi bác sĩ."}, {"who": "Adit", "idn": "Baiklah. Sekali lagi terima kasih, ya.", "vi": "Được rồi. Một lần nữa cảm ơn nhé."}, {"who": "Indri", "idn": "Sama-sama.", "vi": "Không có gì."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/585BIPA_2_UMUM_UNIT_10_AUDIO_10.mp3"}, {"title": "Dialog 10 — Bị tiêu chảy và uống oresol", "kind": "dialog", "lines": [{"who": "Pras", "idn": "Datil, kenapa kemarin kamu tidak masuk sekolah?", "vi": "Datil, sao hôm qua bạn không đi học?"}, {"who": "Datil", "idn": "Kemarin aku diare, Pras.", "vi": "Hôm qua mình bị tiêu chảy, Pras."}, {"who": "Pras", "idn": "Hmm, apa kamu sudah sembuh?", "vi": "Hmm, bạn khỏi chưa?"}, {"who": "Datil", "idn": "Sudah. Aku minum oralit.", "vi": "Khỏi rồi. Mình đã uống oresol."}, {"who": "Pras", "idn": "Bagaimana aturan pakainya?", "vi": "Cách dùng thế nào?"}, {"who": "Datil", "idn": "Seduh larutan oralit dengan air hangat. Minum tiga kali sehari.", "vi": "Pha dung dịch oresol với nước ấm. Uống ba lần một ngày."}, {"who": "Pras", "idn": "Syukurlah kamu sudah sembuh.", "vi": "May quá bạn khỏi rồi."}, {"who": "Datil", "idn": "Terima kasih, Pras.", "vi": "Cảm ơn Pras."}]}, {"title": "Kegiatan 4 — Hỏi bạn về thuốc đã uống", "kind": "dialog", "lines": [{"who": "A", "idn": "Apa obat yang pernah Anda minum?", "vi": "Bạn đã từng uống thuốc gì?"}, {"who": "B", "idn": "Saya minum obat sakit kepala tiga kali sehari.", "vi": "Mình uống thuốc đau đầu ba lần một ngày."}]}, {"title": "Teks 10 — Bị sốt xuất huyết", "kind": "text", "lines": [{"idn": "Sakit Demam Berdarah", "vi": "Bị sốt xuất huyết"}, {"idn": "Pada suatu hari saya tiba-tiba merasa sangat mual.", "vi": "Một hôm tôi bỗng thấy rất buồn nôn."}, {"idn": "Badan saya terasa demam. Otot saya sangat sakit.", "vi": "Người tôi thấy sốt. Cơ tôi rất đau."}, {"idn": "Muka saya menjadi sangat pucat.", "vi": "Mặt tôi trở nên rất xanh xao."}, {"idn": "Wali kelas mengantar saya ke rumah sakit.", "vi": "Giáo viên chủ nhiệm đưa tôi đến bệnh viện."}, {"idn": "Setelah diperiksa, saya mengalami gejala demam berdarah.", "vi": "Sau khi được khám, tôi có triệu chứng sốt xuất huyết."}, {"idn": "Penyakit ini disebabkan virus yang dibawa oleh nyamuk Aedes aegypti.", "vi": "Bệnh này do vi-rút do muỗi Aedes aegypti mang đến."}, {"idn": "Saya langsung dimasukkan ke ruang rawat inap.", "vi": "Tôi được đưa ngay vào phòng điều trị nội trú."}, {"idn": "Perawat memasang infus di lengan saya.", "vi": "Y tá gắn dây truyền dịch ở cánh tay tôi."}, {"idn": "Saya tidak boleh memakan makanan dari luar rumah sakit selama dirawat.", "vi": "Tôi không được ăn đồ ăn từ ngoài bệnh viện trong thời gian nằm viện."}, {"idn": "Saya pun dianjurkan untuk sering meminum air.", "vi": "Tôi cũng được khuyên uống nước thường xuyên."}, {"idn": "Selain itu, saya diminta untuk memakan buah-buahan yang mengandung vitamin C.", "vi": "Ngoài ra, tôi được yêu cầu ăn trái cây có chứa vitamin C."}, {"idn": "Saya hanya bisa berbaring di tempat tidur selama dirawat di rumah sakit.", "vi": "Tôi chỉ có thể nằm trên giường trong thời gian nằm viện."}, {"idn": "Akhirnya, saya boleh pulang setelah dirawat selama 5 hari.", "vi": "Cuối cùng, tôi được về nhà sau khi nằm viện 5 ngày."}, {"idn": "Mulai saat itu, saya menjaga kebersihan rumah saya.", "vi": "Từ lúc đó, tôi giữ vệ sinh nhà mình."}, {"idn": "Hal itu saya lakukan supaya tidak ada nyamuk lagi.", "vi": "Tôi làm vậy để không còn muỗi nữa."}]}, {"title": "Kegiatan 6 — Nhãn thuốc tiêu chảy", "kind": "text", "lines": [{"idn": "Obat Diare", "vi": "Thuốc tiêu chảy"}, {"idn": "Khasiat:", "vi": "Công dụng:"}, {"idn": "1. Mengurangi frekuensi buang air besar", "vi": "1. Giảm số lần đi đại tiện"}, {"idn": "2. Menyerap racun penyebab diare", "vi": "2. Hấp thụ độc tố gây tiêu chảy"}, {"idn": "Komposisi: Tiap tablet (325 mg) mengandung activated charcoal (125 mg)", "vi": "Thành phần: Mỗi viên (325 mg) chứa than hoạt tính (125 mg)"}, {"idn": "Aturan Pakai: 5—7 tablet per dosis. Maksimum 20 tablet/hari", "vi": "Cách dùng: 5–7 viên mỗi liều. Tối đa 20 viên/ngày"}, {"idn": "Produksi: P.T. Eagle Indo Pharma", "vi": "Sản xuất: P.T. Eagle Indo Pharma"}]}, {"title": "Wawasan — Kerokan", "kind": "text", "lines": [{"idn": "Salah satu pengobatan tradisional yang ada di Indonesia adalah kerokan.", "vi": "Một cách chữa bệnh truyền thống ở Indonesia là kerokan (cạo gió)."}, {"idn": "Kerokan adalah suatu metode pengobatan dengan cara menggesekkan benda tumpul pada tubuh.", "vi": "Kerokan là phương pháp chữa bệnh bằng cách cọ xát vật cùn lên cơ thể."}, {"idn": "Cara itu dipercaya dapat menyembuhkan masuk angin, nyeri otot, perut kembung, mual, sakit kepala, dan meriang.", "vi": "Cách này được tin là có thể chữa cảm gió, đau cơ, đầy bụng, buồn nôn, đau đầu và ớn lạnh."}]}], "grammar": [{"title": "Mô tả cảm giác: pusing, mual", "body": "Dùng tính từ để nói cảm giác trong người: *Kepalaku **pusing** sekali.* *Aku masih merasa **mual**.* Cấu trúc: **bộ phận + -ku + tính từ**, hoặc **merasa + tính từ**.", "examples": [{"idn": "Kepalaku pusing sekali.", "vi": "Đầu mình chóng mặt quá."}, {"idn": "Aku masih merasa mual.", "vi": "Mình vẫn còn thấy buồn nôn."}]}, {"title": "Từ vựng về thời tiết", "body": "Từ chỉ thời tiết: **hujan deras** (mưa to), **cerah** (quang đãng), **berawan** (có mây), **badai** (bão).", "examples": [{"idn": "Kemarin hujan deras.", "vi": "Hôm qua mưa to."}, {"idn": "Hari ini cuaca cerah.", "vi": "Hôm nay trời quang đãng."}]}, {"title": "Hỏi cách dùng thuốc", "body": "Hỏi: **Bagaimana aturan pakainya?** Trả lời: **Minum + số lần + sehari.** Nói công dụng: **Obat ini berkhasiat untuk ...** / **Fungsi obat ini adalah ...**", "examples": [{"idn": "Bagaimana aturan pakainya?", "vi": "Cách dùng thế nào?"}, {"idn": "Minum tiga kali sehari.", "vi": "Uống ba lần một ngày."}, {"idn": "Seduh larutan oralit dengan air hangat.", "vi": "Pha dung dịch oresol với nước ấm."}]}, {"title": "Câu bị động với di-", "body": "**Di- + động từ gốc** tạo câu bị động: *diperiksa* (được khám), *dirawat* (được chăm sóc), *dianjurkan* (được khuyên), *diminta* (được yêu cầu), *disebabkan* (do/bị gây ra bởi).", "examples": [{"idn": "Setelah diperiksa, saya mengalami gejala demam berdarah.", "vi": "Sau khi được khám, tôi có triệu chứng sốt xuất huyết."}, {"idn": "Penyakit ini disebabkan virus.", "vi": "Bệnh này do vi-rút gây ra."}, {"idn": "Saya dianjurkan untuk sering meminum air.", "vi": "Tôi được khuyên uống nước thường xuyên."}]}, {"title": "Thuốc: khasiat, komposisi, aturan pakai", "body": "Nhãn thuốc có: **Khasiat** (công dụng), **Komposisi** (thành phần), **Aturan Pakai** (cách dùng), **Produksi** (nhà sản xuất). Khi viết về thuốc, nêu tên thuốc, công dụng và cách uống.", "examples": [{"idn": "Khasiat: Mengurangi frekuensi buang air besar.", "vi": "Công dụng: Giảm số lần đi đại tiện."}, {"idn": "Aturan Pakai: 5—7 tablet per dosis.", "vi": "Cách dùng: 5–7 viên mỗi liều."}]}], "exercises": [{"id": "u10-x01", "t": "mcq", "q": "\"obat\" nghĩa là", "opts": ["thuốc", "bệnh", "bác sĩ", "bệnh viện"], "a": 0, "e": "obat = thuốc."}, {"id": "u10-x02", "t": "mcq", "q": "\" /* ---------- dữ liệu level ---------- */
function loadLevels(){

    }
  }
  if (location.protocol === 'file:') {
    fallback();
    lsGet(LS_X,[]).forEach(function(lv){var i=out.findIndex(function(o){return o.id===lv.id});if(i>=0)out[i]=lv;else out.push(lv)});
    LEVELS=out;
    return Promise.resolve();
  }
  return fetch('levels/index.json',{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(idx){
    return (idx.levels||[]).reduce(function(p,it){
      return p.then(function(){

        }).then(function(lv){out.push(lv)}).catch(function(){});

}

var RATE_LABELS={new:'Mới',r0:'Quên',r1:'Khó',r2:'Nhớ',r3:'Dễ'};

  var h=(location.hash||'').replace(/^#/,'');
  if(!h||h==='home')return {v:'level',lv:curLevel()};
  if(h==='review')return {v:'review'};
  var p=h.split('-'),lv=LEVELS.find(function(l){return l.id===p[0]});
  if(!lv)return {v:'level',lv:curLevel()};
  if(p.length===1)return {v:'level',lv:lv};
  if(p[1]==='cards')return {v:'cards',lv:lv};
  if(p[1]==='test')return {v:'testall',lv:lv};
  var m=/^u(\d+)$/.exec(p[1]),u=m&&lv.units.find(function(x){return x.num===+m[1]});
  if(!u)return {v:'level',lv:lv};
  var tab=p[2]||'vocab';
  if(tab==='cards')return {v:'cards',lv:lv,u:u};
  if(tab==='test'||tab==='retry')return {v:'test',lv:lv,u:u,retry:tab==='retry'};
  return {v:'unit',lv:lv,u:u,tab:tab};
}
function go(h){if(location.hash==='#'+h)render();else{location.hash=h}}
function uh(lv,u,tab){return lv.id+'-u'+u.num+(tab?'-'+tab:'')}

    '<div class="acts"><a class="btn primary" href="#'+lv.id+'-cards">Học thẻ'+(due+Math.min(10,fresh)?' ('+(due+Math.min(10,fresh))+')':'')+'</a>'+

    var cs=cardsOf(lv,u),done=cs.length-newCards(cs).length,pct=cs.length?Math.round(done*100/cs.length):0;
    var q=P.quiz[lv.id+':'+u.id];

      '<div class="chips">'+(q?'<span class="chip '+(q.best>=80?'good':'warn')+'">Bài tập '+q.best+'%</span>':'<span class="chip">Chưa làm bài tập</span>')+'</div></div>'+

  }).join('')+'</div>';

function updatePanel(){

    '<p class="muted" style="margin:0">Mỗi level là một file JSON trong thư mục <code>levels/</code>. Khi học tiếp BIPA 2, BIPA 3..., gửi giáo trình mới cho Claude, Claude sẽ tạo file level và thêm vào <code>levels/index.json</code>. Level mới tự xuất hiện ở đây.</p>'+

        (counts.r1?'<button class="chip-btn r1" data-act="filterpick" data-f="r1">Khó ('+counts.r1+')</button>':'')+
        ((counts.r0||counts.r1)?'<button class="chip-btn r0" data-act="filterpick" data-f="hard">Quên &amp; Khó ('+(counts.r0+counts.r1)+')</button>':'')+

/* ---------- Flashcard ---------- */
function startCustomCards(key,cards,label,backH){
  var q=shuffle(cards.slice());
  RUN={key:key,type:'cards',queue:q,total:q.length,flipped:false,counts:[0,0,0,0],label:label,back:backH,rev:!!UI.rev,pool:cards,spoken:'',custom:true};
}
function startCards(key,cards,newLimit,label,backH){
  var due=dueCards(cards),fresh=newCards(cards).slice(0,newLimit);
  RUN={key:key,type:'cards',queue:due.concat(fresh),total:due.length+fresh.length,flipped:false,counts:[0,0,0,0],label:label,back:backH,rev:!!UI.rev,pool:cards,spoken:'',custom:false};
}
function viewCards(){
  var r=RUN;
  if(!r.queue.length){
    var moreNew=newCards(r.pool).length;
    var isCustom=!!r.custom;
    var hardCards=r.pool.filter(function(c){var st=rateStatusOf(c);return st==='r0'||st==='r1'});
    return shell('<div class="runner stack">'+back(r.label,r.back)+
      '<section class="card empty stack">'+
        '<h2>'+(r.total?(isCustom?'Hoàn thành luyện tập!':'Xong phiên học!'):'Không có thẻ nào đến hạn')+'</h2>'+
        (r.total?
          '<div class="chips" style="justify-content:center">'+
            '<span class="chip warn">Quên '+r.counts[0]+'</span>'+
            '<span class="chip warn">Khó '+r.counts[1]+'</span>'+
            '<span class="chip teal">Nhớ '+r.counts[2]+'</span>'+
            '<span class="chip good">Dễ '+r.counts[3]+'</span>'+
          '</div>':
          '<p class="muted">Bạn đã ôn hết thẻ theo lịch SRS hôm nay. Bạn có thể luyện tập tự do bất cứ lúc nào!</p>'
        )+
        '<div class="row" style="justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap">'+
          (r.total?'<button class="btn primary" data-act="repeatcustom">Luyện tập lại danh sách này ('+r.pool.length+' từ)</button>':'')+
          (hardCards.length?'<button class="btn" data-act="repeatcustomhard">Ôn lại từ Quên &amp; Khó ('+hardCards.length+' từ)</button>':'')+
          (moreNew&&!isCustom?'<button class="btn primary" data-act="morecards">Học thêm 10 từ mới</button>':'')+
          '<a class="btn" href="#'+r.back+'">Quay lại</a>'+
        '</div>'+
      '</section>'+
    '</div>');
  }
  var c=r.queue[0],s=P.cards[c.key],isNew=!s;
  var spkBtnHtml='<button type="button" class="fc-spk" data-act="speak" data-text="'+esc(c.v.idn)+'" title="Nghe phát âm (hoặc phím R)">'+spkIcon()+' Nghe phát âm <span class="muted" style="font-size:.75rem">(R)</span></button>';
  var front=r.rev?'<div class="face vi">'+esc(c.v.vi)+'</div>':'<div class="face">'+esc(c.v.idn)+'</div>'+spkBtnHtml;
  var backFace=r.rev?'<div class="face">'+esc(c.v.idn)+'</div>'+spkBtnHtml:'<div class="face vi">'+esc(c.v.vi)+'</div>';
  var meta='<div class="muted small">Unit '+c.u.num+' · '+esc(c.u.title)+(isNew?' · từ mới':'')+'</div>';
  var done=r.total-r.queue.length;
  var face='<div class="fc" data-act="flip" role="button" tabindex="0" aria-label="Lật thẻ">'+meta+front+(r.flipped?'<div class="back stack" style="gap:6px;align-items:center">'+backFace+(c.v.note?'<div class="muted small">'+esc(c.v.note)+'</div>':'')+'</div>':'<div class="hint">Bấm hoặc nhấn phím cách để xem nghĩa</div>')+'</div>';
  var rates=r.flipped?'<div class="rates">'+[['Quên','r0'],['Khó','r1'],['Nhớ','r2'],['Dễ','r3']].map(function(x,i){return '<button class="rate '+x[1]+'" data-act="rate" data-g="'+i+'">'+x[0]+'<small>'+fmtIv(nextDays(s,i))+'</small></button>'}).join('')+'</div>':'';
  return shell('<div class="runner">'+back(r.label,r.back)+
    '<div class="rtop">'+
      '<div class="bar grow" role="progressbar" aria-valuemin="0" aria-valuemax="'+r.total+'" aria-valuenow="'+done+'"><i style="width:'+Math.round(done*100/r.total)+'%"></i></div>'+
      '<span class="muted small">Còn '+r.queue.length+'</span>'+
      '<label class="toggle small" style="margin:0 4px" title="Tự động phát âm thanh khi xem từ"><input type="checkbox" id="autospeak"'+(UI.autoSpeech?' checked':'')+'> Tự đọc</label>'+
      '<button class="btn small" data-act="dir">'+(r.rev?'Việt → Indo':'Indo → Việt')+'</button>'+
    '</div>'+
    face+rates+
    '<p class="muted small" style="text-align:center;margin-top:12px">Phím tắt: cách = lật thẻ, R = nghe lại, 1 Quên, 2 Khó, 3 Nhớ, 4 Dễ</p></div>');
}
function doRate(g){
  var r=RUN;if(!r||r.type!=='cards'||!r.flipped)return;
  var c=r.queue.shift();rate(c,g);r.counts[g]++;
  if(g===0)r.queue.splice(Math.min(3,r.queue.length),0,c);
  r.flipped=false;render();
}

/* ---------- Bài tập ---------- */
function startTest(key,items,label,backH,opts){
  RUN={key:key,type:'test',items:items.map(function(it){return it}),i:0,res:[],state:null,label:label,back:backH,opts:opts||{}};
  prepQ();
}
function prepQ(){
  var r=RUN,it=r.items[r.i];if(!it)return;
  var x=it.x;
  if(x.t==='mcq'){r.state={opts:shuffle(x.opts.map(function(t,i){return {t:t,ok:i===x.a}})),picked:-1,done:false}}
  else r.state={val:'',done:false,ok:false};
}
function qHtml(){
  var r=RUN,it=r.items[r.i],x=it.x,s=r.state;
  var body='';
  if(x.t==='mcq'){
    body='<div class="opts">'+s.opts.map(function(o,i){
      var cls='opt'+(s.done?(o.ok?' ok':(i===s.picked?' no':'')):'');
      return '<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(s.done?' disabled':'')+'><span class="k">'+(i+1)+'</span><span>'+esc(o.t)+'</span></button>'}).join('')+'</div>';
  }else{
    var parts=x.q.split('___');
    body='<form class="fill" data-act="check"><input id="ans" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Câu trả lời"'+(s.done?' disabled':'')+' value="'+esc(s.val)+'"><button class="btn primary" type="submit"'+(s.done?' disabled':'')+'>Kiểm tra</button></form>';
  }
  var qt=x.t==='fill'?esc(x.q).replace('___','<span style="border-bottom:2px solid var(--teal);padding:0 18px">&nbsp;</span>'):esc(x.q);
  var fb='';
  if(s.done){
    var ok=x.t==='mcq'?s.opts[s.picked]&&s.opts[s.picked].ok:s.ok;
    var ans=x.t==='mcq'?x.opts[x.a]:x.a.join(' / ');
    fb='<div class="fb '+(ok?'ok':'no')+'" role="status">'+(ok?'Đúng.':'Chưa đúng. Đáp án: '+esc(ans))+(x.e?'<span class="why">'+esc(x.e)+'</span>':'')+'</div>'+
      '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn primary" data-act="nextq">'+(r.i===r.items.length-1?'Xem kết quả':'Câu tiếp')+'</button></div>';
  }
  return '<section class="card q"><div class="muted small">Câu '+(r.i+1)+'/'+r.items.length+' · Unit '+it.u.num+' · '+(x.t==='mcq'?'Trắc nghiệm':'Điền từ')+'</div><div class="qt">'+qt+'</div>'+body+fb+'</section>';
}
function viewTest(){
  var r=RUN;
  if(!r.items.length)return shell('<div class="runner stack">'+back(r.label,r.back)+'<div class="card empty"><h2>Không có câu nào để làm</h2></div></div>');
  if(r.i>=r.items.length){
    var ok=r.res.filter(function(x){return x.ok}).length,pct=Math.round(ok*100/r.items.length);
    var wr=r.res.filter(function(x){return !x.ok});
    return shell('<div class="runner stack">'+back(r.label,r.back)+'<section class="card stack"><div class="muted small">Kết quả</div><div class="score">'+ok+'/'+r.items.length+' <span class="muted" style="font-size:1.4rem">('+pct+'%)</span></div>'+
      '<p style="margin:0">'+(pct>=90?'Rất tốt. Bạn nắm chắc Unit này.':pct>=70?'Khá tốt. Xem lại các câu sai bên dưới.':'Nên đọc lại ghi chú ngữ pháp và học thêm thẻ từ vựng rồi làm lại.')+'</p>'+
      (wr.length?'<div><h3>Câu cần xem lại</h3><ul class="wrong">'+wr.map(function(w){var x=w.it.x;return '<li><b>'+esc(x.q.replace('___','…'))+'</b><br><span class="muted">Đáp án: '+esc(x.t==='mcq'?x.opts[x.a]:x.a.join(' / '))+(x.e?'. '+esc(x.e):'')+'</span></li>'}).join('')+'</ul></div>':'')+
      '<div class="row"><a class="btn primary" href="#'+r.back+'">Xong</a>'+(r.opts.again?'<button class="btn" data-act="again">Làm lại toàn bộ</button>':'')+'</div></section></div>');
  }
  var pr=Math.round(r.i*100/r.items.length);
  return shell('<div class="runner">'+back(r.label,r.back)+'<div class="rtop"><div class="bar grow"><i style="width:'+pr+'%"></i></div></div>'+qHtml()+'</div>');
}
function pickAns(i){
  var r=RUN,s=r.state;if(!r||s.done)return;
  s.picked=i;s.done=true;r.res.push({it:r.items[r.i],ok:!!s.opts[i].ok});render();
}
function checkAns(){
  var r=RUN,s=r.state,it=r.items[r.i];if(s.done)return;
  var inp=document.getElementById('ans');var v=inp?inp.value:'';
  if(!norm(v)){if(inp)inp.focus();return}
  s.val=v;s.done=true;s.ok=it.x.a.some(function(a){return norm(a)===norm(v)});
  r.res.push({it:it,ok:s.ok});render();
}
function nextQ(){
  var r=RUN;r.i++;
  if(r.i>=r.items.length)finishTest();else prepQ();
  render();
}
function finishTest(){
  var r=RUN;if(!r.opts.save)return;
  var key=r.opts.save,ok=r.res.filter(function(x){return x.ok}).length,pct=Math.round(ok*100/r.items.length);
  var q=P.quiz[key]||{best:0,last:0,n:0,wrong:[]};
  var wrongIds=r.res.filter(function(x){return !x.ok}).map(function(x){return x.it.x.id});
  if(r.opts.retry){q.wrong=wrongIds}else{q.best=Math.max(q.best,pct);q.last=pct;q.n++;q.wrong=wrongIds}
  P.quiz[key]=q;touch();
}
function itemsOf(lv,u){return u.exercises.map(function(x){return {x:x,u:u}})}

/* ---------- vẽ ---------- */
var lastKey='';
function render(){
  var root=document.getElementById('root');if(!root)return;
  var rt=parseRoute(),key=location.hash||'#home',html='';
  if(RUN&&RUN.key!==key)RUN=null;
  if(rt.v==='level')html=viewLevel(rt.lv);
  else if(rt.v==='unit')html=viewUnit(rt.lv,rt.u,rt.tab);
  else if(rt.v==='review'){
    if(!RUN){var all=[];LEVELS.forEach(function(lv){all=all.concat(cardsOf(lv))});startCards(key,all,0,'Ôn tập hôm nay','home')}
    html=viewCards();
  }else if(rt.v==='cards'){
    if(!RUN)startCards(key,cardsOf(rt.lv,rt.u),10,rt.u?('Unit '+rt.u.num+' · '+rt.u.title):rt.lv.title,rt.u?uh(rt.lv,rt.u):rt.lv.id);
    html=viewCards();
  }else if(rt.v==='test'){
    if(!RUN){
      var q=P.quiz[rt.lv.id+':'+rt.u.id],items=itemsOf(rt.lv,rt.u);
      if(rt.retry&&q&&q.wrong&&q.wrong.length)items=items.filter(function(it){return q.wrong.indexOf(it.x.id)>=0});
      startTest(key,rt.retry?items:shuffle(items),'Bài tập Unit '+rt.u.num,uh(rt.lv,rt.u,'quiz'),{save:rt.lv.id+':'+rt.u.id,retry:rt.retry,again:!rt.retry});
    }
    html=viewTest();
  }else if(rt.v==='testall'){
    if(!RUN){
      var pool=[];rt.lv.units.forEach(function(u){pool=pool.concat(itemsOf(rt.lv,u))});
      startTest(key,shuffle(pool).slice(0,15),'Kiểm tra tổng hợp '+rt.lv.title,rt.lv.id,{again:true});
    }
    html=viewTest();
  }
  root.innerHTML=html;
  if(lastKey!==key){window.scrollTo(0,0);lastKey=key}
  var a=document.getElementById('ans');if(a&&RUN&&RUN.state&&!RUN.state.done)a.focus();
  if(RUN&&RUN.type==='cards'&&UI.autoSpeech&&RUN.queue.length){
    var cur=RUN.queue[0],sk=cur.key+':'+(RUN.flipped?'b':'f');
    if(RUN.spoken!==sk){
      RUN.spoken=sk;
      if((!RUN.rev&&!RUN.flipped)||(RUN.rev&&RUN.flipped)){
        setTimeout(function(){speak(cur.v.idn)},120);
      }
    }
  }
}

/* ---------- sự kiện ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act');
  if(act==='speak'){
    e.stopPropagation();
    speak(t.getAttribute('data-text'));
  }
  else if(act==='audiospd'){
    var card=t.closest('.audio-card');
    if(card){
      var aud=card.querySelector('audio');
      var spd=+t.getAttribute('data-spd')||1.0;
      if(aud)aud.playbackRate=spd;
      card.querySelectorAll('[data-act="audiospd"]').forEach(function(b){b.classList.toggle('active',b===t)});
    }
  }
  else if(act==='setspeechrate'){
    UI.speechRate=+t.getAttribute('data-rate')||0.9;
    saveUI();render();
  }
  else if(act==='startpractice'){
    var uid=t.getAttribute('data-uid');
    var isAll=t.getAttribute('data-all')==='1';
    var rt=parseRoute();
    var u=rt.u||(rt.lv&&rt.lv.units.find(function(x){return x.id===uid}));
    if(!u)return;
    var cs=cardsOf(rt.lv,u);
    var picked=isAll?cs:cs.filter(function(c){return SEL_CARDS&&SEL_CARDS[c.v.id]});
    if(!picked.length)picked=cs;
    var key=rt.lv.id+':'+u.id+':practice:'+NOW();
    startCustomCards(key,picked,'Luyện tập · Unit '+u.num,uh(rt.lv,u,'vocab'));
    render();
  }
  else if(act==='filterpick'){
    var f=t.getAttribute('data-f');
    var rt=parseRoute();
    if(rt.u){
      var cs=cardsOf(rt.lv,rt.u);
      if(!SEL_CARDS)SEL_CARDS={};
      cs.forEach(function(c){
        var st=rateStatusOf(c);
        if(f==='all')SEL_CARDS[c.v.id]=true;
        else if(f==='none')SEL_CARDS[c.v.id]=false;
        else if(f==='hard')SEL_CARDS[c.v.id]=(st==='r0'||st==='r1');
        else SEL_CARDS[c.v.id]=(st===f);
      });
      render();
    }
  }
  else if(act==='repeatcustom'){
    var r=RUN;
    if(r&&r.pool&&r.pool.length){
      startCustomCards(r.key+':'+NOW(),r.pool,r.label,r.back);
      render();
    }
  }
  else if(act==='repeatcustomhard'){
    var r=RUN;
    if(r&&r.pool&&r.pool.length){
      var hard=r.pool.filter(function(c){var st=rateStatusOf(c);return st==='r0'||st==='r1'});
      if(!hard.length)hard=r.pool;
      startCustomCards(r.key+':hard:'+NOW(),hard,r.label+' (Quên & Khó)',r.back);
      render();
    }
  }
  else if(act==='resetunit'){
    var uid=t.getAttribute('data-uid');
    var rt=parseRoute();
    var u=rt.u||(rt.lv&&rt.lv.units.find(function(x){return x.id===uid}));
    if(!u)return;
    if(confirm('Bạn có muốn đặt lại tiến độ học từ vựng của Unit '+u.num+'? Các từ sẽ trở về trạng thái Chưa học.')){
      var cs=cardsOf(rt.lv,u);
      cs.forEach(function(c){delete P.cards[c.key]});
      touch();
      if(SEL_CARDS&&SEL_UNIT===u.id){
        cs.forEach(function(c){SEL_CARDS[c.v.id]=true});
      }
      render();
    }
  }
  else if(act==='flip'){RUN.flipped=!RUN.flipped;render()}
  else if(act==='rate')doRate(+t.getAttribute('data-g'));
  else if(act==='dir'){UI.rev=!UI.rev;RUN.rev=UI.rev;saveUI();render()}
  else if(act==='morecards'){var key=RUN.key,pool=RUN.pool,lab=RUN.label,bk=RUN.back;startCards(key,pool,10,lab,bk);render()}
  else if(act==='pick')pickAns(+t.getAttribute('data-i'));
  else if(act==='nextq')nextQ();
  else if(act==='again'){var r=RUN;r.items=shuffle(r.items);r.i=0;r.res=[];prepQ();render()}
  else if(act==='reveal'){if(UI.hideVi)t.classList.toggle('show')}
  else if(act==='clearextra'){lsSet(LS_X,[]);loadLevels().then(function(){render();var m=document.getElementById('impmsg');if(m)m.textContent='Đã xóa các level nhập thủ công.'})}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-act="check"]');if(f){e.preventDefault();checkAns()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList.contains('v-chk')){
    var vid=t.getAttribute('data-vid');
    if(!SEL_CARDS)SEL_CARDS={};
    SEL_CARDS[vid]=t.checked;
    render();
    return;
  }
  if(t.id==='autospeak'){UI.autoSpeech=t.checked;saveUI()}
  else if(t.id==='hidevi'){UI.hideVi=t.checked;saveUI();var l=document.querySelector('.vlist');if(l)l.classList.toggle('hide-vi',UI.hideVi);document.querySelectorAll('.v.show').forEach(function(n){n.classList.remove('show')})}
  else if(t.id==='trans'){UI.noTrans=!t.checked;saveUI();var d=document.getElementById('dlgs');if(d)d.classList.toggle('no-trans',UI.noTrans)}
  else if(t.id==='imp'&&t.files&&t.files[0]){
    var rd=new FileReader(),m=document.getElementById('impmsg');
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result),err=validLevel(o);
        if(err){m.textContent='File không hợp lệ: '+err;return}
        var ex=lsGet(LS_X,[]).filter(function(l){return l.id!==o.id});ex.push(o);lsSet(LS_X,ex);
        loadLevels().then(function(){UI.level=o.id;saveUI();render();var m2=document.getElementById('impmsg');if(m2)m2.textContent='Đã thêm level '+o.title+'.'});
      }catch(ex2){m.textContent='Không đọc được file JSON.'}
    };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',function(e){
  if(!RUN||e.ctrlKey||e.metaKey||e.altKey)return;
  var tag=(e.target.tagName||'').toLowerCase();
  if(RUN.type==='cards'){
    if(tag==='button'&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(RUN.queue.length){RUN.flipped=!RUN.flipped;render()}}
    else if((e.key==='r'||e.key==='R'||e.key==='s'||e.key==='S')&&RUN.queue.length){
      e.preventDefault();speak(RUN.queue[0].v.idn);
    }
    else if(RUN.flipped&&/^[1-4]$/.test(e.key)){doRate(+e.key-1)}
  }else if(RUN.type==='test'&&RUN.state&&tag!=='input'){
    var it=RUN.items[RUN.i];if(!it)return;
    if(!RUN.state.done&&it.x.t==='mcq'&&/^[1-9]$/.test(e.key)&&+e.key<=RUN.state.opts.length){pickAns(+e.key-1)}
    else if(RUN.state.done&&(e.key==='Enter'||e.key===' ')&&tag!=='button'){e.preventDefault();nextQ()}
  }
});
document.addEventListener('play',function(e){
  if(e.target.tagName==='AUDIO'&&window.speechSynthesis){
    window.speechSynthesis.cancel();
  }
},true);
window.addEventListener('hashchange',render);

/* ---------- khởi động ---------- */
document.getElementById('root').innerHTML='<p class="muted" style="padding:40px 0">Đang tải…</p>';
loadLevels().then(function(){render();initRemote();if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}});
})();
</script>

</body></html>
