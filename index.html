<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Belajar Indonesia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C4263A">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: một cột trung tâm 920px; trang chủ là lưới thẻ Unit, mỗi Unit là một trang có 5 tab; flashcard và bài tập chạy toàn khung. */
:root{
  --bg:#F1F5F7; --surface:#FFFFFF; --surface2:#E7EDF1; --ink:#11202A; --muted:#566873; --line:#D3DCE2;
  --accent:#C4263A; --accent-ink:#FFFFFF; --teal:#0A7570; --teal-soft:#DAF0EE;
  --good:#1B7F46; --good-soft:#DCF3E4; --bad:#B3261E; --bad-soft:#FBE2DF; --warn:#7A5200; --warn-soft:#FAEBC6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D161C; --surface:#152229; --surface2:#1E2E37; --ink:#E7EEF2; --muted:#97A9B4; --line:#283A44;
    --accent:#F0586B; --accent-ink:#1A0A0D; --teal:#42C7C0; --teal-soft:#123635;
    --good:#52C37F; --good-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1A18; --warn:#F2C35E; --warn-soft:#3A2C0E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161C; --surface:#152229; --surface2:#1E2E37; --ink:#E7EEF2; --muted:#97A9B4; --line:#283A44;
  --accent:#F0586B; --accent-ink:#1A0A0D; --teal:#42C7C0; --teal-soft:#123635;
  --good:#52C37F; --good-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1A18; --warn:#F2C35E; --warn-soft:#3A2C0E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:920px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;background:linear-gradient(var(--accent) 50%,var(--surface) 50%);border:2px solid var(--ink)}
nav.main{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{min-height:36px;padding:0 14px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.78rem;font-weight:700}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.crumb{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;color:var(--muted);margin:6px 0 10px;cursor:pointer;background:none;border:0;padding:6px 0}
.crumb:hover{color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:22px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;color:var(--accent)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.lvtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.lvtabs .btn[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.unit{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.unit:hover{border-color:var(--teal)}
.unit .num{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--teal)}
.unit .t{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;background:var(--surface2);font-size:.8rem;font-weight:600;color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 18px;-webkit-overflow-scrolling:touch}
.tabs a{white-space:nowrap;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.goals{margin:10px 0 0;padding-left:20px;color:var(--muted)}
/* vocab */
.vlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.v{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:11px 16px;border-top:1px solid var(--line);align-items:center}
.v:first-child{border-top:0}
.v .idn{font-weight:700}
.v .note{display:block;color:var(--muted);font-size:.82rem;font-weight:400}
.hide-vi .v .vi{visibility:hidden;cursor:pointer}
.hide-vi .v.show .vi{visibility:visible}
.hide-vi .v{cursor:pointer}
.v-chk-wrap{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.v-chk{width:18px;height:18px;accent-color:var(--teal);cursor:pointer;margin:0}
.st{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.st.learn{background:var(--warn-soft);color:var(--warn)}
.st.done{background:var(--good-soft);color:var(--good)}
.st.r0{background:var(--bad-soft);color:var(--bad)}
.st.r1{background:var(--warn-soft);color:var(--warn)}
.st.r2{background:var(--teal-soft);color:var(--teal)}
.st.r3{background:var(--good-soft);color:var(--good)}
.st.new{background:var(--surface2);color:var(--muted)}
.tag-extra{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--teal-soft);color:var(--teal);margin-left:6px;vertical-align:middle}
@media (max-width:560px){
  .v{grid-template-columns:26px minmax(0,1fr) auto}
  .v-chk-wrap{grid-column:1;grid-row:1/3}
  .v .idn{grid-column:2/3;grid-row:1}
  .v .vi{grid-column:2/3;grid-row:2}
  .v .st{grid-column:3/4;grid-row:1/3}
}
/* practice box & chips */
.practice-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.chip-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.chip-btn:hover{border-color:var(--teal);color:var(--ink)}
.chip-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip-btn.r0{border-color:var(--bad);color:var(--bad)}
.chip-btn.r0:hover{background:var(--bad-soft)}
.chip-btn.r1{border-color:var(--warn);color:var(--warn)}
.chip-btn.r1:hover{background:var(--warn-soft)}
.chip-btn.r2{border-color:var(--teal);color:var(--teal)}
.chip-btn.r2:hover{background:var(--teal-soft)}
.chip-btn.r3{border-color:var(--good);color:var(--good)}
.chip-btn.r3:hover{background:var(--good-soft)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--teal)}
/* dialogs */
.dlg h3{margin-bottom:10px}
.ln{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ln:first-of-type{border-top:0}
.ln.nowho{grid-template-columns:minmax(0,1fr)}
.ln .who{font-weight:700;color:var(--teal);font-size:.9rem;padding-top:2px}
.ln .vi{color:var(--muted);font-size:.92rem;display:block}
.no-trans .ln .vi{display:none}
@media (max-width:480px){.ln{grid-template-columns:minmax(0,1fr)}}
/* grammar */
.g .body{margin:8px 0 12px}
.ex{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ex div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:9px 14px;border-top:1px solid var(--line)}
.ex div:first-child{border-top:0}
.ex b{font-weight:700}
.ex span{color:var(--muted)}
@media (max-width:560px){.ex div{grid-template-columns:minmax(0,1fr)}}
/* audio & speech */
.spk-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--teal);cursor:pointer;padding:0;flex:none;transition:transform .12s,background .12s,color .12s;vertical-align:middle}
.spk-btn:hover{background:var(--teal);color:#fff;border-color:var(--teal);transform:scale(1.1)}
.spk-btn:active{transform:scale(.92)}
.spk-btn.mini{width:22px;height:22px}
.spk-btn.mini svg{width:13px;height:13px}
.spk-btn svg{width:15px;height:15px;pointer-events:none}
.audio-card{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.audio-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.audio-badge{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal)}
.audio-spds{display:inline-flex;gap:4px;align-items:center}
.spd-btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:.75rem;font-weight:700;padding:2px 8px;min-height:26px;cursor:pointer;color:var(--muted);transition:all .15s}
.spd-btn:hover{border-color:var(--teal);color:var(--ink)}
.spd-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.audio-elem{width:100%;height:38px;border-radius:8px;outline:none;margin-top:4px}
.fc-spk{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--teal);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
.fc-spk:hover{background:var(--teal);color:#fff;border-color:var(--teal);transform:scale(1.04)}
.fc-spk svg{width:16px;height:16px}
.ln-idn,.ex-idn{display:flex;align-items:flex-start;gap:8px}
.ln-idn span,.ex-idn b{word-break:break-word}
.v-idn{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
/* runner */
.runner{max-width:640px;margin:0 auto}
.rtop{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
.fc{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:28px 20px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;cursor:pointer;width:100%}
.fc .face{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.15;text-wrap:balance}
.fc .face.vi{font-family:var(--f-body);font-weight:600;font-size:clamp(1.4rem,5vw,2rem)}
.fc .hint{color:var(--muted);font-size:.9rem}
.fc .back{border-top:1px dashed var(--line);padding-top:14px;width:100%}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;justify-content:center;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;padding:6px}
.rate small{font-weight:500;color:var(--muted);font-size:.75rem}
.rate:hover{border-color:var(--teal)}
.rate.r0{border-color:var(--bad)}
.rate.r3{border-color:var(--good)}
@media (max-width:420px){.rates{grid-template-columns:repeat(2,1fr)}}
.q{padding:22px}
.q .qt{font-family:var(--f-display);font-size:1.3rem;font-weight:700;line-height:1.3;margin:6px 0 16px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;min-height:48px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt .k{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border-radius:6px;background:var(--surface2);font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fill{display:flex;gap:10px;flex-wrap:wrap}
.fill input{flex:1;min-width:160px;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .why{display:block;font-weight:500;color:var(--ink);margin-top:4px}
.score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1}
.wrong li{margin:6px 0}
.culture p{margin:.6em 0 0;max-width:68ch}
.empty{text-align:center;padding:32px 16px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
details.upd{margin-top:28px}
details.upd summary{cursor:pointer;font-weight:700}
details.upd .body{margin-top:12px}
code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:.88em}
.foot{margin-top:30px;color:var(--muted);font-size:.85rem}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:no-preference){.fc,.opt,.rate,.unit{transition:border-color .15s}}
</style>

<div class="wrap" id="root"></div>

{"id": "bipa1", "title": "BIPA 1", "subtitle": "Sahabatku Indonesia untuk Pelajar", "cefr": "A1", "source": "Badan Pengembangan dan Pembinaan Bahasa, Kemendikbud, 2019", "units": [{"id": "u01", "num": 1, "title": "Salam", "vi_title": "Chào hỏi", "goals": ["Hiểu và dùng các câu chào hỏi người khác", "Hỏi thăm sức khỏe, xin lỗi và chào tạm biệt", "Dùng câu đơn giản và từ hỏi apa (gì)"], "vocab": [{"id": "u01-v01", "idn": "selamat pagi", "vi": "chào buổi sáng", "note": "dùng buổi sáng"}, {"id": "u01-v02", "idn": "selamat siang", "vi": "chào buổi trưa / đầu giờ chiều"}, {"id": "u01-v03", "idn": "selamat sore", "vi": "chào buổi chiều"}, {"id": "u01-v04", "idn": "selamat malam", "vi": "chào buổi tối"}, {"id": "u01-v05", "idn": "hai", "vi": "chào (thân mật)", "note": "dùng với bạn bè"}, {"id": "u01-v06", "idn": "apa kabar?", "vi": "bạn khỏe không? / dạo này thế nào?"}, {"id": "u01-v07", "idn": "baik", "vi": "tốt, khỏe", "note": "đáp lại apa kabar"}, {"id": "u01-v08", "idn": "maaf", "vi": "xin lỗi"}, {"id": "u01-v09", "idn": "tidak apa-apa", "vi": "không sao đâu", "note": "đáp lại maaf"}, {"id": "u01-v10", "idn": "sampai jumpa", "vi": "hẹn gặp lại"}, {"id": "u01-v11", "idn": "permisi", "vi": "xin phép, xin lỗi cho tôi qua"}, {"id": "u01-v12", "idn": "pergi", "vi": "đi"}, {"id": "u01-v13", "idn": "dulu", "vi": "trước (đi trước, làm trước)"}, {"id": "u01-v14", "idn": "ya", "vi": "vâng; nhé (cuối câu)"}, {"id": "u01-v15", "idn": "Pak", "vi": "ông, bác, chú, thầy", "note": "nam lớn tuổi hơn"}, {"id": "u01-v16", "idn": "Bu", "vi": "bà, cô, bác gái, cô giáo", "note": "nữ lớn tuổi hơn"}, {"id": "u01-v17", "idn": "aku", "vi": "tôi, mình", "note": "thân mật"}, {"id": "u01-v18", "idn": "saya", "vi": "tôi", "note": "trang trọng"}, {"id": "u01-v19", "idn": "kamu", "vi": "bạn, cậu", "note": "thân mật"}, {"id": "u01-v20", "idn": "apa", "vi": "gì, cái gì"}, {"id": "u01-v21", "idn": "sedang", "vi": "đang"}, {"id": "u01-v22", "idn": "makan", "vi": "ăn"}, {"id": "u01-v23", "idn": "tidur", "vi": "ngủ"}, {"id": "u01-v24", "idn": "mandi", "vi": "tắm"}, {"id": "u01-v25", "idn": "belajar", "vi": "học"}, {"id": "u01-v26", "idn": "soto", "vi": "soto (món súp truyền thống)"}, {"id": "u01-v27", "idn": "mencuci baju", "vi": "giặt quần áo"}, {"id": "u01-v28", "idn": "menulis surat", "vi": "viết thư"}, {"id": "u01-v29", "idn": "bermain bola", "vi": "chơi bóng"}], "dialogs": [{"title": "Audio 1.1 — Chào buổi sáng", "kind": "dialog", "lines": [{"who": "Andi", "idn": "Selamat pagi, Dinda.", "vi": "Chào buổi sáng, Dinda."}, {"who": "Dinda", "idn": "Pagi, Andi.", "vi": "Chào buổi sáng, Andi."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/671BIPA_1_UMUM_AUDIO_1.1.mp3"}, {"title": "Audio 1.2 — Hỏi thăm", "kind": "dialog", "lines": [{"who": "Niken", "idn": "Hai, Raden.", "vi": "Chào Raden."}, {"who": "Raden", "idn": "Hai, Niken.", "vi": "Chào Niken."}, {"who": "Niken", "idn": "Apa kabar?", "vi": "Bạn khỏe không?"}, {"who": "Raden", "idn": "Baik.", "vi": "Khỏe."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/274BIPA_1_UMUM_AUDIO_1.2.mp3"}, {"title": "Dialog 1.1 — Xin lỗi và tạm biệt", "kind": "dialog", "lines": [{"who": "Hayati", "idn": "Apa kabar, Arai?", "vi": "Bạn khỏe không, Arai?"}, {"who": "Arai", "idn": "Baik, Hayati. Maaf, aku pergi dulu, ya.", "vi": "Khỏe, Hayati. Xin lỗi, mình đi trước nhé."}, {"who": "Hayati", "idn": "Tidak apa-apa, Arai.", "vi": "Không sao đâu, Arai."}, {"who": "Arai", "idn": "Sampai jumpa.", "vi": "Hẹn gặp lại."}, {"who": "Hayati", "idn": "Sampai jumpa.", "vi": "Hẹn gặp lại."}]}], "grammar": [{"title": "Chào theo buổi trong ngày", "body": "Thay **pagi** bằng **siang, sore, malam** tùy thời điểm. Khi đáp lại có thể bỏ chữ *selamat*. Với bạn bè dùng **hai**.", "examples": [{"idn": "Selamat pagi. → Pagi.", "vi": "Chào buổi sáng. → Chào buổi sáng."}, {"idn": "Selamat sore. → Sore.", "vi": "Chào buổi chiều. → Chào buổi chiều."}, {"idn": "Hai, Raden. → Hai, Niken.", "vi": "Chào Raden. → Chào Niken."}]}, {"title": "Pak và Bu: gọi người lớn tuổi", "body": "**Pak** dùng cho nam lớn tuổi hơn, **Bu** cho nữ lớn tuổi hơn. Đứng trước tên: *Pak Budi, Bu Sinta*.", "examples": [{"idn": "Selamat siang, Pak/Bu ___.", "vi": "Chào buổi trưa, thưa ông/bà ___."}]}, {"title": "Câu đơn giản: Chủ ngữ + Động từ (+ Tân ngữ)", "body": "Câu cơ bản có thứ tự giống tiếng Việt. Thêm **sedang** trước động từ để nói *đang làm*. Trang trọng thì đổi **aku** thành **saya**.", "examples": [{"idn": "Aku sedang makan.", "vi": "Tôi đang ăn."}, {"idn": "Aku makan soto.", "vi": "Tôi ăn soto."}, {"idn": "Aku mandi.", "vi": "Tôi tắm."}, {"idn": "Aku bermain bola.", "vi": "Tôi chơi bóng."}]}, {"title": "Từ hỏi apa (gì)", "body": "**apa** dùng để hỏi trạng thái, hành động hoặc sự vật.", "examples": [{"idn": "Apa kabar? → Baik.", "vi": "Bạn khỏe không? → Khỏe. (hỏi trạng thái)"}, {"idn": "Kamu sedang apa? → Aku sedang makan.", "vi": "Bạn đang làm gì? → Tôi đang ăn. (hỏi hành động)"}, {"idn": "Makan apa? → Aku makan soto.", "vi": "Ăn gì? → Tôi ăn soto. (hỏi sự vật)"}]}], "exercises": [{"id": "u01-x01", "t": "mcq", "q": "Đáp lại \"Selamat pagi, Dinda.\"", "opts": ["Pagi, Andi.", "Sampai jumpa.", "Maaf.", "Aku makan soto."], "a": 0, "e": "Chào buổi sáng thì đáp lại bằng Pagi."}, {"id": "u01-x02", "t": "mcq", "q": "\"Apa kabar?\" nghĩa là gì?", "opts": ["Bạn tên gì?", "Bạn khỏe không?", "Bạn đi đâu?", "Bạn ăn gì?"], "a": 1, "e": "Apa kabar? dùng để hỏi thăm sức khỏe."}, {"id": "u01-x03", "t": "mcq", "q": "Câu trả lời phù hợp nhất cho \"Apa kabar?\"", "opts": ["Baik.", "Sampai jumpa.", "Maaf.", "Selamat malam."], "a": 0, "e": "Baik = khỏe, tốt."}, {"id": "u01-x04", "t": "mcq", "q": "Gặp một bà cô lớn tuổi, bạn gọi là", "opts": ["Pak", "Bu", "Hai", "Kamu"], "a": 1, "e": "Bu dành cho nữ lớn tuổi."}, {"id": "u01-x05", "t": "fill", "q": "Selamat ___, Bu. (chào buổi sáng)", "a": ["pagi"], "e": "selamat pagi."}, {"id": "u01-x06", "t": "mcq", "q": "Ai đó nói \"Maaf.\" Bạn đáp", "opts": ["Tidak apa-apa.", "Hai.", "Sampai jumpa.", "Makan soto."], "a": 0, "e": "Tidak apa-apa = không sao."}, {"id": "u01-x07", "t": "mcq", "q": "Bạn chuẩn bị đi về, bạn nói", "opts": ["Sampai jumpa.", "Selamat pagi.", "Apa kabar?", "Maaf."], "a": 0, "e": "Sampai jumpa = hẹn gặp lại."}, {"id": "u01-x08", "t": "fill", "q": "Aku ___ makan. (đang)", "a": ["sedang"], "e": "sedang đứng trước động từ để diễn tả đang làm."}, {"id": "u01-x09", "t": "mcq", "q": "Từ nào mang nghĩa \"tôi\" trong tình huống trang trọng?", "opts": ["aku", "saya", "kamu", "hai"], "a": 1, "e": "Saya trang trọng, aku thân mật."}, {"id": "u01-x10", "t": "mcq", "q": "\"Kamu sedang apa?\" trả lời thế nào?", "opts": ["Aku sedang makan.", "Baik.", "Sampai jumpa.", "Selamat siang."], "a": 0, "e": "Hỏi bạn đang làm gì thì trả lời hành động."}, {"id": "u01-x11", "t": "mcq", "q": "\"Aku mandi\" nghĩa là", "opts": ["Tôi tắm", "Tôi ngủ", "Tôi học", "Tôi ăn"], "a": 0, "e": "mandi = tắm."}, {"id": "u01-x12", "t": "mcq", "q": "Khi nào dùng \"Selamat malam\"?", "opts": ["Buổi tối", "Buổi sáng", "Buổi trưa", "Buổi chiều"], "a": 0, "e": "malam = tối."}], "culture": {"title": "Salam keagamaan di Indonesia", "vi": "Khi phát biểu hoặc nói chuyện trước đông người, người Indonesia thường dùng các lời chào theo tôn giáo: **Assalamualaikum** (Hồi giáo), **Salam sejahtera** (Cơ đốc giáo), **Om swastiastu** (Hindu) và **Namo buddhaya** (Phật giáo). Cách chào này nhằm chào hỏi cộng đồng đến từ nhiều tôn giáo khác nhau."}}, {"id": "u02", "num": 2, "title": "Perkenalan Ni Luh", "vi_title": "Tự giới thiệu", "goals": ["Nhận biết từ và cụm từ về thông tin cá nhân", "Nói câu đơn giản về bản thân và người khác", "Đọc đoạn văn ngắn tự giới thiệu và điền biểu mẫu thông tin cá nhân"], "vocab": [{"id": "u02-v01", "idn": "kenalkan", "vi": "xin giới thiệu, để tôi giới thiệu"}, {"id": "u02-v02", "idn": "nama", "vi": "tên"}, {"id": "u02-v03", "idn": "nama lengkap", "vi": "họ tên đầy đủ"}, {"id": "u02-v04", "idn": "usia", "vi": "tuổi"}, {"id": "u02-v05", "idn": "tahun", "vi": "năm; tuổi"}, {"id": " e": "số đếm bổ sung", "extra": true}, {"id": "u02-v38", "idn": "enam", "vi": "sáu", "note": "số đếm bổ sung", "extra": true}, {"id": "u02-v39", "idn": "tujuh", "vi": "bảy", "note": "số đếm bổ sung", "extra": true}, {"id": "u02-v40", "idn": "delapan", "vi": "tám", "note": "số đếm bổ sung", "extra": true}, {"id": "u02-v41", "idn": "sembilan", "vi": "chín", "note": "số đếm bổ sung", "extra": true}, {"id": "u02-v42", "idn": "sepuluh", "vi": "mười", "note": "số đếm bổ sung", "extra": true}, {"id": "u02-v43", "idn": "sebelas", "vi": "mười một", "note": "số đếm bổ sung", "extra": true}, {"id": "u02-v44", "idn": "dua puluh", "vi": "hai mươi", "note": "số đếm bổ sung", "extra": true}, {"id": "u02-v45", "idn": "seratus", "vi": "một trăm", "note": "số đếm bổ sung", "extra": true}, {"id": "u02-v46", "idn": "seribu", "vi": "một nghìn", "note": "số đếm bổ sung", "extra": true}], "dialogs": [{"title": "Audio 2.1 — Ni Luh tự giới thiệu", "kind": "text", "lines": [{"idn": "Kenalkan, nama saya Ni Luh Putu Riyandewi.", "vi": "Xin giới thiệu, tên tôi là Ni Luh Putu Riyandewi."}, {"idn": "Usia saya dua puluh empat tahun.", "vi": "Tôi hai mươi bốn tuổi."}, {"idn": "Saya berasal dari Bali.", "vi": "Tôi đến từ Bali."}, {"idn": "Saya tinggal di Tabanan.", "vi": "Tôi sống ở Tabanan."}, {"idn": "Saya mahasiswa.", "vi": "Tôi là sinh viên."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/948BIPA_1_UMUM_AUDIO_2.1.mp3"}, {"title": "Audio 2.2 — Nghe giới thiệu bản thân", "kind": "dialog", "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/239BIPA_1_UMUM_AUDIO_2.2.mp3", "lines": [{"who": "Tenri", "idn": "Kenalkan, nama saya Tenri Sanna. Saya berasal dari Makassar. Saya guru.", "vi": "Xin giới thiệu, tên tôi là Tenri Sanna. Tôi đến từ Makassar. Tôi là giáo viên."}, {"who": "Brikjon", "idn": "Kenalkan, nama saya Brikjon Hasugian. Saya berasal dari Medan. Saya dokter.", "vi": "Xin giới thiệu, tên tôi là Brikjon Hasugian. Tôi đến từ Medan. Tôi là bác sĩ."}, {"who": "Lendy", "idn": "Kenalkan, nama saya Lendy Luturmas. Saya berasal dari Ambon. Saya polisi.", "vi": "Xin giới thiệu, tên tôi là Lendy Luturmas. Tôi đến từ Ambon. Tôi là cảnh sát."}]}, {"title": "Dialog 2.1 — Samuel và Cut Syifa", "kind": "dialog", "lines": [{"who": "Samuel", "idn": "Kenalkan, saya Samuel.", "vi": "Xin giới thiệu, tôi là Samuel."}, {"who": "Cut Syifa", "idn": "Kenalkan, saya Cut Syifa.", "vi": "Xin giới thiệu, tôi là Cut Syifa."}, {"who": "Samuel", "idn": "Saya orang Australia.", "vi": "Tôi là người Úc."}, {"who": "Cut Syifa", "idn": "Saya orang Indonesia.", "vi": "Tôi là người Indonesia."}]}, {"title": "Giới thiệu người nổi tiếng", "kind": "text", "lines": [{"idn": "Kenalkan, ini Agnes Monica. Dia penyanyi.", "vi": "Xin giới thiệu, đây là Agnes Monica. Cô ấy là ca sĩ."}, {"idn": "Dia berasal dari Jakarta.", "vi": "Cô ấy đến từ Jakarta."}, {"idn": "Dia lahir tanggal 1 Juli 1986.", "vi": "Cô ấy sinh ngày 1 tháng 7 năm 1986."}]}], "grammar": [{"title": "Mẫu tự giới thiệu", "body": "Dùng **Kenalkan, nama saya ...** hoặc ngắn hơn **Kenalkan, saya ...** để giới thiệu tên. Thông tin khác đi theo mẫu *Saya + ...*.", "examples": [{"idn": "Kenalkan, nama saya Ni Luh.", "vi": "Xin giới thiệu, tên tôi là Ni Luh."}, {"idn": "Usia saya ___ tahun.", "vi": "Tôi ___ tuổi."}, {"idn": "Saya berasal dari Bali.", "vi": "Tôi đến từ Bali."}, {"idn": "Saya tinggal di Tabanan.", "vi": "Tôi sống ở Tabanan."}, {"idn": "Saya mahasiswa.", "vi": "Tôi là sinh viên."}]}, {"title": "orang + tên nước hoặc dân tộc", "body": "Ghép **orang** với tên nước để nói quốc tịch, hoặc với tên dân tộc để nói nguồn gốc dân tộc. Tiếng Indonesia không cần từ *là* trước danh từ nghề nghiệp, quốc tịch.", "examples": [{"idn": "orang + Australia = orang Australia", "vi": "người Úc"}, {"idn": "orang + Indonesia = orang Indonesia", "vi": "người Indonesia"}, {"idn": "Saya orang Jawa.", "vi": "Tôi là người Java."}, {"idn": "Dia orang Batak.", "vi": "Anh ấy là người Batak."}]}, {"title": "Số đếm cơ bản (bổ sung)", "body": "1 **satu**, 2 **dua**, 3 **tiga**, 4 **empat**, 5 **lima**, 6 **enam**, 7 **tujuh**, 8 **delapan**, 9 **sembilan**, 10 **sepuluh**. 11 là **sebelas**, 12 đến 19 là *số + belas* (dua belas, tiga belas...). Tròn chục là *số + puluh* (dua puluh = 20). Ghép lại: **dua puluh empat** = 24. Còn **seratus** = 100, **seribu** = 1.000.", "examples": [{"idn": "dua puluh empat", "vi": "hai mươi bốn (24)"}, {"idn": "tiga puluh lima", "vi": "ba mươi lăm (35)"}, {"idn": "lima puluh ribu", "vi": "năm mươi nghìn (50.000)"}]}, {"title": "Từ hỏi để điền thông tin", "body": "**Siapa** hỏi người, **di mana** hỏi nơi chốn, **apa** hỏi sự vật.", "examples": [{"idn": "Siapa nama lengkap Ni Luh?", "vi": "Họ tên đầy đủ của Ni Luh là gì?"}, {"idn": "Di mana alamat rumah Ni Luh?", "vi": "Địa chỉ nhà Ni Luh ở đâu?"}, {"idn": "Apa pekerjaan Ni Luh?", "vi": "Nghề nghiệp của Ni Luh là gì?"}]}], "exercises": [{"id": "u02-x01", "t": "mcq", "q": "\"Kenalkan, saya Samuel.\" nghĩa là", "opts": ["Xin giới thiệu, tôi là Samuel.", "Tạm biệt, Samuel.", "Samuel khỏe không?", "Samuel đang ăn."], "a": 0, "e": "Kenalkan = xin giới thiệu."}, {"id": "u02-x02", "t": "mcq", "q": "\"Saya berasal dari Bali.\" nghĩa là", "opts": ["Tôi đến từ Bali.", "Tôi sống ở Bali.", "Tôi đi Bali.", "Tôi thích Bali."], "a": 0, "e": "berasal dari = đến từ."}, {"id": "u02-x03", "t": "fill", "q": "Saya ___ Indonesia. (tôi là người Indonesia)", "a": ["orang"], "e": "orang + tên nước."}, {"id": "u02-x04", "t": "mcq", "q": "\"Usia saya dua puluh empat tahun.\" Tuổi của người nói?", "opts": ["24", "14", "42", "20"], "a": 0, "e": "dua puluh = 20, empat = 4."}, {"id": "u02-x05", "t": "mcq", "q": "\"mahasiswa\" nghĩa là", "opts": ["sinh viên", "giáo viên", "ca sĩ", "nông dân"], "a": 0, "e": "mahasiswa = sinh viên."}, {"id": "u02-x06", "t": "mcq", "q": "Từ nào dùng để hỏi một người?", "opts": ["siapa", "apa", "di mana", "kapan"], "a": 0, "e": "siapa = ai."}, {"id": "u02-x07", "t": "mcq", "q": "\"Pekerjaan\" trên biểu mẫu là", "opts": ["Nghề nghiệp", "Địa chỉ", "Tôn giáo", "Quốc tịch"], "a": 0, "e": "pekerjaan = nghề nghiệp."}, {"id": "u02-x08", "t": "mcq", "q": "\"Kewarganegaraan\" trên biểu mẫu là", "opts": ["Quốc tịch", "Nhóm máu", "Địa chỉ", "Họ tên"], "a": 0, "e": "kewarganegaraan = quốc tịch."}, {"id": "u02-x09", "t": "fill", "q": "Số 5 trong tiếng Indonesia là ___", "a": ["lima"], "e": "lima = 5."}, {"id": "u02-x10", "t": "fill", "q": "Số 20 trong tiếng Indonesia là ___ puluh", "a": ["dua"], "e": "dua puluh = 20."}, {"id": "u02-x11", "t": "mcq", "q": "\"Saya tinggal di Tabanan.\" thông tin nào?", "opts": ["Nơi ở", "Quê quán", "Tuổi", "Nghề nghiệp"], "a": 0, "e": "tinggal di = sống ở."}, {"id": "u02-x12", "t": "mcq", "q": "Cách nói \"Tôi là người Nhật\"", "opts": ["Saya orang Jepang.", "Saya orang Prancis.", "Saya orang Jawa.", "Saya Jepang orang."], "a": 0, "e": "orang + Jepang."}], "culture": {"title": "Văn hóa làm quen của người Indonesia", "vi": "Người Indonesia thường làm quen bằng cách **bắt tay**, thường là tay phải. Một số người bắt bằng hai tay, khác nhau ở chỗ đầu ngón tay có chạm nhau hay không. Ngoài ra còn có văn hóa **cium tangan (salim)**: hôn lên tay người lớn tuổi để tỏ lòng kính trọng, ví dụ học sinh với thầy cô, con cái với cha mẹ."}}, {"id": "u03", "num": 3, "title": "Keluargaku", "vi_title": "Gia đình tôi", "goals": ["Gọi tên các thành viên trong gia đình", "Giới thiệu gia đình mình bằng câu đơn giản", "Đọc và viết đoạn ngắn mô tả gia đình"], "vocab": [{"id": "u03-v01", "idn": "keluarga", "vi": "gia đình"}, {"id": "u03-v02", "idn": "ayah", "vi": "bố, cha"}, {"id": "u03-v03", "idn": "ibu", "vi": "mẹ"}, {"id": "u03-v04", "idn": "orang tua", "vi": "cha mẹ"}, {"id": "u03-v05", "idn": "kakak", "vi": "anh hoặc chị (người lớn hơn)"}, {"id": "u03-v06", "idn": "kakak perempuan", "vi": "chị gái"}, {"id": "u03-v07", "idn": "kakak laki-laki", "vi": "anh trai"}, {"id": "u03-v08", "idn": "adik", "vi": "em"}, {"id": "u03-v09", "idn": "anak", "vi": "con; đứa trẻ"}, {"id": "u03-v10", "idn": "anak tunggal", "vi": "con một"}, {"id": "u03-v11", "idn": "anak kedua", "vi": "con thứ hai"}, {"id": "u03-v12", "idn": "saudara", "vi": "anh chị em ruột"}, {"id": "u03-v13", "idn": "kakek", "vi": "ông"}, {"id": "u03-v14", "idn": "nenek", "vi": "bà"}, {"id": "u03-v15", "idn": "keponakan", "vi": "cháu (con của anh chị em)"}, {"id": "u03-v16", "idn": "ipar", "vi": "anh/chị/em rể hoặc dâu"}, {"id": "u03-v17", "idn": "kakak ipar", "vi": "anh rể, chị dâu"}, {"id": "u03-v18", "idn": "menikah", "vi": "kết hôn"}, {"id": "u03-v19", "idn": "sudah menikah", "vi": "đã kết hôn"}, {"id": "u03-v20", "idn": "belum menikah", "vi": "chưa kết hôn"}, {"id": "u03-v21", "idn": "punya", "vi": "có (sở hữu)"}, {"id": "u03-v22", "idn": "ada", "vi": "có (tồn tại); ở"}, {"id": "u03-v23", "idn": "foto", "vi": "ảnh"}, {"id": "u03-v24", "idn": "siapa saja", "vi": "những ai"}, {"id": "u03-v25", "idn": "mereka", "vi": "họ"}, {"id": "u03-v26", "idn": "ini", "vi": "này, đây (gần)"}, {"id": "u03-v27", "idn": "itu", "vi": "kia, đó (xa)"}, {"id": "u03-v28", "idn": "-ku", "vi": "của tôi"}, {"id": "u03-v29", "idn": "-mu", "vi": "của bạn"}, {"id": "u03-v30", "idn": "-nya", "vi": "của anh ấy/cô ấy/họ"}, {"id": "u03-v31", "idn": "bagaimana denganmu?", "vi": "còn bạn thì sao?"}, {"id": "u03-v32", "idn": "memanggil", "vi": "gọi"}, {"id": "u03-v33", "idn": "sebutan", "vi": "cách gọi"}, {"id": "u03-v34", "idn": "bapak", "vi": "ông, bác, chú", "note": "(Pak)"}, {"id": "u03-v35", "idn": "mas", "vi": "anh", "note": "dùng ở Java"}, {"id": "u03-v36", "idn": "mbak", "vi": "chị", "note": "dùng ở Java"}], "dialogs": [{"title": "Audio 3.1 — Ảnh gia đình", "kind": "dialog", "lines": [{"who": "Ajeng", "idn": "Raden, itu foto keluargamu?", "vi": "Raden, đó là ảnh gia đình bạn à?"}, {"who": "Raden", "idn": "Iya, Ajeng.", "vi": "Ừ, Ajeng."}, {"who": "Ajeng", "idn": "Siapa saja mereka?", "vi": "Họ là những ai vậy?"}, {"who": "Raden", "idn": "Ini ayah, ibu, aku, dan kakak perempuanku.", "vi": "Đây là bố, mẹ, mình và chị gái mình."}, {"who": "Ajeng", "idn": "O, kamu anak kedua?", "vi": "Ồ, bạn là con thứ hai à?"}, {"who": "Raden", "idn": "Iya. Bagaimana denganmu?", "vi": "Ừ. Còn bạn thì sao?"}, {"who": "Ajeng", "idn": "Aku anak tunggal.", "vi": "Mình là con một."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/860BIPA_1_UMUM_AUDIO_3.1.mp3"}, {"title": "Audio 3.2 — Giới thiệu họ hàng", "kind": "dialog", "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/586BIPA_1_UMUM_AUDIO_3.2.mp3", "lines": [{"who": "Marlina", "idn": "Samuel, kenalkan. Ini sepupuku. Namanya Togar.", "vi": "Samuel, xin giới thiệu. Đây là anh em họ của mình. Tên anh ấy là Togar."}, {"who": "Samuel", "idn": "Hai, namaku Samuel.", "vi": "Chào bạn, tên mình là Samuel."}, {"who": "Togar", "idn": "Namaku Togar. Kamu berasal dari mana?", "vi": "Tên mình là Togar. Bạn đến từ đâu?"}, {"who": "Samuel", "idn": "Aku dari Australia.", "vi": "Mình đến từ Úc."}, {"who": "Togar", "idn": "Apa orang tuamu ada di Australia?", "vi": "Bố mẹ bạn có ở Úc không?"}, {"who": "Samuel", "idn": "Ya, mereka ada di Australia.", "vi": "Có, họ đang ở Úc."}, {"who": "Togar", "idn": "Apa kamu punya saudara?", "vi": "Bạn có anh chị em không?"}, {"who": "Samuel", "idn": "Punya, aku punya satu kakak perempuan.", "vi": "Có, mình có một người chị gái."}]}, {"title": "Teks 3.1 — Keluarga Raden", "kind": "text", "lines": [{"idn": "Ini keluarga Raden. Ada ayah, ibu, kakak perempuan, dan Raden.", "vi": "Đây là gia đình Raden. Có bố, mẹ, chị gái và Raden."}, {"idn": "Orang tua Raden namanya Dedi dan Heni.", "vi": "Cha mẹ của Raden tên là Dedi và Heni."}, {"idn": "Raden punya kakak perempuan. Namanya Rara.", "vi": "Raden có một chị gái. Tên chị là Rara."}, {"idn": "Rara menikah dengan Bayu. Bayu menjadi kakak ipar Raden.", "vi": "Rara kết hôn với Bayu. Bayu là anh rể của Raden."}, {"idn": "Raden punya keponakan. Namanya Tika.", "vi": "Raden có một cháu. Tên cháu là Tika."}, {"idn": "Tika memanggil orang tua Raden dengan sebutan kakek dan nenek.", "vi": "Tika gọi cha mẹ của Raden là ông và bà."}]}], "grammar": [{"title": "ini và itu: chỉ vật gần và xa", "body": "**ini** chỉ vật ở gần, **itu** chỉ vật ở xa.", "examples": [{"idn": "Ini ayahku.", "vi": "Đây là bố tôi."}, {"idn": "Itu foto keluargamu?", "vi": "Đó là ảnh gia đình bạn à?"}]}, {"title": "-ku, -mu, -nya: sở hữu", "body": "Gắn vào cuối danh từ để chỉ sở hữu. **-ku** là của tôi, **-mu** là của bạn, **-nya** là của anh ấy, cô ấy hoặc họ.", "examples": [{"idn": "keluarga saya → keluargaku", "vi": "gia đình của tôi"}, {"idn": "keluarga Anda → keluargamu", "vi": "gia đình của bạn"}, {"idn": "keluarga mereka → keluarganya", "vi": "gia đình của họ"}, {"idn": "kakak perempuanku", "vi": "chị gái của tôi"}]}, {"title": "siapa (ai) hỏi về người", "body": "Dùng **siapa** để hỏi người. Thêm **saja** nghĩa là *những ai*.", "examples": [{"idn": "Siapa saja mereka?", "vi": "Họ là những ai?"}, {"idn": "Foto keluarga siapa itu?", "vi": "Đó là ảnh gia đình của ai?"}]}, {"title": "ada và punya", "body": "**Ada** nói về sự tồn tại: *có*, hoặc *ở*. **Punya** nói về sự sở hữu: *có* theo nghĩa *sở hữu*.", "examples": [{"idn": "Ada ayah, ibu, dan kakak.", "vi": "Có bố, mẹ và chị."}, {"idn": "Raden punya kakak perempuan.", "vi": "Raden có một chị gái."}, {"idn": "Raden belum menikah.", "vi": "Raden chưa kết hôn."}]}], "exercises": [{"id": "u03-x01", "t": "mcq", "q": "\"ayah\" là", "opts": ["bố", "mẹ", "anh", "ông"], "a": 0, "e": "ayah = bố."}, {"id": "u03-x02", "t": "mcq", "q": "\"anak tunggal\" nghĩa là", "opts": ["con một", "con thứ hai", "con gái", "con nuôi"], "a": 0, "e": "tunggal = duy nhất."}, {"id": "u03-x03", "t": "mcq", "q": "\"keluargaku\" nghĩa là", "opts": ["gia đình của tôi", "gia đình của bạn", "gia đình họ", "gia đình tôi và bạn"], "a": 0, "e": "-ku = của tôi."}, {"id": "u03-x04", "t": "mcq", "q": "\"keluargamu\" nghĩa là", "opts": ["gia đình của bạn", "gia đình của tôi", "gia đình của họ", "gia đình lớn"], "a": 0, "e": "-mu = của bạn."}, {"id": "u03-x05", "t": "fill", "q": "Ini ayah___. (bố của tôi)", "a": ["ku"], "e": "gắn -ku sau danh từ."}, {"id": "u03-x06", "t": "mcq", "q": "Vật ở xa dùng từ", "opts": ["itu", "ini", "ada", "punya"], "a": 0, "e": "itu = kia, đó."}, {"id": "u03-x07", "t": "mcq", "q": "\"Raden punya kakak perempuan.\" nghĩa là", "opts": ["Raden có một chị gái.", "Raden là chị gái.", "Raden ở với chị.", "Raden thích chị."], "a": 0, "e": "punya = có (sở hữu)."}, {"id": "u03-x08", "t": "mcq", "q": "Từ hỏi \"ai\"", "opts": ["siapa", "apa", "kapan", "berapa"], "a": 0, "e": "siapa = ai."}, {"id": "u03-x09", "t": "mcq", "q": "\"Bayu menjadi kakak ipar Raden.\" Bayu là", "opts": ["anh rể của Raden", "cha của Raden", "cháu của Raden", "ông của Raden"], "a": 0, "e": "kakak ipar = anh rể, chị dâu."}, {"id": "u03-x10", "t": "mcq", "q": "\"Aku anak tunggal.\" Ajeng", "opts": ["không có anh chị em", "có một chị", "có một em", "có hai anh"], "a": 0, "e": "anak tunggal = con một."}, {"id": "u03-x11", "t": "fill", "q": "Rara ___ dengan Bayu. (kết hôn)", "a": ["menikah"], "e": "menikah = kết hôn."}, {"id": "u03-x12", "t": "mcq", "q": "Tika gọi cha mẹ của Raden là gì?", "opts": ["kakek dan nenek", "ayah dan ibu", "kakak", "adik"], "a": 0, "e": "Tika là cháu nên gọi là ông, bà."}], "culture": {"title": "Cách xưng hô lịch sự của người Indonesia", "vi": "Người Indonesia thường gọi người lớn tuổi là **bapak (Pak)** cho nam và **ibu (Bu)** cho nữ. Ở đảo Java dùng **mas** (nam) và **mbak** (nữ) cho người lớn hơn. Mỗi vùng khác nhau: người Batak dùng *ito, kakak, abang*; người Minang dùng *uda, uni*; người Sunda dùng *teteh, aa*; người Bali dùng *bli, mbok*."}}, {"id": "u04", "num": 4, "title": "Ulang Tahunku", "vi_title": "Sinh nhật của tôi", "goals": ["Nhận biết từ về giờ, thứ, ngày, tháng, năm", "Nói và hỏi về ngày sinh, thời gian", "Đọc đoạn ngắn về sinh nhật và viết thiệp mời"], "vocab": [{"id": "u04-v01", "idn": "ulang tahun", "vi": "sinh nhật"}, {"id": "u04-v02", "idn": "hari ulang tahun", "vi": "ngày sinh nhật"}, {"id": "u04-v03", "idn": "lahir", "vi": "sinh ra"}, {"id": "u04-v04", "idn": "kapan", "vi": "khi nào"}, {"id": "u04-v05", "idn": "tanggal", "vi": "ngày (trong tháng)"}, {"id": "u04-v06", "idn": "pukul", "vi": "giờ, lúc (mấy giờ)"}, {"id": "u04-v07", "idn": "pukul berapa?", "vi": "mấy giờ?"}, {"id": "u04-v08", "idn": "tempat", "vi": "nơi, địa điểm"}, {"id": "u04-v09", "idn": "pesta", "vi": "bữa tiệc"}, {"id": "u04-v10", "idn": "datang", "vi": "đến"}, {"id": "u04-v11", "idn": "tentu saja", "vi": "tất nhiên"}, {"id": "u04-v12", "idn": "undangan", "vi": "thiệp mời, lời mời"}, {"id": "u04-v13", "idn": "mengundang", "vi": "mời"}, {"id": "u04-v14", "idn": "merayakan", "vi": "tổ chức, ăn mừng"}, {"id": "u04-v15", "idn": "hadiah", "vi": "quà"}, {"id": "u04-v16", "idn": "jam tangan", "vi": "đồng hồ đeo tay"}, {"id": "u04-v17", "idn": "peralatan melukis", "vi": "dụng cụ vẽ"}, {"id": "u04-v18", "idn": "pelukis", "vi": "họa sĩ"}, {"id": "u04-v19", "idn": "seni lukis", "vi": "hội họa"}, {"id": "u04-v20", "idn": "berkuliah", "vi": "học đại học"}, {"id": "u04-v21", "idn": "lulus", "vi": "tốt nghiệp, đỗ"}, {"id": "u04-v22", "idn": "seandainya", "vi": "giá như, nếu như"}, {"id": "u04-v23", "idn": "kalau begitu", "vi": "nếu vậy thì"}, {"id": "u04-v24", "idn": "kemarin", "vi": "hôm qua"}, {"id": "u04-v25", "idn": "hari ini", "vi": "hôm nay"}, {"id": "u04-v26", "idn": "besok", "vi": "ngày mai"}, {"id": "u04-v27", "idn": "lusa", "vi": "ngày kia"}, {"id": "u04-v28", "idn": "minggu lalu", "vi": "tuần trước"}, {"id": "u04-v29", "idn": "minggu ini", "vi": "tuần này"}, {"id": "u04-v30", "idn": "minggu depan", "vi": "tuần sau"}, {"id": "u04-v31", "idn": "bulan lalu", "vi": "tháng trước"}, {"id": "u04-v32", "idn": "bulan ini", "vi": "tháng này"}, {"id": "u04-v33", "idn": "bulan depan", "vi": "tháng sau"}, {"id": "u04-v34", "idn": "tahun lalu", "vi": "năm ngoái"}, {"id": "u04-v35", "idn": "tahun ini", "vi": "năm nay"}, {"id": "u04-v36", "idn": "tahun depan", "vi": "năm sau"}, {"id": "u04-v37", "idn": "Senin", "vi": "thứ Hai"}, {"id": "u04-v38", "idn": "Selasa", "vi": "thứ Ba"}, {"id": "u04-v39", "idn": "Rabu", "vi": "thứ Tư"}, {"id": "u04-v40", "idn": "Kamis", "vi": "thứ Năm"}, {"id": "u04-v41", "idn": "Jumat", "vi": "thứ Sáu"}, {"id": "u04-v42", "idn": "Sabtu", "vi": "thứ Bảy"}, {"id": "u04-v43", "idn": "Minggu", "vi": "Chủ nhật"}, {"id": "u04-v44", "idn": "Januari", "vi": "tháng Một"}, {"id": "u04-v45", "idn": "Februari", "vi": "tháng Hai"}, {"id": "u04-v46", "idn": "Maret", "vi": "tháng Ba"}, {"id": "u04-v47", "idn": "April", "vi": "tháng Tư"}, {"id": "u04-v48", "idn": "Mei", "vi": "tháng Năm"}, {"id": "u04-v49", "idn": "Juni", "vi": "tháng Sáu"}, {"id": "u04-v50", "idn": "Juli", "vi": "tháng Bảy"}, {"id": "u04-v51", "idn": "Agustus", "vi": "tháng Tám"}, {"id": "u04-v52", "idn": "September", "vi": "tháng Chín"}, {"id": "u04-v53", "idn": "Oktober", "vi": "tháng Mười"}, {"id": "u04-v54", "idn": "November", "vi": "tháng Mười Một"}, {"id": "u04-v55", "idn": "Desember", "vi": "tháng Mười Hai"}, {"id": "u04-v56", "idn": "kedua", "vi": "thứ hai (số thứ tự)"}, {"id": "u04-v57", "idn": "ketiga", "vi": "thứ ba (số thứ tự)"}, {"id": "u04-v58", "idn": "ke-23", "vi": "thứ 23"}], "dialogs": [{"title": "Audio 4.1 — Ngày sinh của Ajeng", "kind": "dialog", "lines": [{"who": "Raden", "idn": "Kapan kamu lahir, Ajeng?", "vi": "Bạn sinh khi nào, Ajeng?"}, {"who": "Ajeng", "idn": "Aku lahir 16 September 1996.", "vi": "Mình sinh ngày 16 tháng 9 năm 1996."}, {"who": "Raden", "idn": "Kalau begitu, bulan depan ulang tahunmu?", "vi": "Vậy tháng sau là sinh nhật bạn à?"}, {"who": "Ajeng", "idn": "Iya, benar. Apa kamu bisa datang ke pesta ulang tahunku?", "vi": "Ừ, đúng. Bạn có đến dự tiệc sinh nhật của mình được không?"}, {"who": "Raden", "idn": "Ya, tentu saja.", "vi": "Được chứ, tất nhiên rồi."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/702BIPA_1_UMUM_AUDIO_4.1.mp3"}, {"title": "Audio 4.2 — Mời dự tiệc", "kind": "dialog", "lines": [{"who": "Nina", "idn": "Raga, apa kamu bisa datang ke pesta ulang tahunku pada Minggu, 17 November?", "vi": "Raga, bạn có đến dự tiệc sinh nhật của mình vào Chủ nhật 17 tháng 11 được không?"}, {"who": "Raga", "idn": "Ya, tentu saja. Pukul berapa pestanya?", "vi": "Được chứ. Tiệc lúc mấy giờ?"}, {"who": "Nina", "idn": "Pukul 4 sore.", "vi": "4 giờ chiều."}, {"who": "Raga", "idn": "Di mana tempatnya?", "vi": "Ở đâu vậy?"}, {"who": "Nina", "idn": "Di Perumahan Batakan Asri Nomor 6.", "vi": "Ở khu nhà Batakan Asri số 6."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/574BIPA_1_UMUM_AUDIO_4.2.mp3"}, {"title": "Teks 4.1 — Hadiah ulang tahun", "kind": "text", "lines": [{"idn": "Nama saya Mega. Saya anak kedua dari tiga bersaudara.", "vi": "Tên tôi là Mega. Tôi là con thứ hai trong ba anh chị em."}, {"idn": "Saya lahir pada tanggal 2 Mei 1996.", "vi": "Tôi sinh ngày 2 tháng 5 năm 1996."}, {"idn": "Tahun ini saya merayakan ulang tahun yang ke-23 di restoran.", "vi": "Năm nay tôi tổ chức sinh nhật lần thứ 23 ở nhà hàng."}, {"idn": "Teman-teman saya memberi hadiah sebuah jam tangan.", "vi": "Các bạn tôi tặng một chiếc đồng hồ đeo tay."}, {"idn": "Keluarga saya memberi hadiah peralatan melukis.", "vi": "Gia đình tôi tặng dụng cụ vẽ."}, {"idn": "Saat ini saya berkuliah di Jurusan Seni Lukis.", "vi": "Hiện nay tôi học khoa Hội họa."}, {"idn": "Seandainya lulus kuliah nanti, saya ingin menjadi pelukis.", "vi": "Giá như tốt nghiệp xong, tôi muốn trở thành họa sĩ."}]}], "grammar": [{"title": "kapan: hỏi thời gian", "body": "Dùng **kapan** để hỏi *khi nào*. Hỏi giờ dùng **Pukul berapa?**. Hỏi nơi dùng **di mana**.", "examples": [{"idn": "Kapan kamu lahir? → Aku lahir 16 September 1996.", "vi": "Bạn sinh khi nào? → Mình sinh ngày 16/9/1996."}, {"idn": "Pukul berapa pestanya? → Pukul 4 sore.", "vi": "Tiệc lúc mấy giờ? → 4 giờ chiều."}, {"idn": "Di mana tempatnya?", "vi": "Ở đâu vậy?"}]}, {"title": "Số thứ tự và số đếm", "body": "**ke-** + số tạo số thứ tự: *ke-23* (thứ 23). Các từ **kesatu, kedua, ketiga** là thứ nhất, thứ hai, thứ ba. Số đếm (kardinal): 1, 2, 3... 100.", "examples": [{"idn": "Saya anak kedua dari tiga bersaudara.", "vi": "Tôi là con thứ hai trong ba anh chị em."}, {"idn": "ulang tahun yang ke-23", "vi": "sinh nhật lần thứ 23"}]}, {"title": "Từ chỉ thời gian", "body": "Cặp trái nghĩa: **lalu** là trước, **ini** là hiện tại, **depan** là sau. Dùng với *minggu* (tuần), *bulan* (tháng), *tahun* (năm). Ngày: **kemarin** (hôm qua), **hari ini**, **besok**, **lusa**.", "examples": [{"idn": "Kemarin Lia mengirim undangan.", "vi": "Hôm qua Lia gửi thiệp mời."}, {"idn": "Besok Lia akan membeli baju ulang tahun.", "vi": "Ngày mai Lia sẽ mua váy sinh nhật."}, {"idn": "Bulan depan hari ulang tahun Lia.", "vi": "Tháng sau là sinh nhật Lia."}, {"idn": "Tahun lalu, tahun ini, tahun depan", "vi": "Năm ngoái, năm nay, năm sau"}]}, {"title": "seandainya: giả định", "body": "**Seandainya** dùng để nói điều giả định hoặc mong ước, nghĩa là *giá như, nếu như*.", "examples": [{"idn": "Seandainya lulus kuliah, saya ingin menjadi pelukis.", "vi": "Giá như tốt nghiệp, tôi muốn làm họa sĩ."}]}], "exercises": [{"id": "u04-x01", "t": "mcq", "q": "\"Kapan kamu lahir?\" hỏi về", "opts": ["Thời gian sinh", "Nơi sinh", "Tên", "Nghề nghiệp"], "a": 0, "e": "kapan = khi nào."}, {"id": "u04-x02", "t": "mcq", "q": "\"Pukul berapa pestanya?\" hỏi về", "opts": ["Giờ", "Địa điểm", "Số người", "Giá tiền"], "a": 0, "e": "pukul = giờ."}, {"id": "u04-x03", "t": "mcq", "q": "\"Di mana tempatnya?\" hỏi về", "opts": ["Địa điểm", "Giờ", "Người", "Quà"], "a": 0, "e": "di mana = ở đâu."}, {"id": "u04-x04", "t": "mcq", "q": "\"besok\" nghĩa là", "opts": ["ngày mai", "hôm qua", "hôm nay", "ngày kia"], "a": 0, "e": "besok = ngày mai."}, {"id": "u04-x05", "t": "mcq", "q": "\"kemarin\" nghĩa là", "opts": ["hôm qua", "ngày mai", "ngày kia", "tuần trước"], "a": 0, "e": "kemarin = hôm qua."}, {"id": "u04-x06", "t": "mcq", "q": "\"bulan depan\" nghĩa là", "opts": ["tháng sau", "tháng trước", "tháng này", "năm sau"], "a": 0, "e": "depan = sau, tới."}, {"id": "u04-x07", "t": "mcq", "q": "\"Rabu\" là thứ mấy?", "opts": ["Thứ Tư", "Thứ Ba", "Thứ Năm", "Thứ Sáu"], "a": 0, "e": "Rabu = thứ Tư."}, {"id": "u04-x08", "t": "mcq", "q": "\"Minggu\" nghĩa là", "opts": ["Chủ nhật hoặc tuần", "Tháng", "Năm", "Giờ"], "a": 0, "e": "Minggu vừa là Chủ nhật vừa là tuần."}, {"id": "u04-x09", "t": "fill", "q": "\"Agustus\" là tháng ___ (số)", "a": ["8", "tám"], "e": "Agustus = tháng 8."}, {"id": "u04-x10", "t": "mcq", "q": "Mega là con thứ mấy?", "opts": ["Thứ hai", "Thứ nhất", "Thứ ba", "Con một"], "a": 0, "e": "anak kedua = con thứ hai."}, {"id": "u04-x11", "t": "mcq", "q": "Gia đình Mega tặng gì?", "opts": ["Dụng cụ vẽ", "Đồng hồ", "Sách", "Điện thoại"], "a": 0, "e": "Bạn bè tặng đồng hồ, gia đình tặng dụng cụ vẽ."}, {"id": "u04-x12", "t": "mcq", "q": "\"hadiah\" nghĩa là", "opts": ["quà", "thiệp mời", "bữa tiệc", "nhà hàng"], "a": 0, "e": "hadiah = quà."}, {"id": "u04-x13", "t": "fill", "q": "___ depan hari ulang tahun Lia. (tháng sau)", "a": ["Bulan"], "e": "bulan depan = tháng sau."}, {"id": "u04-x14", "t": "mcq", "q": "\"Ya, tentu saja.\" nghĩa là", "opts": ["Được chứ, tất nhiên.", "Không, cảm ơn.", "Xin lỗi, tôi bận.", "Hẹn gặp lại."], "a": 0, "e": "tentu saja = tất nhiên."}], "culture": {"title": "Hỏi tuổi ở Indonesia", "vi": "Khi làm quen, người Indonesia đôi khi hỏi tuổi để hiểu nhau hơn. Ở công sở, cấp trên hoặc đồng nghiệp lớn tuổi có thể hỏi tuổi để biết kinh nghiệm làm việc. Họ hàng lâu ngày gặp lại cũng hỏi tuổi, ví dụ ông hỏi cháu, chú hỏi cháu. Giữa bạn bè, hỏi tuổi là cách để thân thiết hơn. Đây là việc bình thường, không bị coi là thất lễ."}}, {"id": "u05", "num": 5, "title": "Liburanku", "vi_title": "Kỳ nghỉ của tôi", "goals": ["Nhận biết từ về hoạt động trong kỳ nghỉ", "Nói và hỏi về kỳ nghỉ, mua sắm, giá cả", "Hiểu tiền tố ber- và đọc bài kể về chuyến đi"], "vocab": [{"id": "u05-v01", "idn": "liburan", "vi": "kỳ nghỉ, đi nghỉ"}, {"id": "u05-v02", "idn": "berwisata", "vi": "đi du lịch", "note": "ber- + wisata"}, {"id": "u05-v03", "idn": "tempat wisata", "vi": "địa điểm du lịch"}, {"id": "u05-v04", "idn": "mau", "vi": "muốn; sẽ"}, {"id": "u05-v05", "idn": "ke mana", "vi": "đi đâu"}, {"id": "u05-v06", "idn": "menarik", "vi": "hấp dẫn, thú vị"}, {"id": "u05-v07", "idn": "pulau", "vi": "đảo"}, {"id": "u05-v08", "idn": "air terjun", "vi": "thác nước"}, {"id": "u05-v09", "idn": "gua", "vi": "hang động"}, {"id": "u05-v10", "idn": "desa", "vi": "làng"}, {"id": "u05-v11", "idn": "rumah adat", "vi": "nhà truyền thống"}, {"id": "u05-v12", "idn": "berbentuk kerucut", "vi": "có hình nón"}, {"id": "u05-v13", "idn": "menyenangkan", "vi": "vui, dễ chịu"}, {"id": "u05-v14", "idn": "jernih", "vi": "trong (nước)"}, {"id": "u05-v15", "idn": "kolam", "vi": "hồ, ao"}, {"id": "u05-v16", "idn": "biru", "vi": "xanh dương"}, {"id": "u05-v17", "idn": "berwarna", "vi": "có màu"}, {"id": "u05-v18", "idn": "permisi", "vi": "xin phép, cho hỏi"}, {"id": "u05-v19", "idn": "silakan", "vi": "xin mời, cứ tự nhiên"}, {"id": "u05-v20", "idn": "ya, silakan", "vi": "vâng, xin mời"}, {"id": "u05-v21", "idn": "terima kasih", "vi": "cảm ơn"}, {"id": "u05-v22", "idn": "sama-sama", "vi": "không có gì"}, {"id": "u05-v23", "idn": "beli", "vi": "mua"}, {"id": "u05-v24", "idn": "berbelanja", "vi": "mua sắm"}, {"id": "u05-v25", "idn": "oleh-oleh", "vi": "quà mang về"}, {"id": "u05-v26", "idn": "roti", "vi": "bánh mì"}, {"id": "u05-v27", "idn": "bungkus", "vi": "gói"}, {"id": "u05-v28", "idn": "harga", "vi": "giá"}, {"id": "u05-v29", "idn": "berapa", "vi": "bao nhiêu"}, {"id": "u05-v30", "idn": "berapa harganya?", "vi": "giá bao nhiêu?"}, {"id": "u05-v31", "idn": "ribu", "vi": "nghìn"}, {"id": "u05-v32", "idn": "rupiah", "vi": "rupiah (tiền Indonesia)"}, {"id": "u05-v33", "idn": "uang", "vi": "tiền"}, {"id": "u05-v34", "idn": "ini uangnya", "vi": "đây là tiền"}, {"id": "u05-v35", "idn": "bagaimana", "vi": "thế nào"}, {"id": "u05-v36", "idn": "berjalan kaki", "vi": "đi bộ"}, {"id": "u05-v37", "idn": "berkeliling", "vi": "đi quanh, dạo quanh"}, {"id": "u05-v38", "idn": "menginap", "vi": "ở lại qua đêm"}, {"id": "u05-v39", "idn": "berfoto", "vi": "chụp ảnh"}, {"id": "u05-v40", "idn": "berbaju", "vi": "mặc áo"}, {"id": "u05-v41", "idn": "bercuaca", "vi": "có thời tiết"}, {"id": "u05-v42", "idn": "cuaca", "vi": "thời tiết"}, {"id": "u05-v43", "idn": "dingin", "vi": "lạnh"}, {"id": "u05-v44", "idn": "tebal", "vi": "dày"}, {"id": "u05-v45", "idn": "kopi", "vi": "cà phê"}, {"id": "u05-v46", "idn": "gurih", "vi": "béo ngậy, đậm vị"}, {"id": "u05-v47", "idn": "wangi", "vi": "thơm"}, {"id": "u05-v48", "idn": "sedap", "vi": "ngon, thơm ngon"}, {"id": "u05-v49", "idn": "pulang", "vi": "về"}, {"id": "u05-v50", "idn": "malam hari", "vi": "buổi tối"}, {"id": "u05-v51", "idn": "esoknya", "vi": "ngày hôm sau"}, {"id": "u05-v52", "idn": "hari berikutnya", "vi": "ngày tiếp theo"}, {"id": "u05-v53", "idn": "sebelum", "vi": "trước khi"}], "dialogs": [{"title": "Audio 5.1 — Kế hoạch nghỉ lễ", "kind": "dialog", "lines": [{"who": "Raden", "idn": "Ajeng, bulan depan mau liburan ke mana?", "vi": "Ajeng, tháng sau bạn định đi nghỉ ở đâu?"}, {"who": "Ajeng", "idn": "Aku mau berwisata ke Labuan Bajo.", "vi": "Mình định đi du lịch Labuan Bajo."}, {"who": "Raden", "idn": "Di mana itu?", "vi": "Nó ở đâu vậy?"}, {"who": "Ajeng", "idn": "Labuan Bajo ada di Nusa Tenggara Timur.", "vi": "Labuan Bajo ở Nusa Tenggara Timur."}, {"who": "Raden", "idn": "Apa saja tempat wisata menarik di sana?", "vi": "Ở đó có những địa điểm hấp dẫn nào?"}, {"who": "Ajeng", "idn": "Ada Pulau Kanawa, Air Terjun Cunca Wulang, Wae Rebo, dan Gua Rangko.", "vi": "Có đảo Kanawa, thác Cunca Wulang, Wae Rebo và hang Rangko."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/660BIPA_1_UMUM_AUDIO_5.1.mp3"}, {"title": "Audio 5.2 — Mua bánh", "kind": "dialog", "lines": [{"who": "Ajeng", "idn": "Permisi, Pak.", "vi": "Xin lỗi, cho cháu hỏi."}, {"who": "Pedagang", "idn": "Ya, silakan.", "vi": "Vâng, mời cô."}, {"who": "Ajeng", "idn": "Saya mau beli roti kompiang.", "vi": "Cháu muốn mua bánh kompiang."}, {"who": "Pedagang", "idn": "Berapa bungkus?", "vi": "Mấy gói?"}, {"who": "Ajeng", "idn": "Empat bungkus saja. Berapa harganya, Pak?", "vi": "Chỉ bốn gói thôi. Giá bao nhiêu ạ?"}, {"who": "Pedagang", "idn": "Lima puluh ribu rupiah.", "vi": "Năm mươi nghìn rupiah."}, {"who": "Ajeng", "idn": "Ini uangnya, Pak. Terima kasih.", "vi": "Đây là tiền ạ. Cảm ơn bác."}, {"who": "Pedagang", "idn": "Sama-sama.", "vi": "Không có gì."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/491BIPA_1_UMUM_AUDIO_5.2.mp3"}, {"title": "Dialog 5.1 — Sau chuyến đi", "kind": "dialog", "lines": [{"who": "Putri", "idn": "Bagaimana liburanmu di Labuan Bajo, Ajeng?", "vi": "Kỳ nghỉ của bạn ở Labuan Bajo thế nào, Ajeng?"}, {"who": "Ajeng", "idn": "Liburanku menyenangkan.", "vi": "Kỳ nghỉ của mình rất vui."}, {"who": "Putri", "idn": "Apa kamu mengunjungi Gua Rangko?", "vi": "Bạn có đến thăm hang Rangko không?"}, {"who": "Ajeng", "idn": "Ya, tentu saja.", "vi": "Có chứ, tất nhiên."}, {"who": "Putri", "idn": "Bagaimana tempatnya?", "vi": "Nơi đó thế nào?"}, {"who": "Ajeng", "idn": "Tempatnya berkolam jernih. Airnya berwarna biru.", "vi": "Ở đó có hồ nước trong. Nước có màu xanh."}]}, {"title": "Teks 5.1 — Du lịch Wae Rebo", "kind": "text", "lines": [{"idn": "Bulan lalu, saya dan Anjani berwisata ke Wae Rebo, Nusa Tenggara Timur.", "vi": "Tháng trước, tôi và Anjani đi du lịch Wae Rebo, Nusa Tenggara Timur."}, {"idn": "Kami berdua tiba di Nusa Tenggara Timur pada malam hari.", "vi": "Hai chúng tôi đến Nusa Tenggara Timur vào buổi tối."}, {"idn": "Esoknya, kami berjalan kaki menuju desa Wae Rebo selama empat jam.", "vi": "Hôm sau, chúng tôi đi bộ đến làng Wae Rebo trong bốn tiếng."}, {"idn": "Di sana ada tujuh rumah adat berbentuk kerucut.", "vi": "Ở đó có bảy ngôi nhà truyền thống hình nón."}, {"idn": "Kami menginap di rumah adat itu.", "vi": "Chúng tôi ngủ lại trong nhà truyền thống đó."}, {"idn": "Hari berikutnya, kami berkeliling di desa Wae Rebo.", "vi": "Ngày tiếp theo, chúng tôi đi dạo quanh làng."}, {"idn": "Desa ini bercuaca dingin. Kami berbaju tebal.", "vi": "Làng này thời tiết lạnh. Chúng tôi mặc áo dày."}, {"idn": "Sebelum pulang, kami berbelanja oleh-oleh.", "vi": "Trước khi về, chúng tôi mua quà."}, {"idn": "Kami membeli roti kompiang dan kopi Flores.", "vi": "Chúng tôi mua bánh kompiang và cà phê Flores."}, {"idn": "Roti kompiang bertabur wijen dan berasa gurih.", "vi": "Bánh kompiang rắc mè và có vị béo ngậy."}, {"idn": "Kopi Flores beraroma sedap dan wangi.", "vi": "Cà phê Flores có hương thơm ngon."}, {"idn": "Malam harinya, kami pulang ke Jakarta.", "vi": "Tối hôm đó, chúng tôi về Jakarta."}]}], "grammar": [{"title": "Tiền tố ber-: bốn nghĩa thường gặp", "body": "Gắn **ber-** vào từ gốc để tạo động từ hoặc cụm. Nghĩa thay đổi theo từ:\n1. **Thực hiện** hành động: *wisata* → *berwisata* (đi du lịch), *belanja* → *berbelanja* (mua sắm), *foto* → *berfoto* (chụp ảnh).\n2. **Có**, sở hữu: *kolam* → *berkolam* (có hồ), *warna* → *berwarna* (có màu).\n3. **Số lượng**: *dua* → *berdua* (hai người).\n4. **Mặc, mang**: *baju* → *berbaju* (mặc áo).", "examples": [{"idn": "Aku mau berwisata ke Labuan Bajo.", "vi": "Mình định đi du lịch Labuan Bajo. (thực hiện)"}, {"idn": "Tempatnya berkolam jernih.", "vi": "Nơi đó có hồ nước trong. (có)"}, {"idn": "Kami berdua tiba pada malam hari.", "vi": "Hai chúng tôi đến vào buổi tối. (số lượng)"}, {"idn": "Kami berbaju tebal.", "vi": "Chúng tôi mặc áo dày. (mặc)"}]}, {"title": "permisi, silakan, terima kasih", "body": "**Permisi** dùng để xin phép hoặc gây chú ý, đáp lại là **silakan** (mời). **Terima kasih** là cảm ơn, đáp lại là **sama-sama**.", "examples": [{"idn": "Permisi, Pak. → Ya, silakan.", "vi": "Xin lỗi, thưa bác. → Vâng, mời."}, {"idn": "Terima kasih. → Sama-sama.", "vi": "Cảm ơn. → Không có gì."}]}, {"title": "berapa và bagaimana", "body": "**Berapa** hỏi số lượng hoặc giá. **Bagaimana** hỏi trạng thái hoặc cách thức.", "examples": [{"idn": "Berapa bungkus? → Empat bungkus saja.", "vi": "Mấy gói? → Chỉ bốn gói thôi."}, {"idn": "Berapa harganya? → Lima puluh ribu rupiah.", "vi": "Giá bao nhiêu? → Năm mươi nghìn rupiah."}, {"idn": "Bagaimana liburanmu? → Menyenangkan.", "vi": "Kỳ nghỉ của bạn thế nào? → Rất vui."}]}, {"title": "Từ chỉ trình tự thời gian", "body": "Dùng để kể chuyện theo trình tự: **esoknya** (hôm sau), **hari berikutnya** (ngày tiếp theo), **malam harinya** (tối hôm đó), **sebelum pulang** (trước khi về).", "examples": [{"idn": "Esoknya, kami berjalan kaki.", "vi": "Hôm sau, chúng tôi đi bộ."}, {"idn": "Malam harinya, kami pulang ke Jakarta.", "vi": "Tối hôm đó, chúng tôi về Jakarta."}]}], "exercises": [{"id": "u05-x01", "t": "mcq", "q": "\"Aku mau berwisata ke Labuan Bajo.\" nghĩa là", "opts": ["Mình định đi du lịch Labuan Bajo.", "Mình đã ở Labuan Bajo.", "Mình sống ở Labuan Bajo.", "Mình bán đồ ở Labuan Bajo."], "a": 0, "e": "berwisata = đi du lịch."}, {"id": "u05-x02", "t": "mcq", "q": "\"berkolam\" nghĩa là", "opts": ["có hồ", "đi bơi", "làm hồ", "màu hồ"], "a": 0, "e": "ber- + kolam = có hồ."}, {"id": "u05-x03", "t": "mcq", "q": "\"berbaju tebal\" nghĩa là", "opts": ["mặc áo dày", "mua áo dày", "bán áo dày", "có áo mỏng"], "a": 0, "e": "ber- + baju = mặc áo."}, {"id": "u05-x04", "t": "mcq", "q": "\"berdua\" nghĩa là", "opts": ["hai người", "hai lần", "hai cái", "bằng hai tay"], "a": 0, "e": "ber- + dua = hai (người)."}, {"id": "u05-x05", "t": "mcq", "q": "Đáp lại \"Terima kasih.\"", "opts": ["Sama-sama.", "Permisi.", "Silakan.", "Maaf."], "a": 0, "e": "sama-sama = không có gì."}, {"id": "u05-x06", "t": "mcq", "q": "Đáp lại \"Permisi, Pak.\"", "opts": ["Ya, silakan.", "Sama-sama.", "Sampai jumpa.", "Baik."], "a": 0, "e": "silakan = mời."}, {"id": "u05-x07", "t": "fill", "q": "___ harganya? (giá bao nhiêu?)", "a": ["Berapa"], "e": "berapa = bao nhiêu."}, {"id": "u05-x08", "t": "mcq", "q": "\"Lima puluh ribu rupiah\" là", "opts": ["50.000 rupiah", "5.000 rupiah", "500.000 rupiah", "15.000 rupiah"], "a": 0, "e": "lima puluh = 50, ribu = nghìn."}, {"id": "u05-x09", "t": "mcq", "q": "Ajeng mua mấy gói bánh?", "opts": ["Bốn gói", "Hai gói", "Năm gói", "Mười gói"], "a": 0, "e": "Empat bungkus."}, {"id": "u05-x10", "t": "mcq", "q": "Labuan Bajo ở đâu?", "opts": ["Nusa Tenggara Timur", "Bali", "Jakarta", "Yogyakarta"], "a": 0, "e": "Theo Audio 5.1."}, {"id": "u05-x11", "t": "mcq", "q": "Wae Rebo có bao nhiêu nhà truyền thống?", "opts": ["Bảy", "Năm", "Mười", "Ba"], "a": 0, "e": "tujuh rumah adat."}, {"id": "u05-x12", "t": "mcq", "q": "Thời tiết ở Wae Rebo thế nào?", "opts": ["Lạnh", "Nóng", "Mưa", "Khô"], "a": 0, "e": "dingin = lạnh."}, {"id": "u05-x13", "t": "fill", "q": "Hôm sau (một từ): ___nya", "a": ["esok"], "e": "esoknya = hôm sau."}, {"id": "u05-x14", "t": "mcq", "q": "\"oleh-oleh\" nghĩa là", "opts": ["quà mang về", "đồ ăn sáng", "hành lý", "vé"], "a": 0, "e": "oleh-oleh = quà mang về từ chuyến đi."}], "culture": {"title": "Các loại hình du lịch ở Indonesia", "vi": "Người Indonesia thích **du lịch thiên nhiên**: Raja Ampat (Papua), núi Rinjani (Lombok), quần đảo Belitung, núi Bromo (Đông Java), công viên biển Bunaken (Bắc Sulawesi), hồ Toba (Bắc Sumatra). **Du lịch tâm linh, văn hóa**: đền Borobudur, Prambanan, đền Tanah Lot, nhà thờ Hồi giáo Istiqlal. **Du lịch mua sắm**: chợ Tanah Abang (Jakarta), chợ Beringharjo (Yogyakarta). **Du lịch học hỏi**: Taman Mini Indonesia Indah, Taman Pintar, Kota Tua."}}, {"id": "u06", "num": 6, "title": "Aktivitas Harianku", "vi_title": "Hoạt động hằng ngày", "goals": ["Nhận biết từ về hoạt động hằng ngày", "Kể và hỏi đáp về sinh hoạt hằng ngày, giờ giấc", "Dùng từ chỉ tần suất và sudah, belum, akan, sedang"], "vocab": [{"id": "u06-v01", "idn": "bangun tidur", "vi": "thức dậy"}, {"id": "u06-v02", "idn": "bangun", "vi": "thức dậy; dậy"}, {"id": "u06-v03", "idn": "bangun siang", "vi": "dậy muộn"}, {"id": "u06-v04", "idn": "mandi", "vi": "tắm"}, {"id": "u06-v05", "idn": "gosok gigi", "vi": "đánh răng"}, {"id": "u06-v06", "idn": "sarapan", "vi": "ăn sáng"}, {"id": "u06-v07", "idn": "makan siang", "vi": "ăn trưa"}, {"id": "u06-v08", "idn": "makan malam", "vi": "ăn tối"}, {"id": "u06-v09", "idn": "makan camilan", "vi": "ăn vặt"}, {"id": "u06-v10", "idn": "tidur siang", "vi": "ngủ trưa"}, {"id": "u06-v11", "idn": "mencuci baju", "vi": "giặt quần áo"}, {"id": "u06-v12", "idn": "mencuci piring", "vi": "rửa bát"}, {"id": "u06-v13", "idn": "menjemur", "vi": "phơi"}, {"id": "u06-v14", "idn": "masak", "vi": "nấu ăn"}, {"id": "u06-v15", "idn": "baca buku", "vi": "đọc sách"}, {"id": "u06-v16", "idn": "membaca", "vi": "đọc"}, {"id": "u06-v17", "idn": "menonton", "vi": "xem"}, {"id": "u06-v18", "idn": "bersepeda", "vi": "đạp xe"}, {"id": "u06-v19", "idn": "berbelanja", "vi": "đi chợ, mua sắm"}, {"id": "u06-v20", "idn": "bekerja", "vi": "làm việc"}, {"id": "u06-v21", "idn": "beristirahat", "vi": "nghỉ ngơi"}, {"id": "u06-v22", "idn": "salat", "vi": "cầu nguyện (Hồi giáo)"}, {"id": "u06-v23", "idn": "berpakaian", "vi": "mặc quần áo"}, {"id": "u06-v24", "idn": "pulang", "vi": "về nhà"}, {"id": "u06-v25", "idn": "pasar", "vi": "chợ"}, {"id": "u06-v26", "idn": "kantor", "vi": "văn phòng"}, {"id": "u06-v27", "idn": "kantin", "vi": "căng tin"}, {"id": "u06-v28", "idn": "televisi", "vi": "ti vi"}, {"id": "u06-v29", "idn": "buku", "vi": "sách"}, {"id": "u06-v30", "idn": "bioskop", "vi": "rạp chiếu phim"}, {"id": "u06-v31", "idn": "macet", "vi": "tắc đường"}, {"id": "u06-v32", "idn": "kampus", "vi": "khuôn viên đại học"}, {"id": "u06-v33", "idn": "akhir pekan", "vi": "cuối tuần"}, {"id": "u06-v34", "idn": "rajin", "vi": "chăm chỉ"}, {"id": "u06-v35", "idn": "malas", "vi": "lười"}, {"id": "u06-v36", "idn": "pelajaran", "vi": "bài học"}, {"id": "u06-v37", "idn": "cermat", "vi": "cẩn thận, kỹ lưỡng"}, {"id": "u06-v38", "idn": "setelah itu", "vi": "sau đó"}, {"id": "u06-v39", "idn": "lalu", "vi": "rồi"}, {"id": "u06-v40", "idn": "kemudian", "vi": "sau đó, tiếp theo"}, {"id": "u06-v41", "idn": "setelahnya", "vi": "sau đó"}, {"id": "u06-v42", "idn": "sorenya", "vi": "buổi chiều hôm đó"}, {"id": "u06-v43", "idn": "sebelum itu", "vi": "trước đó"}, {"id": "u06-v44", "idn": "pukul", "vi": "giờ"}, {"id": "u06-v45", "idn": "biasanya", "vi": "thường thường"}, {"id": "u06-v46", "idn": "selalu", "vi": "luôn luôn"}, {"id": "u06-v47", "idn": "sering", "vi": "thường"}, {"id": "u06-v48", "idn": "kadang-kadang", "vi": "thỉnh thoảng"}, {"id": "u06-v49", "idn": "jarang", "vi": "hiếm khi"}, {"id": "u06-v50", "idn": "tidak pernah", "vi": "không bao giờ"}, {"id": "u06-v51", "idn": "agak", "vi": "hơi, khá"}, {"id": "u06-v52", "idn": "sudah", "vi": "đã"}, {"id": "u06-v53", "idn": "belum", "vi": "chưa"}, {"id": "u06-v54", "idn": "akan", "vi": "sẽ"}, {"id": "u06-v55", "idn": "sedang", "vi": "đang"}, {"id": "u06-v56", "idn": "tengah malam", "vi": "nửa đêm"}, {"id": "u06-v57", "idn": "setengah dua", "vi": "một giờ rưỡi", "note": "01.30"}, {"id": "u06-v58", "idn": "dua kurang lima belas", "vi": "hai giờ kém mười lăm", "note": "01.45"}], "dialogs": [{"title": "Audio 6 — Chủ nhật của Rani", "kind": "text", "lines": [{"idn": "Setiap hari Minggu saya bangun siang.", "vi": "Chủ nhật nào tôi cũng dậy muộn."}, {"idn": "Setelah itu, saya mandi.", "vi": "Sau đó, tôi tắm."}, {"idn": "Saya lalu membaca buku.", "vi": "Rồi tôi đọc sách."}, {"idn": "Saya juga makan camilan.", "vi": "Tôi cũng ăn vặt."}, {"idn": "Saya mencuci baju. Sebelum itu, saya berbelanja di pasar.", "vi": "Tôi giặt quần áo. Trước đó, tôi đi chợ."}, {"idn": "Setelah itu, saya masak.", "vi": "Sau đó, tôi nấu ăn."}, {"idn": "Kemudian, saya makan siang. Saya juga tidur siang.", "vi": "Rồi tôi ăn trưa. Tôi cũng ngủ trưa."}, {"idn": "Sore hari saya bersepeda berkeliling kampung.", "vi": "Buổi chiều tôi đạp xe vòng quanh làng."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/896BIPA_1_UMUM_AUDIO_6.mp3"}, {"title": "Teks 6.1 — Ngày thường của Dina", "kind": "text", "lines": [{"idn": "Hai, saya Dina. Saya akan bercerita tentang kegiatan harian saya.", "vi": "Chào, tôi là Dina. Tôi sẽ kể về sinh hoạt hằng ngày của tôi."}, {"idn": "Pada pagi hari biasanya saya bangun pukul 05.00.", "vi": "Buổi sáng tôi thường dậy lúc 5 giờ."}, {"idn": "Setelah salat subuh, saya mandi dan berpakaian kerja.", "vi": "Sau khi cầu nguyện buổi sớm, tôi tắm và mặc đồ đi làm."}, {"idn": "Saya sarapan sekitar pukul 06.00.", "vi": "Tôi ăn sáng khoảng 6 giờ."}, {"idn": "Saya bekerja pada pukul 08.00 sampai 16.00.", "vi": "Tôi làm việc từ 8 giờ đến 16 giờ."}, {"idn": "Saya selalu makan siang di kantin pukul 12.00 sampai 13.00.", "vi": "Tôi luôn ăn trưa ở căng tin từ 12 giờ đến 13 giờ."}, {"idn": "Selesai bekerja, saya langsung pulang ke rumah.", "vi": "Làm xong, tôi về nhà ngay."}, {"idn": "Jika jalanan macet, kadang-kadang saya sampai di rumah pukul 18.00.", "vi": "Nếu đường tắc, đôi khi tôi về đến nhà lúc 18 giờ."}, {"idn": "Saya agak malas makan malam. Jadi, saya menonton televisi atau membaca buku.", "vi": "Tôi hơi lười ăn tối. Nên tôi xem ti vi hoặc đọc sách."}, {"idn": "Lalu, saya tidur sekitar pukul 22.00.", "vi": "Rồi tôi ngủ khoảng 22 giờ."}, {"idn": "Pada akhir pekan saya sering pergi menonton film di bioskop.", "vi": "Cuối tuần tôi thường đi xem phim ở rạp."}, {"idn": "Saya jarang ada di rumah.", "vi": "Tôi hiếm khi ở nhà."}]}, {"title": "Teks 6.2 — Em gái Santi", "kind": "text", "lines": [{"idn": "Adik Santi sangat rajin. Namanya Lisa.", "vi": "Em gái Santi rất chăm chỉ. Tên em là Lisa."}, {"idn": "Ia sudah bangun pada pukul 04.00.", "vi": "Em đã dậy lúc 4 giờ."}, {"idn": "Setiap pukul 04.30 pagi dia akan membangunkan Santi.", "vi": "Cứ 4 giờ 30 sáng em sẽ đánh thức Santi."}, {"idn": "Pada pukul 06.30 Lisa sudah sampai di kampus.", "vi": "Lúc 6 giờ 30 Lisa đã đến trường đại học."}, {"idn": "Ketika dosen sedang menerangkan pelajaran, Lisa akan mendengarkan dengan cermat.", "vi": "Khi giảng viên đang giảng bài, Lisa sẽ lắng nghe cẩn thận."}]}], "grammar": [{"title": "Từ nối chỉ trình tự", "body": "Dùng để kể theo thứ tự thời gian: **setelah itu**, **lalu**, **kemudian**, **setelahnya**, **sorenya**, **sebelum itu**.", "examples": [{"idn": "Setelah itu, saya mandi.", "vi": "Sau đó, tôi tắm."}, {"idn": "Saya lalu membaca buku.", "vi": "Rồi tôi đọc sách."}, {"idn": "Kemudian, saya makan siang.", "vi": "Sau đó, tôi ăn trưa."}]}, {"title": "Tiền tố meng-: tạo động từ chủ động", "body": "Gắn **meng-** (biến thành *men-, mem-, meny-, menge-, me-* tùy chữ cái đầu của từ gốc) vào từ gốc để tạo động từ chủ động.", "examples": [{"idn": "tonton → menonton", "vi": "xem"}, {"idn": "baca → membaca", "vi": "đọc"}, {"idn": "cuci → mencuci", "vi": "rửa, giặt"}]}, {"title": "Tần suất: seberapa sering?", "body": "Từ nhiều đến ít: **selalu** (luôn luôn), **biasanya** (thường thường), **sering** (thường), **kadang-kadang** (thỉnh thoảng), **jarang** (hiếm khi), **tidak pernah** (không bao giờ). **Agak** là *hơi*.", "examples": [{"idn": "Saya selalu makan siang di kantin.", "vi": "Tôi luôn ăn trưa ở căng tin."}, {"idn": "Saya jarang ada di rumah.", "vi": "Tôi hiếm khi ở nhà."}, {"idn": "Saya tidak pernah lupa salat.", "vi": "Tôi không bao giờ quên cầu nguyện."}]}, {"title": "sudah, belum, akan, sedang", "body": "Chỉ trạng thái thời gian của hành động. **Sudah**: đã xong. **Belum**: chưa. **Akan**: sắp, sẽ. **Sedang**: đang diễn ra.", "examples": [{"idn": "Lisa sudah sampai di kampus.", "vi": "Lisa đã đến trường."}, {"idn": "Semua orang belum bangun.", "vi": "Mọi người chưa dậy."}, {"idn": "Dia akan membangunkan Santi.", "vi": "Cô ấy sẽ đánh thức Santi."}, {"idn": "Dosen sedang menerangkan pelajaran.", "vi": "Giảng viên đang giảng bài."}]}, {"title": "Nói giờ: pukul", "body": "Dùng **pukul** + giờ. Thêm *pagi, siang, sore, malam* để nói buổi. **Setengah** là *rưỡi* (nói giờ trước: *setengah dua* = 1:30, tức một nửa trước giờ hai). **Kurang** là *kém*, **lebih** là *hơn*.", "examples": [{"idn": "01.00 satu pagi", "vi": "1 giờ sáng"}, {"idn": "01.05 satu lebih lima menit", "vi": "1 giờ 5 phút"}, {"idn": "01.30 setengah dua", "vi": "1 giờ rưỡi"}, {"idn": "01.45 dua kurang lima belas", "vi": "2 giờ kém 15"}, {"idn": "12.00 dua belas siang", "vi": "12 giờ trưa"}, {"idn": "23.00 sebelas malam", "vi": "11 giờ đêm"}]}], "exercises": [{"id": "u06-x01", "t": "mcq", "q": "\"bangun tidur\" nghĩa là", "opts": ["thức dậy", "đi ngủ", "ngủ trưa", "ngủ say"], "a": 0, "e": "bangun = dậy."}, {"id": "u06-x02", "t": "mcq", "q": "\"makan siang\" nghĩa là", "opts": ["ăn trưa", "ăn sáng", "ăn tối", "ăn vặt"], "a": 0, "e": "siang = trưa."}, {"id": "u06-x03", "t": "mcq", "q": "Từ nào chỉ tần suất cao nhất?", "opts": ["selalu", "sering", "jarang", "kadang-kadang"], "a": 0, "e": "selalu = luôn luôn."}, {"id": "u06-x04", "t": "mcq", "q": "\"tidak pernah\" nghĩa là", "opts": ["không bao giờ", "thỉnh thoảng", "hiếm khi", "luôn luôn"], "a": 0, "e": "pernah = từng."}, {"id": "u06-x05", "t": "mcq", "q": "\"Dia sudah bangun.\" nghĩa là", "opts": ["Cô ấy đã dậy.", "Cô ấy sẽ dậy.", "Cô ấy đang dậy.", "Cô ấy chưa dậy."], "a": 0, "e": "sudah = đã."}, {"id": "u06-x06", "t": "mcq", "q": "\"Dia belum bangun.\" nghĩa là", "opts": ["Cô ấy chưa dậy.", "Cô ấy đã dậy.", "Cô ấy sẽ dậy.", "Cô ấy đang ngủ."], "a": 0, "e": "belum = chưa."}, {"id": "u06-x07", "t": "fill", "q": "Dosen ___ menerangkan pelajaran. (đang)", "a": ["sedang"], "e": "sedang = đang."}, {"id": "u06-x08", "t": "fill", "q": "Dia ___ membangunkan Santi. (sẽ)", "a": ["akan"], "e": "akan = sẽ."}, {"id": "u06-x09", "t": "mcq", "q": "Rani đã làm gì trước khi giặt đồ?", "opts": ["Đi chợ", "Ăn tối", "Ngủ trưa", "Đạp xe"], "a": 0, "e": "Sebelum itu, saya berbelanja di pasar."}, {"id": "u06-x10", "t": "mcq", "q": "Dina thường dậy lúc mấy giờ?", "opts": ["5 giờ", "6 giờ", "8 giờ", "4 giờ"], "a": 0, "e": "pukul 05.00."}, {"id": "u06-x11", "t": "mcq", "q": "Dina ăn trưa ở đâu?", "opts": ["Căng tin", "Nhà", "Rạp phim", "Chợ"], "a": 0, "e": "di kantin."}, {"id": "u06-x12", "t": "mcq", "q": "Cuối tuần Dina thường làm gì?", "opts": ["Xem phim ở rạp", "Làm việc", "Đi chợ", "Ngủ cả ngày"], "a": 0, "e": "menonton film di bioskop."}, {"id": "u06-x13", "t": "mcq", "q": "\"setengah dua\" là mấy giờ?", "opts": ["1:30", "2:30", "1:45", "2:00"], "a": 0, "e": "setengah dua = nửa trước 2 giờ, tức 1:30."}, {"id": "u06-x14", "t": "mcq", "q": "\"menonton\" từ gốc là", "opts": ["tonton", "nonton", "monton", "tontonan"], "a": 0, "e": "tonton → menonton."}, {"id": "u06-x15", "t": "fill", "q": "Dina bekerja ___ pukul 08.00. (vào lúc)", "a": ["pada"], "e": "pada pukul = vào lúc."}], "culture": {"title": "Làng truyền thống Baduy (Banten)", "vi": "Người Baduy ở huyện Lebak, Banten, nổi tiếng với tri thức bản địa. Đàn ông làm nông, phụ nữ ở nhà dệt vải và nấu ăn. Mọi việc hằng ngày làm không dùng công nghệ, hoàn toàn dựa vào thiên nhiên. Phụ nữ dậy sớm tắm giặt rồi nấu ăn bằng củi và đồ gốm, sau đó dệt vải hoặc đan túi mây ở hiên nhà. Đàn ông ra đồng. Người Baduy Trong mặc đồ trắng hoàn toàn, đôi khi xuống vùng Baduy Ngoài."}}, {"id": "u07", "num": 7, "title": "Hobi Kami", "vi_title": "Sở thích của chúng tôi", "goals": ["Nói về sở thích và mức độ yêu thích", "Hỏi đáp về sở thích, vị của món ăn, đồ nấu bếp", "Hiểu hậu tố -an và đọc đoạn văn về sở thích"], "vocab": [{"id": "u07-v01", "idn": "hobi", "vi": "sở thích"}, {"id": "u07-v02", "idn": "memancing", "vi": "câu cá"}, {"id": "u07-v03", "idn": "bermain musik", "vi": "chơi nhạc"}, {"id": "u07-v04", "idn": "berenang", "vi": "bơi"}, {"id": "u07-v05", "idn": "joging", "vi": "chạy bộ"}, {"id": "u07-v06", "idn": "bermain badminton", "vi": "chơi cầu lông"}, {"id": "u07-v07", "idn": "berolahraga", "vi": "tập thể dục thể thao"}, {"id": "u07-v08", "idn": "memasak", "vi": "nấu ăn"}, {"id": "u07-v09", "idn": "berkebun", "vi": "làm vườn"}, {"id": "u07-v10", "idn": "menari", "vi": "nhảy, múa"}, {"id": "u07-v11", "idn": "mengoleksi", "vi": "sưu tầm"}, {"id": "u07-v12", "idn": "mencoba resep baru", "vi": "thử công thức mới"}, {"id": "u07-v13", "idn": "berjalan-jalan", "vi": "đi dạo"}, {"id": "u07-v14", "idn": "waktu luang", "vi": "thời gian rảnh"}, {"id": "u07-v15", "idn": "ikut", "vi": "đi cùng, tham gia"}, {"id": "u07-v16", "idn": "mengapa", "vi": "tại sao"}, {"id": "u07-v17", "idn": "sebenarnya", "vi": "thật ra"}, {"id": "u07-v18", "idn": "membosankan", "vi": "chán"}, {"id": "u07-v19", "idn": "beda", "vi": "khác"}, {"id": "u07-v20", "idn": "suka", "vi": "thích"}, {"id": "u07-v21", "idn": "sangat suka", "vi": "rất thích"}, {"id": "u07-v22", "idn": "kurang suka", "vi": "không thích lắm"}, {"id": "u07-v23", "idn": "tidak suka", "vi": "không thích"}, {"id": "u07-v24", "idn": "lebih suka", "vi": "thích hơn"}, {"id": "u07-v25", "idn": "senang", "vi": "vui, thích"}, {"id": "u07-v26", "idn": "rasa", "vi": "vị"}, {"id": "u07-v27", "idn": "manis", "vi": "ngọt"}, {"id": "u07-v28", "idn": "asam", "vi": "chua"}, {"id": "u07-v29", "idn": "asin", "vi": "mặn"}, {"id": "u07-v30", "idn": "pahit", "vi": "đắng"}, {"id": "u07-v31", "idn": "pedas", "vi": "cay"}, {"id": "u07-v32", "idn": "gurih", "vi": "béo, đậm vị"}, {"id": "u07-v33", "idn": "gula", "vi": "đường"}, {"id": "u07-v34", "idn": "garam", "vi": "muối"}, {"id": "u07-v35", "idn": "jeruk", "vi": "cam, quýt"}, {"id": "u07-v36", "idn": "kopi", "vi": "cà phê"}, {"id": "u07-v37", "idn": "lombok", "vi": "ớt (cách gọi vùng)", "note": "cabai"}, {"id": "u07-v38", "idn": "cabai", "vi": "ớt"}, {"id": "u07-v39", "idn": "soto", "vi": "soto (súp)"}, {"id": "u07-v40", "idn": "bakso", "vi": "bò viên"}, {"id": "u07-v41", "idn": "mi ayam", "vi": "mì gà"}, {"id": "u07-v42", "idn": "rendang", "vi": "rendang (thịt bò kho khô)"}, {"id": "u07-v43", "idn": "opor ayam", "vi": "gà nấu nước cốt dừa"}, {"id": "u07-v44", "idn": "gado-gado", "vi": "gỏi rau với sốt đậu phộng"}, {"id": "u07-v45", "idn": "sate", "vi": "thịt xiên nướng"}, {"id": "u07-v46", "idn": "ayam goreng", "vi": "gà rán"}, {"id": "u07-v47", "idn": "es teh", "vi": "trà đá"}, {"id": "u07-v48", "idn": "es jeruk", "vi": "nước cam đá"}, {"id": "u07-v49", "idn": "pujasera", "vi": "khu ẩm thực"}, {"id": "u07-v50", "idn": "kenyal", "vi": "dai"}, {"id": "u07-v51", "idn": "berserat", "vi": "có thớ, nhiều xơ"}, {"id": "u07-v52", "idn": "kompor", "vi": "bếp"}, {"id": "u07-v53", "idn": "wajan", "vi": "chảo"}, {"id": "u07-v54", "idn": "panci", "vi": "nồi"}, {"id": "u07-v55", "idn": "spatula", "vi": "sạn, thìa nấu"}, {"id": "u07-v56", "idn": "pisau", "vi": "dao"}, {"id": "u07-v57", "idn": "talenan", "vi": "thớt"}, {"id": "u07-v58", "idn": "masakan", "vi": "món ăn"}, {"id": "u07-v59", "idn": "gorengan", "vi": "đồ chiên"}, {"id": "u07-v60", "idn": "panggangan", "vi": "đồ nướng"}, {"id": "u07-v61", "idn": "lengkap", "vi": "đầy đủ"}], "dialogs": [{"title": "Audio 7.1 — Rủ đi câu", "kind": "dialog", "lines": [{"who": "Raden", "idn": "Ajeng, besok kamu mau ikut?", "vi": "Ajeng, ngày mai bạn có đi cùng không?"}, {"who": "Ajeng", "idn": "Ke mana?", "vi": "Đi đâu?"}, {"who": "Raden", "idn": "Aku, Maria, dan Doni akan pergi memancing.", "vi": "Mình, Maria và Doni sẽ đi câu cá."}, {"who": "Ajeng", "idn": "Sebenarnya, aku kurang suka memancing.", "vi": "Thật ra mình không thích câu cá lắm."}, {"who": "Raden", "idn": "Oh, ya? Mengapa?", "vi": "Vậy à? Tại sao?"}, {"who": "Ajeng", "idn": "Memancing itu membosankan.", "vi": "Câu cá chán lắm."}, {"who": "Raden", "idn": "Lalu, apa hobimu?", "vi": "Vậy sở thích của bạn là gì?"}, {"who": "Ajeng", "idn": "Hobiku bermain musik.", "vi": "Sở thích của mình là chơi nhạc."}, {"who": "Raden", "idn": "Ha ha ha, hobi kita memang beda, ya?", "vi": "Ha ha ha, sở thích của mình khác nhau thật nhỉ?"}, {"who": "Ajeng", "idn": "Iya, benar!", "vi": "Ừ, đúng vậy!"}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/271BIPA_1_UMUM_AUDIO_7.1.mp3"}, {"title": "Audio 7.2 — Yoyo đi chợ", "kind": "text", "lines": [{"idn": "Hai, nama saya Yoyo. Saya koki. Saya hobi berbelanja ke pasar.", "vi": "Chào, tên tôi là Yoyo. Tôi là đầu bếp. Tôi thích đi chợ."}, {"idn": "Di pasar ada gula, jeruk, garam, kopi, dan lombok.", "vi": "Ở chợ có đường, cam, muối, cà phê và ớt."}, {"idn": "Gula rasanya manis. Jeruk rasanya asam.", "vi": "Đường vị ngọt. Cam vị chua."}, {"idn": "Garam rasanya asin. Kopi rasanya pahit. Lombok rasanya pedas.", "vi": "Muối vị mặn. Cà phê vị đắng. Ớt vị cay."}, {"idn": "Di pujasera ada soto, bakso, mi ayam, rendang, opor ayam, gado-gado, satai, dan ayam goreng.", "vi": "Ở khu ẩm thực có soto, bò viên, mì gà, rendang, gà nấu cốt dừa, gỏi gado-gado, sate và gà rán."}, {"idn": "Teksturnya kenyal dan berserat.", "vi": "Kết cấu dai và có thớ."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/460BIPA_1_UMUM_AUDIO_7.2.mp3"}, {"title": "Audio 7.3 — Cuối tuần của Sarah", "kind": "text", "lines": [{"idn": "Saya sangat suka berenang. Saya biasanya berenang di akhir pekan.", "vi": "Tôi rất thích bơi. Cuối tuần tôi thường đi bơi."}, {"idn": "Saya kurang suka joging.", "vi": "Tôi không thích chạy bộ lắm."}, {"idn": "Saya suka bermain badminton.", "vi": "Tôi thích chơi cầu lông."}, {"idn": "Saya tidak suka tidur atau diam di rumah pada akhir pekan.", "vi": "Cuối tuần tôi không thích ngủ hay ở lì trong nhà."}, {"idn": "Saya juga sangat suka memasak di akhir pekan.", "vi": "Tôi cũng rất thích nấu ăn vào cuối tuần."}, {"idn": "Namun, saya lebih suka berolahraga dan memasak.", "vi": "Tuy nhiên, tôi thích thể thao và nấu ăn hơn."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/155BIPA_1_UMUM_AUDIO_7.3.mp3"}, {"title": "Teks 7 — Hobi của Septi", "kind": "text", "lines": [{"idn": "Hobi saya memasak. Saya sangat suka memasak aneka hidangan.", "vi": "Sở thích của tôi là nấu ăn. Tôi rất thích nấu nhiều món."}, {"idn": "Masakan kesukaan saya adalah rendang.", "vi": "Món tôi thích nhất là rendang."}, {"idn": "Saya juga suka memasak gorengan dan panggangan.", "vi": "Tôi cũng thích nấu đồ chiên và đồ nướng."}, {"idn": "Selain hobi memasak, saya juga hobi mengoleksi peralatan masak.", "vi": "Ngoài nấu ăn, tôi còn thích sưu tầm dụng cụ nấu ăn."}, {"idn": "Saya punya kompor, wa
