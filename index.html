jan, dan panci.", "vi": "Tôi có bếp, chảo và nồi."}, {"idn": "Saya juga punya spatula, pisau, dan talenan.", "vi": "Tôi cũng có sạn, dao và thớt."}]}], "grammar": [{"title": "Mức độ yêu thích", "body": "Từ mạnh đến yếu: **sangat suka** (rất thích), **suka** (thích), **kurang suka** (không thích lắm), **tidak suka** (không thích). Đứng trước động từ hoặc danh từ.", "examples": [{"idn": "Saya sangat suka berenang.", "vi": "Tôi rất thích bơi."}, {"idn": "Saya suka bermain badminton.", "vi": "Tôi thích chơi cầu lông."}, {"idn": "Saya kurang suka joging.", "vi": "Tôi không thích chạy bộ lắm."}, {"idn": "Saya tidak suka tidur.", "vi": "Tôi không thích ngủ."}]}, {"title": "Hỏi và nói về sở thích", "body": "Mẫu hỏi: **Apa hobimu?** hoặc **Hobimu apa?**. Trả lời: **Hobi saya + động từ**. Với người thứ ba dùng **-nya**.", "examples": [{"idn": "Apa hobimu? → Hobiku bermain musik.", "vi": "Sở thích của bạn là gì? → Sở thích của tôi là chơi nhạc."}, {"idn": "Apa hobinya? → Hobinya berkebun.", "vi": "Sở thích của anh ấy là gì? → Sở thích của anh ấy là làm vườn."}, {"idn": "Apa yang kamu lakukan pada waktu luang?", "vi": "Bạn làm gì khi rảnh?"}]}, {"title": "Hậu tố -an: kết quả của hành động", "body": "Hậu tố **-an** tạo danh từ chỉ **kết quả** của hành động meng-.", "examples": [{"idn": "masak → masakan", "vi": "nấu → món ăn"}, {"idn": "panggang → panggangan", "vi": "nướng → đồ nướng"}, {"idn": "goreng → gorengan", "vi": "chiên → đồ chiên"}]}, {"title": "Nói vị", "body": "Mẫu: **[Món] + rasanya + [vị]**.", "examples": [{"idn": "Gula rasanya manis.", "vi": "Đường vị ngọt."}, {"idn": "Garam rasanya asin.", "vi": "Muối vị mặn."}, {"idn": "Lombok rasanya pedas.", "vi": "Ớt vị cay."}, {"idn": "Kopi rasanya pahit.", "vi": "Cà phê vị đắng."}]}], "exercises": [{"id": "u07-x01", "t": "mcq", "q": "\"sangat suka\" nghĩa là", "opts": ["rất thích", "hơi thích", "không thích", "thích hơn"], "a": 0, "e": "sangat = rất."}, {"id": "u07-x02", "t": "mcq", "q": "\"kurang suka\" nghĩa là", "opts": ["không thích lắm", "rất thích", "thích", "ghét"], "a": 0, "e": "kurang = ít, thiếu."}, {"id": "u07-x03", "t": "mcq", "q": "\"Hobi saya berenang.\" nghĩa là", "opts": ["Sở thích của tôi là bơi.", "Tôi đã bơi.", "Tôi không biết bơi.", "Tôi bán đồ bơi."], "a": 0, "e": "hobi = sở thích."}, {"id": "u07-x04", "t": "mcq", "q": "\"membosankan\" nghĩa là", "opts": ["chán", "thú vị", "mệt", "khó"], "a": 0, "e": "bosan = chán."}, {"id": "u07-x05", "t": "mcq", "q": "Ajeng không thích", "opts": ["câu cá", "chơi nhạc", "nấu ăn", "bơi"], "a": 0, "e": "kurang suka memancing."}, {"id": "u07-x06", "t": "mcq", "q": "Hobi của Ajeng là", "opts": ["chơi nhạc", "câu cá", "đọc sách", "bơi"], "a": 0, "e": "Hobiku bermain musik."}, {"id": "u07-x07", "t": "mcq", "q": "Gula rasanya", "opts": ["ngọt", "mặn", "chua", "đắng"], "a": 0, "e": "manis = ngọt."}, {"id": "u07-x08", "t": "mcq", "q": "Garam rasanya", "opts": ["mặn", "ngọt", "chua", "cay"], "a": 0, "e": "asin = mặn."}, {"id": "u07-x09", "t": "mcq", "q": "Lombok (ớt) rasanya", "opts": ["cay", "đắng", "ngọt", "chua"], "a": 0, "e": "pedas = cay."}, {"id": "u07-x10", "t": "mcq", "q": "Kopi rasanya", "opts": ["đắng", "cay", "ngọt", "chua"], "a": 0, "e": "pahit = đắng."}, {"id": "u07-x11", "t": "fill", "q": "Es jeruk rasanya ___ (chua)", "a": ["asam", "masam"], "e": "asam hoặc masam đều chỉ vị chua."}, {"id": "u07-x12", "t": "mcq", "q": "\"kompor\" là", "opts": ["bếp", "chảo", "nồi", "dao"], "a": 0, "e": "kompor = bếp."}, {"id": "u07-x13", "t": "mcq", "q": "\"wajan\" là", "opts": ["chảo", "nồi", "thớt", "bếp"], "a": 0, "e": "wajan = chảo."}, {"id": "u07-x14", "t": "mcq", "q": "\"masakan\" nghĩa là", "opts": ["món ăn", "nấu ăn", "đầu bếp", "bếp"], "a": 0, "e": "masak + -an = kết quả của nấu ăn."}, {"id": "u07-x15", "t": "mcq", "q": "Món Septi thích nhất là", "opts": ["rendang", "soto", "bakso", "sate"], "a": 0, "e": "Masakan kesukaan saya adalah rendang."}, {"id": "u07-x16", "t": "mcq", "q": "Sarah thích nhất vào cuối tuần", "opts": ["bơi", "ngủ", "chạy bộ", "xem phim"], "a": 0, "e": "sangat suka berenang."}], "culture": {"title": "Bambu gila: trò chơi truyền thống ở Maluku", "vi": "Ngày xưa người Indonesia thích tụ tập chơi cùng nhau. Ở Maluku có trò chơi truyền thống độc đáo mang màu sắc huyền bí tên là **bambu gila** (baramasuwel). Người chơi chỉ ôm và giữ cây tre. Cây tre tự nhảy lên theo ý của pawang (thầy cúng). Pawang đốt nhang, rồi khói được “đưa” vào thân tre, tre tự chuyển động. Người chơi phải ôm giữ tre, pawang liên tục niệm thần chú *Hei baramasuwel!*."}}, {"id": "u08", "num": 8, "title": "Sifat-Sifat Temanku", "vi_title": "Tính cách của bạn tôi", "goals": ["Hiểu và nói về tính cách con người", "Phân biệt bukan và tidak (phủ định)", "Hiểu các nghĩa của ada, và đọc mô tả tính cách"], "vocab": [{"id": "u08-v01", "idn": "sifat", "vi": "tính cách"}, {"id": "u08-v02", "idn": "teman", "vi": "bạn"}, {"id": "u08-v03", "idn": "teman baru", "vi": "bạn mới"}, {"id": "u08-v04", "idn": "baik", "vi": "tốt"}, {"id": "u08-v05", "idn": "baik hati", "vi": "tốt bụng"}, {"id": "u08-v06", "idn": "ramah", "vi": "thân thiện"}, {"id": "u08-v07", "idn": "suka menolong", "vi": "hay giúp đỡ"}, {"id": "u08-v08", "idn": "menolong", "vi": "giúp đỡ"}, {"id": "u08-v09", "idn": "membantu", "vi": "giúp"}, {"id": "u08-v10", "idn": "cerewet", "vi": "hay lải nhải, nhiều chuyện"}, {"id": "u08-v11", "idn": "perfeksionis", "vi": "cầu toàn"}, {"id": "u08-v12", "idn": "pendiam", "vi": "ít nói, trầm lặng"}, {"id": "u08-v13", "idn": "menyendiri", "vi": "ở một mình"}, {"id": "u08-v14", "idn": "periang", "vi": "vui vẻ"}, {"id": "u08-v15", "idn": "ceria", "vi": "vui tươi"}, {"id": "u08-v16", "idn": "sabar", "vi": "kiên nhẫn"}, {"id": "u08-v17", "idn": "pemarah", "vi": "hay nổi giận"}, {"id": "u08-v18", "idn": "marah", "vi": "giận"}, {"id": "u08-v19", "idn": "pemaaf", "vi": "hay tha thứ"}, {"id": "u08-v20", "idn": "pemalu", "vi": "nhút nhát, hay xấu hổ"}, {"id": "u08-v21", "idn": "pelit", "vi": "keo kiệt"}, {"id": "u08-v22", "idn": "hemat", "vi": "tiết kiệm"}, {"id": "u08-v23", "idn": "jujur", "vi": "trung thực"}, {"id": "u08-v24", "idn": "mandiri", "vi": "tự lập"}, {"id": "u08-v25", "idn": "teratur", "vi": "ngăn nắp, có trật tự"}, {"id": "u08-v26", "idn": "rapi", "vi": "gọn gàng"}, {"id": "u08-v27", "idn": "serius", "vi": "nghiêm túc"}, {"id": "u08-v28", "idn": "rajin", "vi": "chăm chỉ"}, {"id": "u08-v29", "idn": "tekun", "vi": "kiên trì, cần mẫn"}, {"id": "u08-v30", "idn": "tegas", "vi": "quyết đoán, dứt khoát"}, {"id": "u08-v31", "idn": "cekatan", "vi": "nhanh nhẹn"}, {"id": "u08-v32", "idn": "cerdas", "vi": "thông minh"}, {"id": "u08-v33", "idn": "pintar", "vi": "giỏi, thông minh"}, {"id": "u08-v34", "idn": "malas", "vi": "lười"}, {"id": "u08-v35", "idn": "pemalas", "vi": "người lười"}, {"id": "u08-v36", "idn": "perhatian", "vi": "chu đáo, quan tâm"}, {"id": "u08-v37", "idn": "lucu", "vi": "hài hước, buồn cười"}, {"id": "u08-v38", "idn": "tenang", "vi": "điềm tĩnh"}, {"id": "u08-v39", "idn": "penyayang", "vi": "giàu lòng thương"}, {"id": "u08-v40", "idn": "sempurna", "vi": "hoàn hảo"}, {"id": "u08-v41", "idn": "tepat waktu", "vi": "đúng giờ"}, {"id": "u08-v42", "idn": "sendiri", "vi": "một mình, tự mình"}, {"id": "u08-v43", "idn": "bukan", "vi": "không phải", "note": "phủ định danh từ"}, {"id": "u08-v44", "idn": "tidak", "vi": "không", "note": "phủ định tính từ, động từ"}, {"id": "u08-v45", "idn": "adalah", "vi": "là"}, {"id": "u08-v46", "idn": "tetapi", "vi": "nhưng"}, {"id": "u08-v47", "idn": "namun", "vi": "tuy nhiên"}, {"id": "u08-v48", "idn": "agak", "vi": "hơi"}, {"id": "u08-v49", "idn": "sangat", "vi": "rất"}], "dialogs": [{"title": "Audio 8.1 — Sarah, bạn mới của Fitria", "kind": "text", "lines": [{"idn": "Saya punya teman baru. Namanya Sarah. Sarah berasal dari Inggris.", "vi": "Tôi có một người bạn mới. Tên là Sarah. Sarah đến từ Anh."}, {"idn": "Dia baik, ramah, dan suka menolong.", "vi": "Cô ấy tốt, thân thiện và hay giúp đỡ."}, {"idn": "Dia selalu menyapa kami.", "vi": "Cô ấy luôn chào chúng tôi."}, {"idn": "Namun, Sarah agak cerewet.", "vi": "Tuy nhiên, Sarah hơi nhiều chuyện."}, {"idn": "Di pesta ulang tahunnya Sarah menelepon semua orang agar datang tepat waktu.", "vi": "Ở tiệc sinh nhật của mình, Sarah gọi cho mọi người để đến đúng giờ."}, {"idn": "Dia juga perfeksionis.", "vi": "Cô ấy cũng cầu toàn."}, {"idn": "Dia ingin acaranya sempurna dan tidak ada yang salah.", "vi": "Cô ấy muốn buổi tiệc hoàn hảo và không có gì sai."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/530BIPA_1_UMUM_AUDIO_8.1.mp3"}, {"title": "Audio 8.2 — Beni và Toni", "kind": "text", "lines": [{"idn": "Beni adalah temanku. Dia sangat pendiam.", "vi": "Beni là bạn của tôi. Anh ấy rất trầm lặng."}, {"idn": "Dia suka menyendiri di kantor.", "vi": "Anh ấy thích ở một mình trong văn phòng."}, {"idn": "Dia jarang menyapa orang lain.", "vi": "Anh ấy hiếm khi chào người khác."}, {"idn": "Dia punya teman dekat. Namanya Toni.", "vi": "Anh ấy có một người bạn thân tên Toni."}, {"idn": "Toni berbeda dengan Beni. Toni sangat periang.", "vi": "Toni khác với Beni. Toni rất vui vẻ."}, {"idn": "Toni selalu ramah kepada siapa pun.", "vi": "Toni luôn thân thiện với bất kỳ ai."}, {"idn": "Toni sangat sabar menghadapi Beni.", "vi": "Toni rất kiên nhẫn đối với Beni."}, {"idn": "Namun, Toni agak pemarah.", "vi": "Tuy nhiên, Toni hơi hay nổi giận."}, {"idn": "Dia akan marah melihat orang malas.", "vi": "Anh ấy sẽ tức giận khi thấy người lười."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/552BIPA_1_UMUM_AUDIO_8.2.mp3"}, {"title": "Teks 8.1 — Sifat Fauzi", "kind": "text", "lines": [{"idn": "Fauzi adalah orang yang teratur.", "vi": "Fauzi là người ngăn nắp."}, {"idn": "Dia tidak pintar, tetapi tekun.", "vi": "Anh ấy không giỏi, nhưng cần mẫn."}, {"idn": "Dia bukan pemalas.", "vi": "Anh ấy không phải người lười."}, {"idn": "Dia juga rajin merapikan lemari pakaiannya.", "vi": "Anh ấy còn chăm sắp xếp tủ quần áo."}, {"idn": "Dia tidak tidur jika tugas belum selesai.", "vi": "Anh ấy không ngủ nếu chưa làm xong việc."}, {"idn": "Rekan kantornya senang berteman dengan Fauzi.", "vi": "Đồng nghiệp thích làm bạn với Fauzi."}]}, {"title": "Teks 8.2 — Bạn bè ở văn phòng của Yoyo", "kind": "text", "lines": [{"idn": "Hai, nama saya Yoyo. Saya sedang berada di kantor.", "vi": "Chào, tên tôi là Yoyo. Tôi đang ở văn phòng."}, {"idn": "Datil baik hati dan tenang.", "vi": "Datil tốt bụng và điềm tĩnh."}, {"idn": "Doni rajin dan cekatan.", "vi": "Doni chăm chỉ và nhanh nhẹn."}, {"idn": "Didik pendiam, tetapi ramah.", "vi": "Didik trầm lặng nhưng thân thiện."}, {"idn": "Fadil periang dan lucu.", "vi": "Fadil vui vẻ và hài hước."}, {"idn": "Laras cerdas dan perfeksionis. Ayu sabar dan pintar.", "vi": "Laras thông minh và cầu toàn. Ayu kiên nhẫn và giỏi."}, {"idn": "Putri perhatian dan cekatan. Roslia tekun dan tegas.", "vi": "Putri chu đáo và nhanh nhẹn. Roslia cần mẫn và quyết đoán."}]}], "grammar": [{"title": "bukan và tidak: hai cách phủ định", "body": "**Tidak** đứng trước **tính từ** hoặc **động từ**. **Bukan** đứng trước **danh từ**.", "examples": [{"idn": "Dia tidak pintar.", "vi": "Anh ấy không giỏi. (tidak + tính từ)"}, {"idn": "Dia bukan pemalas.", "vi": "Anh ấy không phải người lười. (bukan + danh từ)"}, {"idn": "Dia tidak tidur.", "vi": "Anh ấy không ngủ. (tidak + động từ)"}, {"idn": "Sarah bukan guru BIPA.", "vi": "Sarah không phải giáo viên BIPA."}]}, {"title": "adalah: là", "body": "**Adalah** nối chủ ngữ với danh từ hoặc đặc điểm, nghĩa là *là*. Dùng nhiều trong câu viết.", "examples": [{"idn": "Fauzi adalah orang yang teratur.", "vi": "Fauzi là người ngăn nắp."}, {"idn": "Beni adalah temanku.", "vi": "Beni là bạn của tôi."}]}, {"title": "ada có ba nghĩa", "body": "**Ada** có thể là *có mặt, có ở đó*, *sẵn có*, hoặc *có* theo nghĩa sở hữu.", "examples": [{"idn": "Di kantor ada Datil, Doni, Didik.", "vi": "Ở văn phòng có Datil, Doni, Didik. (có mặt)"}, {"idn": "Yoyo tidak ada uang.", "vi": "Yoyo không có tiền. (sở hữu)"}]}, {"title": "tetapi và namun: nhưng", "body": "Cả hai đều là *nhưng*. **Namun** thường đứng đầu câu, **tetapi** nối hai vế câu.", "examples": [{"idn": "Dia tidak pintar, tetapi tekun.", "vi": "Anh ấy không giỏi nhưng cần mẫn."}, {"idn": "Namun, Sarah agak cerewet.", "vi": "Tuy nhiên, Sarah hơi nhiều chuyện."}]}], "exercises": [{"id": "u08-x01", "t": "mcq", "q": "\"ramah\" nghĩa là", "opts": ["thân thiện", "nhút nhát", "keo kiệt", "lười"], "a": 0, "e": "ramah = thân thiện."}, {"id": "u08-x02", "t": "mcq", "q": "\"pendiam\" nghĩa là", "opts": ["ít nói", "vui vẻ", "hay giận", "lười"], "a": 0, "e": "pendiam = trầm lặng."}, {"id": "u08-x03", "t": "mcq", "q": "\"periang\" nghĩa là", "opts": ["vui vẻ", "trầm lặng", "hay giận", "nhút nhát"], "a": 0, "e": "periang = vui vẻ."}, {"id": "u08-x04", "t": "mcq", "q": "\"pemarah\" nghĩa là", "opts": ["hay nổi giận", "hay tha thứ", "hay giúp", "hay cười"], "a": 0, "e": "marah = giận."}, {"id": "u08-x05", "t": "mcq", "q": "\"pemalu\" nghĩa là", "opts": ["nhút nhát", "lười", "keo kiệt", "chu đáo"], "a": 0, "e": "malu = xấu hổ."}, {"id": "u08-x06", "t": "mcq", "q": "\"pelit\" nghĩa là", "opts": ["keo kiệt", "tiết kiệm", "tốt bụng", "trung thực"], "a": 0, "e": "pelit = keo kiệt."}, {"id": "u08-x07", "t": "mcq", "q": "\"hemat\" nghĩa là", "opts": ["tiết kiệm", "keo kiệt", "giàu", "lười"], "a": 0, "e": "hemat = tiết kiệm."}, {"id": "u08-x08", "t": "fill", "q": "Dia ___ pintar. (không giỏi)", "a": ["tidak"], "e": "tidak + tính từ."}, {"id": "u08-x09", "t": "fill", "q": "Dia ___ pemalas. (không phải người lười)", "a": ["bukan"], "e": "bukan + danh từ."}, {"id": "u08-x10", "t": "mcq", "q": "Sarah đến từ đâu?", "opts": ["Anh", "Indonesia", "Mỹ", "Úc"], "a": 0, "e": "Sarah berasal dari Inggris."}, {"id": "u08-x11", "t": "mcq", "q": "Beni là người", "opts": ["trầm lặng", "vui vẻ", "hay nổi giận", "hay giúp đỡ"], "a": 0, "e": "Dia sangat pendiam."}, {"id": "u08-x12", "t": "mcq", "q": "Toni là người", "opts": ["vui vẻ", "trầm lặng", "nhút nhát", "lười"], "a": 0, "e": "Toni sangat periang."}, {"id": "u08-x13", "t": "mcq", "q": "\"Dia tidak pintar, tetapi tekun.\" nghĩa là", "opts": ["Không giỏi nhưng cần mẫn", "Giỏi và cần mẫn", "Giỏi nhưng lười", "Không giỏi và lười"], "a": 0, "e": "tetapi = nhưng."}, {"id": "u08-x14", "t": "mcq", "q": "\"Yoyo tidak ada uang.\" nghĩa là", "opts": ["Yoyo không có tiền.", "Yoyo không ở đây.", "Yoyo không đến.", "Yoyo không thích tiền."], "a": 0, "e": "ada = có (sở hữu)."}, {"id": "u08-x15", "t": "mcq", "q": "\"adalah\" nghĩa là", "opts": ["là", "có", "ở", "không"], "a": 0, "e": "adalah = là."}], "culture": {"title": "Chào hỏi bằng hôn mũi ở Kupang", "vi": "Mỗi nơi trên thế giới có cách chào khác nhau: ở Tây Tạng người ta lè lưỡi, ở châu Âu thường áp má. Ở Nusa Tenggara Timur (NTT), đặc biệt là người Sabu, có cách chào độc đáo là **cium hidung** (hôn mũi). Đây là cách thể hiện tình cảm, truyền thống từ xưa và vẫn còn đến nay. Một số nước cũng có tục này như Alaska, Ả Rập Xê Út và New Zealand."}}, {"id": "u09", "num": 9, "title": "Arah, Letak, dan Lokasi", "vi_title": "Phương hướng, vị trí, địa điểm", "goals": ["Nhận biết từ về phương hướng, vị trí, môi trường xung quanh", "Hỏi và chỉ đường, nói vị trí đồ vật", "Đọc bản đồ, mô tả phòng, lớp học"], "vocab": [{"id": "u09-v01", "idn": "di mana", "vi": "ở đâu"}, {"id": "u09-v02", "idn": "di sebelah mana", "vi": "ở phía nào"}, {"id": "u09-v03", "idn": "letak", "vi": "vị trí"}, {"id": "u09-v04", "idn": "lokasi", "vi": "địa điểm"}, {"id": "u09-v05", "idn": "arah", "vi": "hướng"}, {"id": "u09-v06", "idn": "di dalam", "vi": "ở trong"}, {"id": "u09-v07", "idn": "di luar", "vi": "ở ngoài"}, {"id": "u09-v08", "idn": "di atas", "vi": "ở trên"}, {"id": "u09-v09", "idn": "di bawah", "vi": "ở dưới"}, {"id": "u09-v10", "idn": "di depan", "vi": "ở trước"}, {"id": "u09-v11", "idn": "di belakang", "vi": "ở sau"}, {"id": "u09-v12", "idn": "di samping", "vi": "bên cạnh"}, {"id": "u09-v13", "idn": "di sebelah", "vi": "bên cạnh, phía"}, {"id": "u09-v14", "idn": "di sebelah kiri", "vi": "bên trái"}, {"id": "u09-v15", "idn": "di sebelah kanan", "vi": "bên phải"}, {"id": "u09-v16", "idn": "di dekat", "vi": "gần"}, {"id": "u09-v17", "idn": "di antara", "vi": "ở giữa (hai vật)"}, {"id": "u09-v18", "idn": "di tengah", "vi": "ở giữa, ở chính giữa"}, {"id": "u09-v19", "idn": "di seberang", "vi": "đối diện, bên kia"}, {"id": "u09-v20", "idn": "di pojok", "vi": "ở góc"}, {"id": "u09-v21", "idn": "di sekitar", "vi": "xung quanh"}, {"id": "u09-v22", "idn": "berhadapan", "vi": "đối mặt"}, {"id": "u09-v23", "idn": "utara", "vi": "bắc"}, {"id": "u09-v24", "idn": "selatan", "vi": "nam"}, {"id": "u09-v25", "idn": "timur", "vi": "đông"}, {"id": "u09-v26", "idn": "barat", "vi": "tây"}, {"id": "u09-v27", "idn": "belok kiri", "vi": "rẽ trái"}, {"id": "u09-v28", "idn": "belok kanan", "vi": "rẽ phải"}, {"id": "u09-v29", "idn": "lurus", "vi": "thẳng"}, {"id": "u09-v30", "idn": "terus", "vi": "tiếp tục"}, {"id": "u09-v31", "idn": "ikuti jalan ini", "vi": "đi theo con đường này"}, {"id": "u09-v32", "idn": "pertigaan", "vi": "ngã ba"}, {"id": "u09-v33", "idn": "perempatan", "vi": "ngã tư"}, {"id": "u09-v34", "idn": "bundaran", "vi": "bùng binh"}, {"id": "u09-v35", "idn": "simpang tiga", "vi": "ngã ba"}, {"id": "u09-v36", "idn": "ujung jalan", "vi": "cuối đường"}, {"id": "u09-v37", "idn": "jalan", "vi": "đường"}, {"id": "u09-v38", "idn": "gang", "vi": "ngõ"}, {"id": "u09-v39", "idn": "sawah", "vi": "ruộng lúa"}, {"id": "u09-v40", "idn": "kamar tidur", "vi": "phòng ngủ"}, {"id": "u09-v41", "idn": "pintu", "vi": "cửa"}, {"id": "u09-v42", "idn": "lampu", "vi": "đèn"}, {"id": "u09-v43", "idn": "tempat tidur", "vi": "giường"}, {"id": "u09-v44", "idn": "kasur", "vi": "nệm"}, {"id": "u09-v45", "idn": "lemari", "vi": "tủ"}, {"id": "u09-v46", "idn": "karpet", "vi": "thảm"}, {"id": "u09-v47", "idn": "meja", "vi": "bàn"}, {"id": "u09-v48", "idn": "kursi", "vi": "ghế"}, {"id": "u09-v49", "idn": "sofa", "vi": "ghế sofa"}, {"id": "u09-v50", "idn": "radio", "vi": "radio"}, {"id": "u09-v51", "idn": "televisi", "vi": "ti vi"}, {"id": "u09-v52", "idn": "AC", "vi": "máy lạnh, điều hòa"}, {"id": "u09-v53", "idn": "papan tulis", "vi": "bảng viết"}, {"id": "u09-v54", "idn": "spidol", "vi": "bút lông"}, {"id": "u09-v55", "idn": "penghapus", "vi": "cục xóa, giẻ lau bảng"}, {"id": "u09-v56", "idn": "peta", "vi": "bản đồ"}, {"id": "u09-v57", "idn": "jam dinding", "vi": "đồng hồ treo tường"}, {"id": "u09-v58", "idn": "mal", "vi": "trung tâm thương mại"}, {"id": "u09-v59", "idn": "masjid", "vi": "nhà thờ Hồi giáo"}, {"id": "u09-v60", "idn": "toilet umum", "vi": "nhà vệ sinh công cộng"}, {"id": "u09-v61", "idn": "kantin", "vi": "căng tin"}, {"id": "u09-v62", "idn": "koperasi", "vi": "hợp tác xã, cửa hàng của trường"}, {"id": "u09-v63", "idn": "pompa bensin", "vi": "cây xăng"}, {"id": "u09-v64", "idn": "restoran", "vi": "nhà hàng"}, {"id": "u09-v65", "idn": "toko kelontong", "vi": "cửa hàng tạp hóa"}, {"id": "u09-v66", "idn": "saya mau tanya", "vi": "tôi muốn hỏi"}, {"id": "u09-v67", "idn": "maaf, bisa tolong ulangi?", "vi": "xin lỗi, bạn nhắc lại được không?"}, {"id": "u09-v68", "idn": "tolong", "vi": "làm ơn"}, {"id": "u09-v69", "idn": "mari", "vi": "xin mời; nào, ta đi"}, {"id": "u09-v70", "idn": "antar", "vi": "đưa đi"}], "dialogs": [{"title": "Audio 9.1 — Phòng ngủ của Santi", "kind": "text", "lines": [{"idn": "Ini gambar kamar tidur saya.", "vi": "Đây là hình phòng ngủ của tôi."}, {"idn": "Di kamar saya ada banyak benda.", "vi": "Trong phòng tôi có nhiều đồ."}, {"idn": "Di samping pintu kamar ada lampu.", "vi": "Bên cạnh cửa phòng có đèn."}, {"idn": "Di dekat lampu ada televisi.", "vi": "Gần đèn có ti vi."}, {"idn": "Di seberang televisi ada tempat tidur.", "vi": "Đối diện ti vi là giường."}, {"idn": "Tempat tidur saya berada di tengah kamar.", "vi": "Giường của tôi ở giữa phòng."}, {"idn": "Karpet ada di antara kasur dan televisi.", "vi": "Thảm ở giữa nệm và ti vi."}, {"idn": "Lemari ada di pojok kamar.", "vi": "Tủ ở góc phòng."}, {"idn": "Di dalam lemari ada baju saya.", "vi": "Trong tủ có quần áo của tôi."}, {"idn": "Radio ada di atas meja kecil.", "vi": "Radio ở trên chiếc bàn nhỏ."}, {"idn": "Ada sofa kecil di bawah AC.", "vi": "Có chiếc sofa nhỏ dưới máy lạnh."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/519BIPA_1_UMUM_AUDIO_9.1.mp3"}, {"title": "Dialog — Hỏi đường trong khuôn viên trường", "kind": "dialog", "lines": [{"who": "Sondang", "idn": "Permisi, Mbak, saya mau tanya.", "vi": "Xin lỗi chị, em muốn hỏi."}, {"who": "Rara", "idn": "Ya, ada yang bisa saya bantu?", "vi": "Vâng, tôi giúp gì được em?"}, {"who": "Sondang", "idn": "Kantin ada di mana, ya?", "vi": "Căng tin ở đâu vậy ạ?"}, {"who": "Rara", "idn": "Kantin ada di sebelah utara masjid, Mbak.", "vi": "Căng tin ở phía bắc nhà thờ Hồi giáo."}, {"who": "Sondang", "idn": "Masjidnya di mana?", "vi": "Còn nhà thờ ở đâu?"}, {"who": "Rara", "idn": "Ikuti jalan ini sampai pertigaan. Setelah itu belok kanan. Masjid ada di sebelah kiri jalan, seberang koperasi.", "vi": "Đi theo đường này đến ngã ba. Sau đó rẽ phải. Nhà thờ ở bên trái đường, đối diện cửa hàng hợp tác xã."}, {"who": "Sondang", "idn": "Oh, ya, terima kasih, Mbak!", "vi": "À vâng, cảm ơn chị!"}, {"who": "Rara", "idn": "Sama-sama.", "vi": "Không có gì."}, {"who": "Sondang", "idn": "Oh, ya, kalau toilet umum di mana, ya?", "vi": "À, còn nhà vệ sinh công cộng ở đâu ạ?"}, {"who": "Rara", "idn": "Toilet umum ada di sebelah kiri koperasi.", "vi": "Nhà vệ sinh ở bên trái cửa hàng hợp tác xã."}, {"who": "Sondang", "idn": "Maaf, bisa tolong ulangi?", "vi": "Xin lỗi, chị nhắc lại giúp được không?"}, {"who": "Rara", "idn": "Mari, saya antar saja.", "vi": "Để tôi đưa em đi luôn nhé."}, {"who": "Sondang", "idn": "Baik, terima kasih, Mbak.", "vi": "Vâng, cảm ơn chị."}]}, {"title": "Audio 9.2 — Đi đến đám cưới", "kind": "text", "lines": [{"idn": "Teman saya, Wina, menikah hari Sabtu lalu.", "vi": "Bạn tôi, Wina, kết hôn vào thứ Bảy tuần trước."}, {"idn": "Saya berangkat dari Gerung.", "vi": "Tôi xuất phát từ Gerung."}, {"idn": "Dari Gerung saya ke Barat sampai bertemu pertigaan.", "vi": "Từ Gerung tôi đi về hướng Tây đến ngã ba."}, {"idn": "Di ujung pertigaan ada Balai Desa Sekotong.", "vi": "Cuối ngã ba có Hội trường làng Sekotong."}, {"idn": "Dari Balai Desa Sekotong, saya ke arah Selatan.", "vi": "Từ đó, tôi đi về hướng Nam."}, {"idn": "Saya melewati SD Sekotong II di kanan jalan.", "vi": "Tôi đi qua trường tiểu học Sekotong II ở bên phải đường."}, {"idn": "Saya belok kanan masuk ke gang yang ada di antara SD Sekotong II dan sawah.", "vi": "Tôi rẽ phải vào ngõ nằm giữa trường và ruộng lúa."}, {"idn": "Di pertigaan kedua saya belok kanan.", "vi": "Ở ngã ba thứ hai tôi rẽ phải."}, {"idn": "Gedung pernikahan tepat berada di ujung jalan, menghadap ke Selatan.", "vi": "Nhà hàng tiệc cưới nằm ngay cuối đường, quay mặt về hướng Nam."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/9BIPA_1_UMUM_AUDIO_9.2.mp3"}, {"title": "Teks 9.2 — Lớp học của Sari", "kind": "text", "lines": [{"idn": "Hai, nama saya Sari. Hari ini saya masuk kelas baru.", "vi": "Chào, tôi là Sari. Hôm nay tôi vào lớp mới."}, {"idn": "Ada papan tulis besar di dalam kelas.", "vi": "Trong lớp có một cái bảng lớn."}, {"idn": "Spidol dan penghapus ada di bawah papan tulis.", "vi": "Bút lông và giẻ lau ở dưới bảng."}, {"idn": "Di sebelah kiri papan tulis ada lemari.", "vi": "Bên trái bảng có tủ."}, {"idn": "Di dalam lemari ada banyak buku.", "vi": "Trong tủ có nhiều sách."}, {"idn": "Meja dan kursi Bu Sinta ada di depan lemari.", "vi": "Bàn ghế cô Sinta ở trước tủ."}, {"idn": "Di seberang meja Bu Sinta ada meja dan kursi saya.", "vi": "Đối diện bàn cô Sinta là bàn ghế của tôi."}, {"idn": "Pintu ada di sisi kanan ruang kelas.", "vi": "Cửa ở bên phải lớp học."}, {"idn": "Peta ada di antara gambar pahlawan dan jam dinding.", "vi": "Bản đồ ở giữa tranh anh hùng và đồng hồ treo tường."}, {"idn": "Siswa di sebelahku bernama Anton.", "vi": "Bạn ngồi cạnh tôi tên là Anton."}, {"idn": "Di belakang Anton ada Novi dan Putri.", "vi": "Phía sau Anton có Novi và Putri."}]}], "grammar": [{"title": "Giới từ vị trí", "body": "**di atas** (trên), **di bawah** (dưới), **di depan** (trước), **di belakang** (sau), **di samping** (bên cạnh), **di dalam** (trong), **di seberang** (đối diện), **di antara** (giữa hai vật), **di tengah** (ở giữa), **di dekat** (gần), **di sebelah kiri/kanan** (bên trái/phải).", "examples": [{"idn": "Radio ada di atas meja kecil.", "vi": "Radio ở trên bàn nhỏ."}, {"idn": "Karpet ada di antara kasur dan televisi.", "vi": "Thảm ở giữa nệm và ti vi."}, {"idn": "Lampu ada di samping pintu.", "vi": "Đèn ở bên cạnh cửa."}]}, {"title": "Hỏi vị trí", "body": "Dùng **di mana** hoặc **di sebelah mana**. Có bốn cách đặt câu hỏi tương đương.", "examples": [{"idn": "Di mana letak kantin?", "vi": "Căng tin ở đâu?"}, {"idn": "Kantin ada di mana?", "vi": "Căng tin ở đâu?"}, {"idn": "Kantin letaknya di mana?", "vi": "Vị trí căng tin ở đâu?"}, {"idn": "Kantin ada di sebelah mana?", "vi": "Căng tin ở phía nào?"}]}, {"title": "di, ke, dari, pada", "body": "**di** chỉ nơi chốn, **ke** chỉ nơi đến, **dari** chỉ nơi xuất phát, **pada** chỉ thời điểm hoặc vị trí (nghĩa gần như *di*).", "examples": [{"idn": "Kami berjalan-jalan ke beberapa tempat di Lampung.", "vi": "Chúng tôi đi dạo đến vài nơi ở Lampung."}, {"idn": "Kami memulai perjalanan dari pompa bensin.", "vi": "Chúng tôi bắt đầu chuyến đi từ cây xăng."}, {"idn": "Pada akhir tahun lalu saya berkunjung ke Lampung.", "vi": "Cuối năm ngoái tôi đến thăm Lampung."}]}, {"title": "Chỉ đường", "body": "Các mẫu thường dùng: **ikuti jalan ini** (đi theo đường này), **sampai pertigaan** (đến ngã ba), **belok kanan/kiri** (rẽ phải/trái), **lurus terus** (đi thẳng), **di ujung jalan** (cuối đường).", "examples": [{"idn": "Ikuti jalan ini sampai pertigaan.", "vi": "Đi theo đường này đến ngã ba."}, {"idn": "Setelah itu belok kanan.", "vi": "Sau đó rẽ phải."}, {"idn": "Maaf, bisa tolong ulangi?", "vi": "Xin lỗi, bạn nhắc lại được không?"}]}], "exercises": [{"id": "u09-x01", "t": "mcq", "q": "\"di atas\" nghĩa là", "opts": ["ở trên", "ở dưới", "ở trước", "ở sau"], "a": 0, "e": "atas = trên."}, {"id": "u09-x02", "t": "mcq", "q": "\"di bawah\" nghĩa là", "opts": ["ở dưới", "ở trên", "ở giữa", "bên cạnh"], "a": 0, "e": "bawah = dưới."}, {"id": "u09-x03", "t": "mcq", "q": "\"di seberang\" nghĩa là", "opts": ["đối diện", "bên cạnh", "ở sau", "ở trong"], "a": 0, "e": "seberang = bên kia."}, {"id": "u09-x04", "t": "mcq", "q": "\"di antara\" dùng khi", "opts": ["ở giữa hai vật", "ở trên", "ở xa", "ở góc"], "a": 0, "e": "antara = giữa."}, {"id": "u09-x05", "t": "mcq", "q": "\"belok kanan\" nghĩa là", "opts": ["rẽ phải", "rẽ trái", "đi thẳng", "quay lại"], "a": 0, "e": "kanan = phải."}, {"id": "u09-x06", "t": "mcq", "q": "\"lurus\" nghĩa là", "opts": ["thẳng", "trái", "phải", "vòng"], "a": 0, "e": "lurus = thẳng."}, {"id": "u09-x07", "t": "mcq", "q": "\"utara\" là hướng", "opts": ["bắc", "nam", "đông", "tây"], "a": 0, "e": "utara = bắc."}, {"id": "u09-x08", "t": "mcq", "q": "\"barat\" là hướng", "opts": ["tây", "đông", "nam", "bắc"], "a": 0, "e": "barat = tây."}, {"id": "u09-x09", "t": "fill", "q": "Lemari ada di ___ kamar. (góc)", "a": ["pojok"], "e": "pojok = góc."}, {"id": "u09-x10", "t": "mcq", "q": "Câu hỏi nào hỏi vị trí?", "opts": ["Kantin ada di mana?", "Kapan kantin buka?", "Siapa di kantin?", "Berapa harganya?"], "a": 0, "e": "di mana = ở đâu."}, {"id": "u09-x11", "t": "mcq", "q": "Trong phòng Santi, tủ ở đâu?", "opts": ["Ở góc phòng", "Ở giữa phòng", "Trên bàn", "Dưới sofa"], "a": 0, "e": "di pojok kamar."}, {"id": "u09-x12", "t": "mcq", "q": "Trong phòng Santi, radio ở đâu?", "opts": ["Trên bàn nhỏ", "Trong tủ", "Dưới sofa", "Ở góc"], "a": 0, "e": "di atas meja kecil."}, {"id": "u09-x13", "t": "mcq", "q": "Trong lớp Sari, spidol và penghapus ở đâu?", "opts": ["Dưới bảng", "Trên bảng", "Trong tủ", "Trên bàn"], "a": 0, "e": "di bawah papan tulis."}, {"id": "u09-x14", "t": "mcq", "q": "Căng tin ở đâu?", "opts": ["Phía bắc nhà thờ Hồi giáo", "Phía nam trường", "Cạnh cửa hàng tạp hóa", "Cạnh cây xăng"], "a": 0, "e": "di sebelah utara masjid."}, {"id": "u09-x15", "t": "mcq", "q": "\"Maaf, bisa tolong ulangi?\" nghĩa là", "opts": ["Xin lỗi, nhắc lại được không?", "Xin lỗi, đi đâu?", "Xin lỗi, giá bao nhiêu?", "Xin lỗi, tôi đi đây."], "a": 0, "e": "ulangi = nhắc lại."}, {"id": "u09-x16", "t": "fill", "q": "___ mana letak kantin? (ở)", "a": ["Di"], "e": "di mana = ở đâu."}, {"id": "u09-x17", "t": "mcq", "q": "\"dari\" chỉ", "opts": ["nơi xuất phát", "nơi đến", "thời điểm", "số lượng"], "a": 0, "e": "dari = từ."}], "culture": {"title": "MRT Jakarta", "vi": "**Moda raya terpadu (MRT)** là tàu điện chạy ngầm ở Jakarta, kết nối nhiều địa điểm trong thành phố. Hệ thống thân thiện với người khuyết tật nhờ thang cuốn và thang máy, nhân viên luôn sẵn sàng hỗ trợ hành khách. Nếu đến Jakarta, bạn nên thử đi MRT."}}, {"id": "u10", "num": 10, "title": "Pengalaman Meli", "vi_title": "Trải nghiệm của Meli", "goals": ["Mô tả ngoại hình người và đặc điểm ngôi nhà", "Dùng tên màu sắc, quần áo, đồ dùng", "Đọc quảng cáo nhà trọ và viết mô tả bằng ber-"], "vocab": [{"id": "u10-v01", "idn": "ciri-ciri", "vi": "đặc điểm"}, {"id": "u10-v02", "idn": "ciri fisik", "vi": "đặc điểm ngoại hình"}, {"id": "u10-v03", "idn": "tinggi", "vi": "cao"}, {"id": "u10-v04", "idn": "pendek", "vi": "thấp"}, {"id": "u10-v05", "idn": "sedang", "vi": "vừa"}, {"id": "u10-v06", "idn": "gemuk", "vi": "mập"}, {"id": "u10-v07", "idn": "kurus", "vi": "gầy"}, {"id": "u10-v08", "idn": "ramping", "vi": "thon thả"}, {"id": "u10-v09", "idn": "semampai", "vi": "cao ráo, mảnh mai"}, {"id": "u10-v10", "idn": "cantik", "vi": "xinh đẹp"}, {"id": "u10-v11", "idn": "mirip", "vi": "giống"}, {"id": "u10-v12", "idn": "berbeda", "vi": "khác"}, {"id": "u10-v13", "idn": "rambut", "vi": "tóc"}, {"id": "u10-v14", "idn": "lurus", "vi": "thẳng"}, {"id": "u10-v15", "idn": "ikal", "vi": "xoăn nhẹ"}, {"id": "u10-v16", "idn": "keriting", "vi": "xoăn tít"}, {"id": "u10-v17", "idn": "botak", "vi": "hói"}, {"id": "u10-v18", "idn": "kulit", "vi": "da"}, {"id": "u10-v19", "idn": "sawo matang", "vi": "da nâu (da màu quả sawo chín)"}, {"id": "u10-v20", "idn": "putih", "vi": "trắng"}, {"id": "u10-v21", "idn": "hitam", "vi": "đen"}, {"id": "u10-v22", "idn": "cokelat", "vi": "nâu"}, {"id": "u10-v23", "idn": "merah", "vi": "đỏ"}, {"id": "u10-v24", "idn": "biru", "vi": "xanh dương"}, {"id": "u10-v25", "idn": "hijau", "vi": "xanh lá"}, {"id": "u10-v26", "idn": "abu-abu", "vi": "xám"}, {"id": "u10-v27", "idn": "ungu", "vi": "tím"}, {"id": "u10-v28", "idn": "merah muda", "vi": "hồng"}, {"id": "u10-v29", "idn": "emas", "vi": "vàng kim"}, {"id": "u10-v30", "idn": "warna-warni", "vi": "nhiều màu"}, {"id": "u10-v31", "idn": "mata", "vi": "mắt"}, {"id": "u10-v32", "idn": "kacamata", "vi": "kính mắt"}, {"id": "u10-v33", "idn": "kumis", "vi": "ria mép"}, {"id": "u10-v34", "idn": "berambut", "vi": "có tóc, để tóc"}, {"id": "u10-v35", "idn": "berkulit", "vi": "có da (màu da)"}, {"id": "u10-v36", "idn": "berbadan", "vi": "có thân hình"}, {"id": "u10-v37", "idn": "bertubuh", "vi": "có vóc dáng"}, {"id": "u10-v38", "idn": "bermata", "vi": "có mắt (màu mắt)"}, {"id": "u10-v39", "idn": "berkumis", "vi": "có ria mép"}, {"id": "u10-v40", "idn": "sepatu", "vi": "giày"}, {"id": "u10-v41", "idn": "sepatu pantofel", "vi": "giày da"}, {"id": "u10-v42", "idn": "kaus kaki", "vi": "tất"}, {"id": "u10-v43", "idn": "rok", "vi": "váy"}, {"id": "u10-v44", "idn": "kemeja", "vi": "áo sơ mi"}, {"id": "u10-v45", "idn": "blazer", "vi": "áo vest"}, {"id": "u10-v46", "idn": "jaket", "vi": "áo khoác"}, {"id": "u10-v47", "idn": "topi", "vi": "mũ"}, {"id": "u10-v48", "idn": "syal", "vi": "khăn quàng"}, {"id": "u10-v49", "idn": "celana panjang", "vi": "quần dài"}, {"id": "u10-v50", "idn": "celana pendek", "vi": "quần ngắn"}, {"id": "u10-v51", "idn": "jam tangan", "vi": "đồng hồ đeo tay"}, {"id": "u10-v52", "idn": "gelang", "vi": "vòng tay"}, {"id": "u10-v53", "idn": "boneka", "vi": "búp bê"}, {"id": "u10-v54", "idn": "membawa", "vi": "mang"}, {"id": "u10-v55", "idn": "merantau", "vi": "đi làm xa quê"}, {"id": "u10-v56", "idn": "rumah", "vi": "nhà"}, {"id": "u10-v57", "idn": "genting", "vi": "ngói"}, {"id": "u10-v58", "idn": "cat", "vi": "sơn"}, {"id": "u10-v59", "idn": "bercat", "vi": "được sơn"}, {"id": "u10-v60", "idn": "parkir", "vi": "chỗ đỗ xe"}, {"id": "u10-v61", "idn": "taman", "vi": "vườn, công viên"}, {"id": "u10-v62", "idn": "kolam ikan", "vi": "hồ cá"}, {"id": "u10-v63", "idn": "bunga", "vi": "hoa"}, {"id": "u10-v64", "idn": "bangku", "vi": "ghế dài"}, {"id": "u10-v65", "idn": "persegi panjang", "vi": "hình chữ nhật"}, {"id": "u10-v66", "idn": "bulat", "vi": "tròn"}, {"id": "u10-v67", "idn": "ber-AC", "vi": "có máy lạnh"}, {"id": "u10-v68", "idn": "indekos", "vi": "nhà trọ, ở trọ"}, {"id": "u10-v69", "idn": "sewa", "vi": "thuê"}, {"id": "u10-v70", "idn": "deposit", "vi": "tiền đặt cọc"}, {"id": "u10-v71", "idn": "hunian", "vi": "chỗ ở"}, {"id": "u10-v72", "idn": "kamar mandi", "vi": "phòng tắm"}], "dialogs": [{"title": "Audio 10.1 — Nhà của Mila", "kind": "text", "lines": [{"idn": "Rumah Mila sangat bagus.", "vi": "Nhà Mila rất đẹp."}, {"idn": "Ukurannya tidak terlalu besar.", "vi": "Kích thước không quá lớn."}, {"idn": "Di depan rumah ada tempat parkir mobil.", "vi": "Trước nhà có chỗ đỗ ô tô."}, {"idn": "Rumahnya bercat hijau dan putih.", "vi": "Nhà sơn màu xanh lá và trắng."}, {"idn": "Genting rumahnya berwarna abu-abu.", "vi": "Mái ngói màu xám."}, {"idn": "Rumahnya ber-AC.", "vi": "Nhà có máy lạnh."}, {"idn": "Pintunya berwarna cokelat tua.", "vi": "Cửa màu nâu đậm."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/113BIPA_1_UMUM_AUDIO_10.1.mp3"}, {"title": "Audio 10.2 — Hành lý của Meli", "kind": "text", "lines": [{"idn": "Besok saya akan merantau ke Jakarta untuk bekerja.", "vi": "Ngày mai tôi sẽ lên Jakarta làm việc xa nhà."}, {"idn": "Saya akan membawa sepatu pantofel hitam, kaus kaki cokelat, rok berwarna hitam, dan kemeja putih.", "vi": "Tôi sẽ mang giày da đen, tất nâu, váy màu đen và áo sơ mi trắng."}, {"idn": "Saya juga membawa blazer ungu dan jaket merah.", "vi": "Tôi cũng mang áo vest tím và áo khoác đỏ."}, {"idn": "Saya juga membawa jam tangan berwarna biru dan gelang berwarna merah.", "vi": "Tôi cũng mang đồng hồ xanh và vòng tay đỏ."}, {"idn": "Saya tidak membawa topi, baju olahraga, celana panjang, dan syal.", "vi": "Tôi không mang mũ, đồ thể thao, quần dài và khăn quàng."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/326BIPA_1_UMUM_AUDIO_10.2.mp3"}, {"title": "Audio 10.3 — Gia đình Meli", "kind": "dialog", "lines": [{"who": "Raden", "idn": "Meli, apa kamu mirip ibumu?", "vi": "Meli, bạn có giống mẹ không?"}, {"who": "Meli", "idn": "Tidak. Ibuku berbadan ramping, berkulit sawo matang, dan berambut ikal.", "vi": "Không. Mẹ mình thân hình thon, da nâu và tóc xoăn nhẹ."}, {"who": "Meli", "idn": "Ibuku bertubuh tinggi dan bermata kecokelatan.", "vi": "Mẹ mình cao và mắt nâu nâu."}, {"who": "Raden", "idn": "Bagaimana dengan ayahmu?", "vi": "Còn bố bạn thì sao?"}, {"who": "Meli", "idn": "Ayahku berbadan gemuk, berkulit cokelat, berambut hitam lurus, dan memakai kacamata.", "vi": "Bố mình mập, da nâu, tóc đen thẳng và đeo kính."}, {"who": "Meli", "idn": "Ayah berkumis tebal. Ia senang menggunakan celana pendek berwarna cokelat.", "vi": "Bố có ria dày. Bố thích mặc quần ngắn màu nâu."}, {"who": "Raden", "idn": "Lalu, bagaimana ciri-ciri kakakmu? Apa dia mirip denganmu?", "vi": "Còn chị bạn thì sao? Có giống bạn không?"}, {"who": "Meli", "idn": "Kakakku cantik, tinggi, dan semampai. Dia berbeda denganku. Dia berkulit putih.", "vi": "Chị mình xinh, cao và mảnh mai. Chị khác mình. Chị da trắng."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/569BIPA_1_UMUM_AUDIO_10.3.mp3"}, {"title": "Teks 10.2 — Nhà trọ của Meli", "kind": "text", "lines": [{"idn": "Rumah indekos Meli besar dan cantik.", "vi": "Nhà trọ của Meli to và đẹp."}, {"idn": "Di sana ada sepuluh kamar tidur.", "vi": "Ở đó có mười phòng ngủ."}, {"idn": "Satu kamar tidur berkamar mandi satu.", "vi": "Mỗi phòng ngủ có một phòng tắm."}, {"idn": "Rumah indekosnya bercat warna-warni.", "vi": "Nhà trọ sơn nhiều màu."}, {"idn": "Rumahnya berbentuk persegi panjang.", "vi": "Nhà có hình chữ nhật."}, {"idn": "Di sisi kiri dan kanan rumahnya ada pohon tinggi berdaun hijau.", "vi": "Hai bên nhà có cây cao lá xanh."}, {"idn": "Di belakang rumah indekos Meli ada taman. Taman itu ada kolam ikannya.", "vi": "Phía sau nhà trọ có vườn. Vườn có hồ cá."}, {"idn": "Di taman juga ada bangku panjang berwarna hitam.", "vi": "Trong vườn còn có ghế dài màu đen."}, {"idn": "Di depan bangku ada meja berbentuk bulat dan berwarna cokelat.", "vi": "Trước ghế có cái bàn tròn màu nâu."}]}], "grammar": [{"title": "Tiền tố ber- nghĩa là có", "body": "**Ber-** + danh từ nghĩa là *có* thứ đó. Rất hay dùng để tả ngoại hình và đặc điểm.", "examples": [{"idn": "berwarna biru", "vi": "có màu xanh"}, {"idn": "berambut ikal", "vi": "có tóc xoăn nhẹ"}, {"idn": "berkulit putih", "vi": "có da trắng"}, {"idn": "berbadan gemuk", "vi": "thân hình mập"}, {"idn": "bermata cokelat", "vi": "mắt nâu"}, {"idn": "berkumis tebal", "vi": "có ria dày"}, {"idn": "bercat hijau", "vi": "sơn xanh"}]}, {"title": "Mô tả ngoại hình", "body": "Dùng các nhóm đặc điểm: **tinggi badan** (tinggi, sedang, pendek), **postur** (gemuk, sedang, kurus), **rambut** (lurus, ikal, keriting, botak), **kulit**, **mata**. Mẫu: *Ibuku berbadan ramping, berkulit sawo matang, dan berambut ikal.*", "examples": [{"idn": "Ayahku berbadan gemuk dan berambut hitam lurus.", "vi": "Bố tôi mập và có tóc đen thẳng."}, {"idn": "Kakakku cantik, tinggi, dan semampai.", "vi": "Chị tôi xinh, cao và mảnh mai."}]}, {"title": "Mô tả nhà", "body": "Mô tả theo trình tự: kích thước, màu sắc, các phòng, tiện ích. Dùng **ber-** + danh từ và các giới từ vị trí đã học ở Unit 9.", "examples": [{"idn": "Rumahnya bercat hijau dan putih.", "vi": "Nhà sơn xanh lá và trắng."}, {"idn": "Ukurannya tidak terlalu besar.", "vi": "Kích thước không quá lớn."}, {"idn": "Di depan rumah ada tempat parkir.", "vi": "Trước nhà có chỗ đỗ xe."}]}, {"title": "Hỏi về ngôi nhà mơ ước", "body": "Mẫu câu: **Kamu suka rumah seperti apa?** (Bạn thích nhà thế nào?), **Warna apa yang kamu suka?**, **Berapa lantai?**.", "examples": [{"idn": "Kamu suka rumah seperti apa?", "vi": "Bạn thích ngôi nhà như thế nào?"}, {"idn": "Aku suka rumah yang besar dan luas.", "vi": "Mình thích nhà lớn và rộng."}]}], "exercises": [{"id": "u10-x01", "t": "mcq", "q": "\"tinggi\" nghĩa là", "opts": ["cao", "thấp", "mập", "gầy"], "a": 0, "e": "tinggi = cao."}, {"id": "u10-x02", "t": "mcq", "q": "\"kurus\" nghĩa là", "opts": ["gầy", "mập", "cao", "thấp"], "a": 0, "e": "kurus = gầy."}, {"id": "u10-x03", "t": "mcq", "q": "\"gemuk\" nghĩa là", "opts": ["mập", "gầy", "cao", "thấp"], "a": 0, "e": "gemuk = mập."}, {"id": "u10-x04", "t": "mcq", "q": "\"keriting\" nghĩa là", "opts": ["xoăn tít", "thẳng", "hói", "xoăn nhẹ"], "a": 0, "e": "keriting = xoăn tít."}, {"id": "u10-x05", "t": "mcq", "q": "\"berambut ikal\" nghĩa là", "opts": ["có tóc xoăn nhẹ", "có tóc thẳng", "không có tóc", "tóc ngắn"], "a": 0, "e": "ber- = có; ikal = xoăn nhẹ."}, {"id": "u10-x06", "t": "mcq", "q": "\"berwarna merah\" nghĩa là", "opts": ["có màu đỏ", "có màu xanh", "có màu đen", "không màu"], "a": 0, "e": "merah = đỏ."}, {"id": "u10-x07", "t": "mcq", "q": "\"cokelat\" là màu", "opts": ["nâu", "xám", "tím", "hồng"], "a": 0, "e": "cokelat = nâu."}, {"id": "u10-x08", "t": "mcq", "q": "\"abu-abu\" là màu", "opts": ["xám", "trắng", "đen", "vàng"], "a": 0, "e": "abu-abu = xám."}, {"id": "u10-x09", "t": "mcq", "q": "\"merah muda\" là màu", "opts": ["hồng", "đỏ", "tím", "cam"], "a": 0, "e": "merah muda = đỏ nhạt, tức hồng."}, {"id": "u10-x10", "t": "mcq", "q": "\"kemeja\" là", "opts": ["áo sơ mi", "váy", "mũ", "khăn quàng"], "a": 0, "e": "kemeja = áo sơ mi."}, {"id": "u10-x11", "t": "mcq", "q": "\"rok\" là", "opts": ["váy", "quần", "áo khoác", "giày"], "a": 0, "e": "rok = váy."}, {"id": "u10-x12", "t": "mcq", "q": "\"sepatu\" là", "opts": ["giày", "tất", "mũ", "vòng tay"], "a": 0, "e": "sepatu = giày."}, {"id": "u10-x13", "t": "fill", "q": "Rumahnya ___ hijau dan putih. (sơn)", "a": ["bercat"], "e": "ber- + cat = sơn màu."}, {"id": "u10-x14", "t": "fill", "q": "Ibuku ___ kulit sawo matang. (có da)", "a": ["berkulit"], "e": "ber- + kulit."}, {"id": "u10-x15", "t": "mcq", "q": "Mẹ Meli có dáng người", "opts": ["thon thả", "mập", "thấp", "gầy ốm"], "a": 0, "e": "berbadan ramping."}, {"id": "u10-x16", "t": "mcq", "q": "Bố Meli", "opts": ["mập, đeo kính", "gầy, tóc xoăn", "cao, da trắng", "thấp, ria mỏng"], "a": 0, "e": "gemuk, berkacamata."}, {"id": "u10-x17", "t": "mcq", "q": "Nhà trọ của Meli có bao nhiêu phòng ngủ?", "opts": ["Mười", "Năm", "Ba", "Hai mươi"], "a": 0, "e": "sepuluh kamar tidur."}, {"id": "u10-x18", "t": "mcq", "q": "Nhà trọ của Meli có hình", "opts": ["chữ nhật", "tròn", "vuông", "tam giác"], "a": 0, "e": "persegi panjang."}], "culture": {"title": "Người bản địa mắt xanh ở Indonesia", "vi": "Có những cư dân bản địa Indonesia mắt xanh ở Sulawesi Đông Nam, Bắc Maluku và Aceh Jaya. Ở đảo **Siompu** (Sulawesi Đông Nam), thế kỷ 16 người Bồ Đào Nha đến buôn gia vị và kết hôn với quý tộc Wolio, sinh ra con cháu mắt xanh, tóc hơi vàng. Ở **Halmahera Đông**, người Lingon là một dân tộc thiểu số. Ở **Lamno, Aceh Jaya**, con cháu mắt xanh là hậu duệ của lính Bồ Đào Nha bị Vương quốc Daya bắt giữ, không thể về châu Âu nên kết hôn với dân địa phương."}}]},
{"id": "bipa2", "title": "BIPA 2", "subtitle": "Sahabatku Indonesia", "cefr": "A2", "source": "Badan Pengembangan dan Pembinaan Bahasa, Kemendikbud, 2019", "units": [{"id": "u01", "num": 1, "title": "Alat Musik Kesukaan", "vi_title": "Nhạc cụ yêu thích", "goals": ["Hiểu hội thoại ở nơi học nhạc cụ", "Nói về nhạc cụ và thể loại nhạc yêu thích", "Đọc văn bản mô tả về đàn guitar và viết về nhạc cụ yêu thích"], "vocab": [{"id": "u01-v01", "idn": "alat musik", "vi": "nhạc cụ"}, {"id": "u01-v02", "idn": "toko alat musik", "vi": "cửa hàng nhạc cụ"}, {"id": "u01-v03", "idn": "musik", "vi": "âm nhạc"}, {"id": "u01-v04", "idn": "jenis musik", "vi": "thể loại nhạc"}, {"id": "u01-v05", "idn": "kursus", "vi": "khóa học"}, {"id": "u01-v06", "idn": "kursus musik", "vi": "khóa học nhạc"}, {"id": "u01-v07", "idn": "favorit", "vi": "yêu thích"}, {"id": "u01-v08", "idn": "terfavorit", "vi": "được yêu thích nhất"}, {"id": "u01-v09", "idn": "kesayangan", "vi": "thân yêu, yêu quý"}, {"id": "u01-v10", "idn": "kegemaran", "vi": "sở thích"}, {"id": "u01-v11", "idn": "gitar", "vi": "đàn guitar"}, {"id": "u01-v12", "idn": "piano", "vi": "đàn piano"}, {"id": "u01-v13", "idn": "saksofon", "vi": "kèn saxophone"}, {"id": "u01-v14", "idn": "senar", "vi": "dây đàn"}, {"id": "u01-v15", "idn": "dipetik", "vi": "được gảy"}, {"id": "u01-v16", "idn": "kunci", "vi": "hợp âm, chìa khóa"}, {"id": "u01-v17", "idn": "kunci-kunci dasar", "vi": "các hợp âm cơ bản"}, {"id": "u01-v18", "idn": "lagu", "vi": "bài hát"}, {"id": "u01-v19", "idn": "memainkan", "vi": "chơi (nhạc cụ)"}, {"id": "u01-v20", "idn": "bermain", "vi": "chơi"}, {"id": "u01-v21", "idn": "kelas", "vi": "lớp học"}, {"id": "u01-v22", "idn": "mulai", "vi": "bắt đầu"}, {"id": "u01-v23", "idn": "sampai jumpa", "vi": "hẹn gặp lại"}, {"id": "u01-v24", "idn": "belajar", "vi": "học"}, {"id": "u01-v25", "idn": "otodidak", "vi": "tự học"}, {"id": "u01-v26", "idn": "tanpa", "vi": "không có"}, {"id": "u01-v27", "idn": "guru", "vi": "thầy cô, giáo viên"}, {"id": "u01-v28", "idn": "sendiri", "vi": "một mình, tự mình"}, {"id": "u01-v29", "idn": "buku", "vi": "sách"}, {"id": "u01-v30", "idn": "internet", "vi": "mạng internet"}, {"id": "u01-v31", "idn": "mudah", "vi": "dễ"}, {"id": "u01-v32", "idn": "cukup", "vi": "khá, đủ"}, {"id": "u01-v33", "idn": "alasan", "vi": "lý do"}, {"id": "u01-v34", "idn": "mengapa", "vi": "tại sao"}, {"id": "u01-v35", "idn": "penjual", "vi": "người bán"}, {"id": "u01-v36", "idn": "tempat", "vi": "nơi"}, {"id": "u01-v37", "idn": "mengunjungi", "vi": "ghé thăm"}, {"id": "u01-v38", "idn": "paling", "vi": "nhất"}, {"id": "u01-v39", "idn": "berbagai", "vi": "nhiều loại"}, {"id": "u01-v40", "idn": "dunia", "vi": "thế giới"}, {"id": "u01-v41", "idn": "termasuk", "vi": "bao gồm"}, {"id": "u01-v42", "idn": "mengenal", "vi": "biết, làm quen"}, {"id": "u01-v43", "idn": "membeli", "vi": "mua"}, {"id": "u01-v44", "idn": "gitaris", "vi": "nghệ sĩ guitar"}, {"id": "u01-v45", "idn": "penulis lagu", "vi": "người viết lời, nhạc sĩ"}, {"id": "u01-v46", "idn": "jaz", "vi": "nhạc jazz"}, {"id": "u01-v47", "idn": "terkenal", "vi": "nổi tiếng"}, {"id": "u01-v48", "idn": "karya", "vi": "tác phẩm"}, {"id": "u01-v49", "idn": "memadukan", "vi": "kết hợp"}, {"id": "u01-v50", "idn": "elemen", "vi": "yếu tố"}, {"id": "u01-v51", "idn": "kebudayaan tradisional", "vi": "văn hóa truyền thống"}, {"id": "u01-v52", "idn": "modern", "vi": "hiện đại"}, {"id": "u01-v53", "idn": "unsur", "vi": "thành tố, yếu tố"}, {"id": "u01-v54", "idn": "ciri khas", "vi": "nét đặc trưng"}, {"id": "u01-v55", "idn": "cara memainkan", "vi": "cách chơi"}, {"id": "u01-v56", "idn": "biola", "vi": "đàn violin", "note": "bổ sung", "extra": true}, {"id": "u01-v57", "idn": "drum", "vi": "trống", "note": "bổ sung", "extra": true}, {"id": "u01-v58", "idn": "musik pop", "vi": "nhạc pop", "note": "bổ sung", "extra": true}, {"id": "u01-v59", "idn": "musik rock", "vi": "nhạc rock", "note": "bổ sung", "extra": true}, {"id": "u01-v60", "idn": "musik klasik", "vi": "nhạc cổ điển", "note": "bổ sung", "extra": true}, {"id": "u01-v61", "idn": "musik dangdut", "vi": "nhạc dangdut", "note": "bổ sung", "extra": true}], "dialogs": [{"title": "Audio 1 — Ở lớp học nhạc", "kind": "dialog", "lines": [{"who": "Ari", "idn": "Hai, Ela, kamu ikut kursus musik juga, ya?", "vi": "Chào Ela, bạn cũng học khóa nhạc à?"}, {"who": "Ela", "idn": "Iya, Ari. Kamu juga?", "vi": "Ừ, Ari. Bạn cũng vậy à?"}, {"who": "Ari", "idn": "Iya.", "vi": "Ừ."}, {"who": "Ela", "idn": "Kamu belajar alat musik apa?", "vi": "Bạn học nhạc cụ nào?"}, {"who": "Ari", "idn": "Gitar. Kamu?", "vi": "Guitar. Còn bạn?"}, {"who": "Ela", "idn": "Aku belajar bermain piano. Aku ke kelas dulu, ya. Kelas piano sudah mau mulai. Sampai jumpa, Ari.", "vi": "Mình học chơi piano. Mình đến lớp trước nhé. Lớp piano sắp bắt đầu rồi. Hẹn gặp lại, Ari."}, {"who": "Ari", "idn": "Sampai jumpa, Ela.", "vi": "Hẹn gặp lại, Ela."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/402BIPA_2_UMUM_UNIT_1_AUDIO_1.mp3"}, {"title": "Kegiatan 2 và 3 — Nhạc cụ và thể loại nhạc yêu thích", "kind": "dialog", "lines": [{"who": "A", "idn": "Kamu suka bermain alat musik apa?", "vi": "Bạn thích chơi nhạc cụ nào?"}, {"who": "B", "idn": "Saya suka bermain gitar. Kalau kamu?", "vi": "Mình thích chơi guitar. Còn bạn?"}, {"who": "A", "idn": "Saya suka bermain saksofon.", "vi": "Mình thích chơi saxophone."}, {"who": "B", "idn": "Kamu suka musik apa?", "vi": "Bạn thích nhạc gì?"}, {"who": "A", "idn": "Saya suka musik pop.", "vi": "Mình thích nhạc pop."}]}, {"title": "Teks 1 — Gitar", "kind": "text", "lines": [{"idn": "Gitar menjadi alat musik terfavorit di dunia, termasuk di Indonesia.", "vi": "Guitar là nhạc cụ được yêu thích nhất trên thế giới, kể cả ở Indonesia."}, {"idn": "Mengapa jadi favorit?", "vi": "Vì sao lại được yêu thích?"}, {"idn": "Alasannya adalah belajar gitar itu cukup mudah.", "vi": "Lý do là học guitar khá dễ."}, {"idn": "Hanya dengan mengenal kunci-kunci dasar seperti C, D, Dm, E, Em, F, A, dan Am, kita bisa memainkan beberapa lagu.", "vi": "Chỉ cần biết các hợp âm cơ bản như C, D, Dm, E, Em, F, A và Am, ta đã chơi được vài bài hát."}, {"idn": "Kita juga bisa belajar gitar sendiri tanpa seorang guru (otodidak).", "vi": "Ta cũng có thể tự học guitar mà không cần thầy (tự học)."}, {"idn": "Belajar gitar secara otodidak bisa kita lakukan melalui buku atau internet.", "vi": "Tự học guitar có thể làm qua sách hoặc internet."}, {"idn": "Kita juga cukup mudah untuk membeli gitar karena penjual gitar cukup banyak di beberapa tempat.", "vi": "Ta cũng khá dễ mua guitar vì người bán guitar khá nhiều ở nhiều nơi."}, {"idn": "Saat mengunjungi toko musik, alat musik yang paling banyak adalah gitar.", "vi": "Khi ghé cửa hàng nhạc cụ, nhạc cụ nhiều nhất là guitar."}, {"idn": "Biasanya toko musik menjual berbagai jenis gitar.", "vi": "Thường cửa hàng nhạc cụ bán nhiều loại guitar."}]}, {"title": "Wawasan — Tohpati, nghệ sĩ guitar jazz", "kind": "text", "lines": [{"idn": "Tohpati Ario Hutomo atau yang lebih dikenal dengan Tohpati adalah seorang gitaris dan penulis lagu Indonesia.", "vi": "Tohpati Ario Hutomo, thường gọi là Tohpati, là một nghệ sĩ guitar và nhạc sĩ người Indonesia."}, {"idn": "Dia lahir di Jakarta, 25 Juli 1971.", "vi": "Ông sinh ở Jakarta, ngày 25 tháng 7 năm 1971."}, {"idn": "Tohpati merupakan salah satu gitaris jaz yang terkenal.", "vi": "Tohpati là một trong những nghệ sĩ guitar jazz nổi tiếng."}, {"idn": "Banyak karyanya memadukan elemen kebudayaan tradisional.", "vi": "Nhiều tác phẩm của ông kết hợp yếu tố văn hóa truyền thống."}, {"idn": "Hal itu sejalan dengan usahanya untuk memadukan unsur modern dan unsur tradisional dalam musiknya.", "vi": "Điều đó phù hợp với nỗ lực của ông trong việc kết hợp yếu tố hiện đại và truyền thống trong âm nhạc."}]}], "grammar": [{"title": "Tiền tố ter-: nghĩa là nhất", "body": "Gắn **ter-** vào tính từ để có nghĩa **paling** (nhất). *terfavorit* = *paling favorit*. Cùng kiểu: *tercantik* (xinh nhất), *tertinggi* (cao nhất).", "examples": [{"idn": "Gitar menjadi alat musik terfavorit di dunia.", "vi": "Guitar là nhạc cụ được yêu thích nhất thế giới."}, {"idn": "terfavorit = paling favorit", "vi": "terfavorit = yêu thích nhất"}]}, {"title": "cukup: khá, đủ", "body": "**Cukup** là trạng từ chỉ mức độ, nghĩa là *khá*, *đủ*, *không thiếu*. Đứng trước tính từ.", "examples": [{"idn": "Belajar gitar itu cukup mudah.", "vi": "Học guitar khá dễ."}, {"idn": "Kita juga cukup mudah untuk membeli gitar.", "vi": "Ta cũng khá dễ mua guitar."}, {"idn": "Penjual gitar cukup banyak.", "vi": "Người bán guitar khá nhiều."}]}, {"title": "Hỏi sở thích nhạc cụ", "body": "Mẫu hỏi: **Kamu suka bermain alat musik apa?** Trả lời: **Saya suka bermain + nhạc cụ.** Hỏi thể loại nhạc: **Kamu suka musik apa?**", "examples": [{"idn": "Kamu suka bermain alat musik apa?", "vi": "Bạn thích chơi nhạc cụ nào?"}, {"idn": "Saya suka bermain gitar.", "vi": "Mình thích chơi guitar."}, {"idn": "Saya suka musik pop.", "vi": "Mình thích nhạc pop."}]}, {"title": "Cấu trúc văn bản mô tả", "body": "Bài mô tả (như Teks 1) gồm hai phần: **Identifikasi** (nêu đối tượng và lý do yêu thích) và **Deskripsi** (mô tả cách học, nơi mua). Khi viết về nhạc cụ yêu thích, bạn nêu: tên nhạc cụ, cách chơi, nét đặc trưng, nơi tìm thấy nhạc cụ đó.", "examples": [{"idn": "Identifikasi: Gitar menjadi alat musik terfavorit.", "vi": "Nêu đối tượng: Guitar là nhạc cụ được yêu thích nhất."}, {"idn": "Deskripsi: Belajar gitar secara otodidak bisa melalui buku atau internet.", "vi": "Mô tả: Tự học guitar có thể qua sách hoặc internet."}]}], "exercises": [{"id": "u01-x01", "t": "mcq", "q": "\"alat musik\" nghĩa là", "opts": ["nhạc cụ", "bài hát", "lớp học", "cửa hàng"], "a": 0, "e": "alat musik = nhạc cụ."}, {"id": "u01-x02", "t": "mcq", "q": "\"kursus musik\" nghĩa là", "opts": ["khóa học nhạc", "buổi hòa nhạc", "băng nhạc", "cửa hàng nhạc"], "a": 0, "e": "kursus = khóa học."}, {"id": "u01-x03", "t": "mcq", "q": "Ari học nhạc cụ nào?", "opts": ["Guitar", "Piano", "Violin", "Saxophone"], "a": 0, "e": "Ari: Gitar."}, {"id": "u01-x04", "t": "mcq", "q": "Ela học nhạc cụ nào?", "opts": ["Piano", "Guitar", "Violin", "Trống"], "a": 0, "e": "Aku belajar bermain piano."}, {"id": "u01-x05", "t": "mcq", "q": "Vì sao Ela đi trước?", "opts": ["Lớp piano sắp bắt đầu", "Cô ấy mệt", "Cô ấy về nhà", "Cô ấy quên đàn"], "a": 0, "e": "Kelas piano sudah mau mulai."}, {"id": "u01-x06", "t": "mcq", "q": "\"terfavorit\" nghĩa là", "opts": ["được yêu thích nhất", "hơi thích", "không thích", "ít thích"], "a": 0, "e": "ter- = paling."}, {"id": "u01-x07", "t": "fill", "q": "Roslia paling cantik, tức Roslia ___ (xinh nhất)", "a": ["tercantik"], "e": "ter- + cantik."}, {"id": "u01-x08", "t": "mcq", "q": "\"otodidak\" nghĩa là", "opts": ["tự học", "học với thầy", "học nhóm", "học ban đêm"], "a": 0, "e": "otodidak = tự học không cần thầy."}, {"id": "u01-x09", "t": "mcq", "q": "Vì sao guitar được yêu thích?", "opts": ["Học khá dễ", "Giá rất rẻ", "Dễ mang theo", "Âm to"], "a": 0, "e": "belajar gitar itu cukup mudah."}, {"id": "u01-x10", "t": "mcq", "q": "Có thể tự học guitar qua", "opts": ["sách hoặc internet", "truyền hình", "radio", "báo"], "a": 0, "e": "melalui buku atau internet."}, {"id": "u01-x11", "t": "mcq", "q": "\"cukup mudah\" nghĩa là", "opts": ["khá dễ", "rất khó", "không dễ", "quá dễ"], "a": 0, "e": "cukup = khá, đủ."}, {"id": "u01-x12", "t": "mcq", "q": "Ở cửa hàng nhạc cụ, nhạc cụ nhiều nhất là", "opts": ["guitar", "piano", "trống", "violin"], "a": 0, "e": "alat musik yang paling banyak adalah gitar."}, {"id": "u01-x13", "t": "mcq", "q": "Tohpati là", "opts": ["nghệ sĩ guitar jazz", "ca sĩ pop", "nghệ sĩ piano", "nhạc công trống"], "a": 0, "e": "gitaris jaz yang terkenal."}, {"id": "u01-x14", "t": "mcq", "q": "Ông Tohpati sinh ở đâu?", "opts": ["Jakarta", "Bali", "Bandung", "Yogyakarta"], "a": 0, "e": "lahir di Jakarta, 25 Juli 1971."}, {"id": "u01-x15", "t": "mcq", "q": "Tohpati kết hợp trong âm nhạc", "opts": ["yếu tố hiện đại và truyền thống", "nhạc rock và pop", "nhạc cổ điển và jazz", "guitar và trống"], "a": 0, "e": "memadukan unsur modern dan unsur tradisional."}, {"id": "u01-x16", "t": "fill", "q": "Saya suka ___ gitar. (chơi)", "a": ["bermain"], "e": "bermain gitar = chơi guitar."}], "culture": {"title": "Tohpati, nghệ sĩ guitar jazz nổi tiếng", "vi": "**Tohpati Ario Hutomo** (sinh ở Jakarta, 25/7/1971) là nghệ sĩ guitar và nhạc sĩ Indonesia, một trong những nghệ sĩ guitar jazz nổi tiếng. Nhiều tác phẩm của ông kết hợp yếu tố văn hóa truyền thống, phù hợp với nỗ lực hòa trộn yếu tố **hiện đại** và **truyền thống** trong âm nhạc."}}, {"id": "u02", "num": 2, "title": "Pekerjaan Saya", "vi_title": "Công việc của tôi", "goals": ["Hiểu bài phỏng vấn về nghề nghiệp", "Nói về nghề nghiệp và nhiệm vụ trong công việc", "Đọc và viết văn bản mô tả về công việc"], "vocab": [{"id": "u02-v01", "idn": "pekerjaan", "vi": "nghề nghiệp, công việc"}, {"id": "u02-v02", "idn": "bekerja", "vi": "làm việc"}, {"id": "u02-v03", "idn": "pegawai", "vi": "nhân viên"}, {"id": "u02-v04", "idn": "pegawai negeri", "vi": "công chức nhà nước"}, {"id": "u02-v05", "idn": "wartawan", "vi": "nhà báo"}, {"id": "u02-v06", "idn": "majalah", "vi": "tạp chí"}, {"id": "u02-v07", "idn": "mewawancarai", "vi": "phỏng vấn"}, {"id": "u02-v08", "idn": "guru", "vi": "giáo viên"}, {"id": "u02-v09", "idn": "tugas", "vi": "nhiệm vụ, bài tập"}, {"id": "u02-v10", "idn": "tugas guru", "vi": "nhiệm vụ của giáo viên"}, {"id": "u02-v11", "idn": "mengajar", "vi": "dạy học"}, {"id": "u02-v12", "idn": "siswa", "vi": "học sinh"}, {"id": "u02-v13", "idn": "sekolah", "vi": "trường học"}, {"id": "u02-v14", "idn": "luar biasa", "vi": "phi thường, tuyệt vời"}, {"id": "u02-v15", "idn": "bermanfaat", "vi": "có ích"}, {"id": "u02-v16", "idn": "manfaat", "vi": "lợi ích"}, {"id": "u02-v17", "idn": "kesan", "vi": "ấn tượng, cảm nhận"}, {"id": "u02-v18", "idn": "menyenangkan", "vi": "thú vị, dễ chịu"}, {"id": "u02-v19", "idn": "ilmu", "vi": "kiến thức"}, {"id": "u02-v20", "idn": "berguna", "vi": "hữu ích"}, {"id": "u02-v21", "idn": "resepsionis", "vi": "lễ tân"}, {"id": "u02-v22", "idn": "hotel", "vi": "khách sạn"}, {"id": "u02-v23", "idn": "tamu", "vi": "khách"}, {"id": "u02-v24", "idn": "tamu hotel", "vi": "khách của khách sạn"}, {"id": "u02-v25", "idn": "pesanan", "vi": "đơn đặt, thứ đã đặt"}, {"id": "u02-v26", "idn": "pesanan kamar", "vi": "đặt phòng"}, {"id": "u02-v27", "idn": "memeriksa", "vi": "kiểm tra"}, {"id": "u02-v28", "idn": "kunci kamar", "vi": "chìa khóa phòng"}, {"id": "u02-v29", "idn": "memberikan", "vi": "đưa cho, trao"}, {"id": "u02-v30", "idn": "menerima", "vi": "nhận"}, {"id": "u02-v31", "idn": "kembali", "vi": "trở lại, lại"}, {"id": "u02-v32", "idn": "menginap", "vi": "ở lại qua đêm"}, {"id": "u02-v33", "idn": "selesai", "vi": "xong"}, {"id": "u02-v34", "idn": "bertemu", "vi": "gặp"}, {"id": "u02-v35", "idn": "baru", "vi": "mới"}, {"id": "u02-v36", "idn": "bekerja 8 jam sehari", "vi": "làm việc 8 tiếng một ngày"}, {"id": "u02-v37", "idn": "jam kerja", "vi": "giờ làm việc"}, {"id": "u02-v38", "idn": "sudah dua tahun", "vi": "đã hai năm"}, {"id": "u02-v39", "idn": "salah satu", "vi": "một trong những"}, {"id": "u02-v40", "idn": "kebutuhan", "vi": "nhu cầu"}, {"id": "u02-v41", "idn": "keinginan", "vi": "mong muốn"}, {"id": "u02-v42", "idn": "populer", "vi": "phổ biến"}, {"id": "u02-v43", "idn": "survei", "vi": "khảo sát"}, {"id": "u02-v44", "idn": "pegawai bank", "vi": "nhân viên ngân hàng"}, {"id": "u02-v45", "idn": "PNS", "vi": "công chức (pegawai negeri sipil)"}, {"id": "u02-v46", "idn": "tenaga pemasaran", "vi": "nhân viên tiếp thị"}, {"id": "u02-v47", "idn": "TKI", "vi": "lao động Indonesia ở nước ngoài"}, {"id": "u02-v48", "idn": "teknologi informasi", "vi": "công nghệ thông tin"}, {"id": "u02-v49", "idn": "kesehatan", "vi": "y tế, sức khỏe"}, {"id": "u02-v50", "idn": "dokter", "vi": "bác sĩ"}, {"id": "u02-v51", "idn": "apoteker", "vi": "dược sĩ"}, {"id": "u02-v52", "idn": "jurnalis", "vi": "nhà báo"}, {"id": "u02-v53", "idn": "akuntan", "vi": "kế toán"}, {"id": "u02-v54", "idn": "karyawan", "vi": "nhân viên, công nhân viên"}, {"id": "u02-v55", "idn": "BUMN", "vi": "doanh nghiệp nhà nước"}, {"id": "u02-v56", "idn": "bagaimana", "vi": "thế nào"}, {"id": "u02-v57", "idn": "mengapa", "vi": "tại sao"}, {"id": "u02-v58", "idn": "kalau boleh tahu", "vi": "nếu được cho biết"}], "dialogs": [{"title": "Audio 2 — Phỏng vấn cô giáo Dian", "kind": "dialog", "lines": [{"who": "Wartawan", "idn": "Selamat pagi, Bu Dian. Saya dari majalah Edu. Saya ingin mewawancarai Ibu.", "vi": "Chào cô Dian. Tôi ở tạp chí Edu. Tôi muốn phỏng vấn cô."}, {"who": "Bu Dian", "idn": "Selamat pagi. Oh, silakan.", "vi": "Chào anh. À, mời anh."}, {"who": "Wartawan", "idn": "Terima kasih, Bu. Kalau boleh tahu, apa pekerjaan Ibu?", "vi": "Cảm ơn cô. Nếu được cho biết, nghề của cô là gì ạ?"}, {"who": "Bu Dian", "idn": "Saya guru.", "vi": "Tôi là giáo viên."}, {"who": "Wartawan", "idn": "Menurut Ibu, apa tugas seorang guru?", "vi": "Theo cô, nhiệm vụ của một giáo viên là gì?"}, {"who": "Bu Dian", "idn": "Tugas guru adalah mengajar siswa di sekolah.", "vi": "Nhiệm vụ của giáo viên là dạy học sinh ở trường."}, {"who": "Wartawan", "idn": "Mengapa Ibu menjadi seorang guru?", "vi": "Tại sao cô trở thành giáo viên?"}, {"who": "Bu Dian", "idn": "Guru adalah pekerjaan yang luar biasa dan bermanfaat.", "vi": "Giáo viên là nghề tuyệt vời và có ích."}, {"who": "Wartawan", "idn": "Bagaimana kesan Ibu selama menjadi guru?", "vi": "Cảm nhận của cô trong thời gian làm giáo viên thế nào?"}, {"who": "Bu Dian", "idn": "Hem, menyenangkan.", "vi": "Ừm, rất thú vị."}, {"who": "Wartawan", "idn": "Bisakah Ibu ceritakan hal yang menyenangkan itu?", "vi": "Cô kể giúp điều thú vị đó được không?"}, {"who": "Bu Dian", "idn": "Kita bisa memberi ilmu yang berguna untuk siswa.", "vi": "Chúng ta có thể trao kiến thức hữu ích cho học sinh."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/156BIPA_2_UMUM_UNIT_2_AUDIO_2.mp3"}, {"title": "Kegiatan 2 và 3 — Hỏi về nghề nghiệp", "kind": "dialog", "lines": [{"who": "A", "idn": "Apa pekerjaan kamu?", "vi": "Nghề của bạn là gì?"}, {"who": "B", "idn": "Saya seorang pegawai negeri. Kalau kamu?", "vi": "Mình là công chức nhà nước. Còn bạn?"}, {"who": "A", "idn": "Saya seorang wartawan.", "vi": "Mình là nhà báo."}, {"who": "Guru", "idn": "Saya adalah seorang guru. Tugas saya adalah mengajar siswa di sekolah.", "vi": "Tôi là một giáo viên. Nhiệm vụ của tôi là dạy học sinh ở trường."}]}, {"title": "Teks 2 — Nia, nhân viên lễ tân", "kind": "text", "lines": [{"idn": "Nama saya Nia. Saya seorang resepsionis di sebuah hotel.", "vi": "Tên tôi là Nia. Tôi là nhân viên lễ tân ở một khách sạn."}, {"idn": "Saya sudah 2 tahun bekerja di sini. Saya bekerja 8 jam sehari.", "vi": "Tôi làm ở đây đã 2 năm. Tôi làm việc 8 tiếng mỗi ngày."}, {"idn": "Salah satu tugas saya adalah memeriksa pesanan kamar dari tamu hotel.", "vi": "Một trong những nhiệm vụ của tôi là kiểm tra đặt phòng của khách."}, {"idn": "Setelah pesanan kamar benar, saya memberikan kunci kamar kepada tamu hotel.", "vi": "Sau khi đặt phòng đúng, tôi đưa chìa khóa phòng cho khách."}, {"idn": "Setelah tamu hotel selesai menginap, saya menerima kembali kunci kamar dari tamu hotel.", "vi": "Sau khi khách ở xong, tôi nhận lại chìa khóa phòng từ khách."}, {"idn": "Pekerjaan saya cukup menyenangkan. Saya bisa bertemu banyak orang baru.", "vi": "Công việc của tôi khá thú vị. Tôi có thể gặp nhiều người mới."}]}, {"title": "Wawasan — 10 nghề phổ biến nhất ở Indonesia", "kind": "text", "lines": [{"idn": "Bekerja merupakan kebutuhan setiap orang untuk memenuhi kebutuhan sehari-hari.", "vi": "Làm việc là nhu cầu của mọi người để đáp ứng nhu cầu hằng ngày."}, {"idn": "Banyak orang mendapatkan pekerjaan sesuai dengan keinginannya, tetapi banyak juga yang memilih pekerjaan karena populer.", "vi": "Nhiều người có được công việc đúng mong muốn, nhưng cũng nhiều người chọn nghề vì nó phổ biến."}, {"idn": "Berikut sepuluh pekerjaan yang paling populer di Indonesia berdasarkan survei yang dilakukan oleh laman carajadikarya.com tahun 2018.", "vi": "Sau đây là mười nghề phổ biến nhất ở Indonesia theo khảo sát của trang carajadikarya.com năm 2018."}, {"idn": "1. guru, 2. pegawai bank, 3. pegawai negeri sipil (PNS), 4. tenaga pemasaran (marketing), 5. tenaga kerja Indonesia (TKI)", "vi": "1. giáo viên, 2. nhân viên ngân hàng, 3. công chức (PNS), 4. nhân viên tiếp thị, 5. lao động Indonesia ở nước ngoài (TKI)"}, {"idn": "6. tenaga di bidang teknologi informasi, 7. tenaga di bidang kesehatan, seperti dokter atau apoteker", "vi": "6. nhân lực công nghệ thông tin, 7. nhân lực y tế như bác sĩ hoặc dược sĩ"}, {"idn": "8. jurnalis, 9. akuntan, 10. karyawan Badan Usaha Milik Negara (BUMN)", "vi": "8. nhà báo, 9. kế toán, 10. nhân viên doanh nghiệp nhà nước (BUMN)"}]}], "grammar": [{"title": "bagaimana và mengapa: hai từ để hỏi", "body": "**Bagaimana** hỏi về tình trạng hoặc quá trình. **Mengapa** hỏi lý do (nói thường dùng *kenapa*).", "examples": [{"idn": "Bagaimana kesan Anda menjadi seorang guru?", "vi": "Cảm nhận của bạn khi làm giáo viên thế nào?"}, {"idn": "Mengapa Anda menjadi seorang guru?", "vi": "Tại sao bạn làm giáo viên?"}]}, {"title": "Hỏi và nói về nghề nghiệp", "body": "Hỏi: **Apa pekerjaan Anda/kamu?** Trả lời: **Saya (adalah) seorang + nghề**. Nói nhiệm vụ: **Tugas saya adalah + động từ.**", "examples": [{"idn": "Apa pekerjaan kamu?", "vi": "Nghề của bạn là gì?"}, {"idn": "Saya seorang wartawan.", "vi": "Mình là nhà báo."}, {"idn": "Tugas saya adalah mengajar siswa di sekolah.", "vi": "Nhiệm vụ của tôi là dạy học sinh ở trường."}]}, {"title": "Nói thời gian làm việc", "body": "**Sudah + khoảng thời gian + bekerja** nói đã làm bao lâu. **Bekerja + số giờ + sehari** nói giờ làm mỗi ngày.", "examples": [{"idn": "Saya sudah 2 tahun bekerja di sini.", "vi": "Tôi làm ở đây đã 2 năm."}, {"idn": "Saya bekerja 8 jam sehari.", "vi": "Tôi làm việc 8 tiếng mỗi ngày."}, {"idn": "Sudah berapa lama Nia bekerja?", "vi": "Nia làm việc đã bao lâu?"}]}, {"title": "Cấu trúc văn bản mô tả công việc", "body": "Gồm hai phần: **Perkenalan diri** (tên, nghề, giờ làm) và **Tugas dalam pekerjaan** (các nhiệm vụ, cảm nhận). Khi viết, nêu: tên nghề, nhiệm vụ, giờ làm mỗi ngày, cảm nhận về nghề.", "examples": [{"idn": "Nama saya Nia. Saya seorang resepsionis di sebuah hotel.", "vi": "Tên tôi là Nia. Tôi là lễ tân ở một khách sạn."}, {"idn": "Pekerjaan saya cukup menyenangkan.", "vi": "Công việc của tôi khá thú vị."}]}], "exercises": [{"id": "u02-x01", "t": "mcq", "q": "\"wartawan\" là", "opts": ["nhà báo", "giáo viên", "lễ tân", "bác sĩ"], "a": 0, "e": "wartawan = nhà báo."}, {"id": "u02-x02", "t": "mcq", "q": "\"resepsionis\" là", "opts": ["nhân viên lễ tân", "nhân viên bán hàng", "kế toán", "giáo viên"], "a": 0, "e": "resepsionis = lễ tân."}, {"id": "u02-x03", "t": "mcq", "q": "\"mewawancarai\" nghĩa là", "opts": ["phỏng vấn", "viết báo", "chụp ảnh", "đăng ký"], "a": 0, "e": "wawancara = phỏng vấn."}, {"id": "u02-x04", "t": "mcq", "q": "Trong Audio 2, ai là giáo viên?", "opts": ["Bu Dian", "Người phóng viên", "Học sinh", "Hiệu trưởng"], "a": 0, "e": "Bu Dian: Saya guru."}, {"id": "u02-x05", "t": "mcq", "q": "Tugas guru theo Bu Dian là", "opts": ["dạy học sinh ở trường", "viết báo", "tiếp khách", "bán hàng"], "a": 0, "e": "mengajar siswa di sekolah."}, {"id": "u02-x06", "t": "mcq", "q": "Bu Dian nói nghề giáo viên là", "opts": ["tuyệt vời và có ích", "mệt mỏi", "khó khăn", "lương cao"], "a": 0, "e": "luar biasa dan bermanfaat."}, {"id": "u02-x07", "t": "mcq", "q": "\"Bagaimana kesan Ibu?\" hỏi về", "opts": ["cảm nhận", "giá cả", "thời gian", "nơi chốn"], "a": 0, "e": "kesan = ấn tượng, cảm nhận."}, {"id": "u02-x08", "t": "mcq", "q": "Từ hỏi lý do là", "opts": ["mengapa", "bagaimana", "berapa", "kapan"], "a": 0, "e": "mengapa = tại sao."}, {"id": "u02-x09", "t": "mcq", "q": "Nia làm nghề gì?", "opts": ["Lễ tân khách sạn", "Giáo viên", "Nhà báo", "Bác sĩ"], "a": 0, "e": "resepsionis di sebuah hotel."}, {"id": "u02-x10", "t": "mcq", "q": "Nia làm việc ở đó đã bao lâu?", "opts": ["Hai năm", "Một năm", "Năm năm", "Hai tháng"], "a": 0, "e": "Saya sudah 2 tahun bekerja di sini."}, {"id": "u02-x11", "t": "mcq", "q": "Mỗi ngày Nia làm việc mấy tiếng?", "opts": ["8 tiếng", "6 tiếng", "10 tiếng", "12 tiếng"], "a": 0, "e": "bekerja 8 jam sehari."}, {"id": "u02-x12", "t": "mcq", "q": "Một nhiệm vụ của Nia là", "opts": ["kiểm tra đặt phòng của khách", "nấu ăn", "lái xe", "dọn phòng"], "a": 0, "e": "memeriksa pesanan kamar."}, {"id": "u02-x13", "t": "mcq", "q": "Vì sao Nia thấy công việc thú vị?", "opts": ["Gặp được nhiều người mới", "Lương cao", "Làm ít giờ", "Ở nhà"], "a": 0, "e": "bisa bertemu banyak orang baru."}, {"id": "u02-x14", "t": "fill", "q": "Saya ___ 2 tahun bekerja di sini. (đã)", "a": ["sudah"], "e": "sudah + thời gian + bekerja."}, {"id": "u02-x15", "t": "fill", "q": "Tugas saya ___ mengajar siswa. (là)", "a": ["adalah"], "e": "Tugas saya adalah ..."}, {"id": "u02-x16", "t": "mcq", "q": "Nghề phổ biến nhất trong khảo sát năm 2018 là", "opts": ["giáo viên", "nhà báo", "kế toán", "công chức"], "a": 0, "e": "Nomor 1: guru."}, {"id": "u02-x17", "t": "mcq", "q": "\"PNS\" viết tắt của", "opts": ["pegawai negeri sipil", "pegawai nasional swasta", "pekerja nasional sipil", "petugas negeri sipil"], "a": 0, "e": "pegawai negeri sipil = công chức."}], "culture": {"title": "Sepuluh pekerjaan paling populer di Indonesia", "vi": "Theo khảo sát của trang carajadikarya.com năm 2018, mười nghề phổ biến nhất ở Indonesia là: **1. guru** (giáo viên), **2. pegawai bank** (nhân viên ngân hàng), **3. PNS** (công chức), **4. tenaga pemasaran** (tiếp thị), **5. TKI** (lao động ở nước ngoài), **6. teknologi informasi**, **7. tenaga kesehatan** (bác sĩ, dược sĩ), **8. jurnalis**, **9. akuntan** (kế toán), **10. karyawan BUMN**. Nhiều người chọn nghề đúng mong muốn, nhưng cũng nhiều người chọn vì nghề đó phổ biến."}}, {"id": "u03", "num": 3, "title": "Pengumuman", "vi_title": "Thông báo", "goals": ["Hiểu thông báo nói", "Đọc thông báo bằng văn bản", "Tự đưa ra thông báo đơn giản và viết thông báo"], "vocab": [{"id": "u03-v01", "idn": "pengumuman", "vi": "thông báo"}, {"id": "u03-v02", "idn": "mengumumkan", "vi": "thông báo, công bố"}, {"id": "u03-v03", "idn": "pengumuman penting", "vi": "thông báo quan trọng"}, {"id": "u03-v04", "idn": "Pasar Raya", "vi": "siêu thị, chợ lớn"}, {"id": "u03-v05", "idn": "potongan harga", "vi": "giảm giá"}, {"id": "u03-v06", "idn": "bahan pokok", "vi": "nhu yếu phẩm"}, {"id": "u03-v07", "idn": "sembako", "vi": "nhu yếu phẩm (sembilan bahan pokok)"}, {"id": "u03-v08", "idn": "akhir bulan", "vi": "cuối tháng"}, {"id": "u03-v09", "idn": "cabai", "vi": "ớt"}, {"id": "u03-v10", "idn": "bawang", "vi": "hành, tỏi"}, {"id": "u03-v11", "idn": "tomat", "vi": "cà chua"}, {"id": "u03-v12", "idn": "kilogram", "vi": "ki-lô-gam"}, {"id": "u03-v13", "idn": "seharga", "vi": "có giá"}, {"id": "u03-v14", "idn": "Rp18.000", "vi": "18.000 rupiah"}, {"id": "u03-v15", "idn": "Rp16.000", "vi": "16.000 rupiah"}, {"id": "u03-v16", "idn": "Rp6.000", "vi": "6.000 rupiah"}, {"id": "u03-v17", "idn": "demikian", "vi": "như vậy, trên đây"}, {"id": "u03-v18", "idn": "disampaikan", "vi": "được gửi đến, được truyền đạt"}, {"id": "u03-v19", "idn": "kehadiran", "vi": "sự có mặt"}, {"id": "u03-v20", "idn": "Bapak dan Ibu yang kami hormati", "vi": "kính thưa quý ông bà"}, {"id": "u03-v21", "idn": "tolong", "vi": "làm ơn"}, {"id": "u03-v22", "idn": "mengumpulkan", "vi": "thu, nộp"}, {"id": "u03-v23", "idn": "kumpulkan", "vi": "hãy nộp"}, {"id": "u03-v24", "idn": "tugas", "vi": "bài tập, nhiệm vụ"}, {"id": "u03-v25", "idn": "tugas menulis", "vi": "bài tập viết"}, {"id": "u03-v26", "idn": "teks", "vi": "văn bản"}, {"id": "u03-v27", "idn": "bahasa Indonesia", "vi": "tiếng Indonesia"}, {"id": "u03-v28", "idn": "pemelajar", "vi": "người học"}, {"id": "u03-v29", "idn": "ruang kelas", "vi": "phòng học"}, {"id": "u03-v30", "idn": "harus", "vi": "phải"}, {"id": "u03-v31", "idn": "sebelum", "vi": "trước"}, {"id": "u03-v32", "idn": "sesudah", "vi": "sau"}, {"id": "u03-v33", "idn": "pukul", "vi": "giờ"}, {"id": "u03-v34", "idn": "hari Selasa", "vi": "thứ Ba"}, {"id": "u03-v35", "idn": "atas perhatian Anda", "vi": "xin cảm ơn sự chú ý của quý vị"}, {"id": "u03-v36", "idn": "kami ucapkan terima kasih", "vi": "chúng tôi xin cảm ơn"}, {"id": "u03-v37", "idn": "beberapa", "vi": "vài, một số"}, {"id": "u03-v38", "idn": "sering", "vi": "thường"}, {"id": "u03-v39", "idn": "frekuensi", "vi": "tần suất"}, {"id": "u03-v40", "idn": "kerap", "vi": "thường"}, {"id": "u03-v41", "idn": "kelas", "vi": "lớp"}, {"id": "u03-v42", "idn": "dimulai", "vi": "được bắt đầu"}, {"id": "u03-v43", "idn": "besok", "vi": "ngày mai"}, {"id": "u03-v44", "idn": "senam", "vi": "thể dục nhịp điệu"}, {"id": "u03-v45", "idn": "senam pagi", "vi": "thể dục buổi sáng"}, {"id": "u03-v46", "idn": "lapangan", "vi": "sân"}, {"id": "u03-v47", "idn": "kentungan", "vi": "kẻng, mõ (kentongan)"}, {"id": "u03-v48", "idn": "memukul", "vi": "đánh, gõ"}, {"id": "u03-v49", "idn": "menarik perhatian", "vi": "thu hút sự chú ý"}, {"id": "u03-v50", "idn": "supaya", "vi": "để"}, {"id": "u03-v51", "idn": "berkumpul", "vi": "tập trung"}, {"id": "u03-v52", "idn": "zaman dahulu", "vi": "thời xưa"}, {"id": "u03-v53", "idn": "masyarakat", "vi": "người dân"}, {"id": "u03-v54", "idn": "dipakai", "vi": "được dùng"}, {"id": "u03-v55", "idn": "daerah", "vi": "vùng, địa phương"}], "dialogs": [{"title": "Audio 3 — Thông báo giảm giá ở siêu thị", "kind": "text", "lines": [{"idn": "Bapak dan Ibu yang kami hormati. Sekarang Pasar Raya Sentosa memberi potongan harga untuk beberapa bahan pokok.", "vi": "Kính thưa quý ông bà. Hiện nay siêu thị Pasar Raya Sentosa giảm giá cho một số nhu yếu phẩm."}, {"idn": "Potongan harga sering kami berikan pada setiap akhir bulan.", "vi": "Chúng tôi thường giảm giá vào cuối mỗi tháng."}, {"idn": "Potongan harga yang ada, antara lain, 1 kilogram cabai sekarang seharga Rp18.000.", "vi": "Các mức giảm giá hiện có gồm: 1 kg ớt giờ giá 18.000 rupiah."}, {"idn": "Satu kilogram bawang sekarang seharga Rp16.000.", "vi": "Một ki-lô-gam hành giờ giá 16.000 rupiah."}, {"idn": "Terakhir, harga 1 kilogram tomat adalah Rp6.000.", "vi": "Cuối cùng, giá 1 ki-lô-gam cà chua là 6.000 rupiah."}, {"idn": "Demikian pengumuman ini kami sampaikan.", "vi": "Trên đây là thông báo của chúng tôi."}, {"idn": "Kami tunggu kehadiran Bapak dan Ibu di pasar kami.", "vi": "Chúng tôi chờ quý ông bà đến siêu thị của chúng tôi."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/134BIPA_2_UMUM_UNIT_3_AUDIO_3.mp3"}, {"title": "Kegiatan 2 — Thông báo lớp tiếng Indonesia (mẫu)", "kind": "text", "lines": [{"idn": "Selamat siang, teman-teman. Kelas bahasa Indonesia akan dimulai besok pada pukul 10.00 pagi.", "vi": "Chào các bạn. Lớp tiếng Indonesia sẽ bắt đầu vào ngày mai lúc 10 giờ sáng."}, {"idn": "Mohon datang tepat waktu. Terima kasih.", "vi": "Xin hãy đến đúng giờ. Cảm ơn các bạn."}]}, {"title": "Teks 3 — Thông báo quan trọng", "kind": "text", "lines": [{"idn": "PENGUMUMAN PENTING", "vi": "THÔNG BÁO QUAN TRỌNG"}, {"idn": "Tolong kumpulkan tugas menulis teks bahasa Indonesia kepada Ibu Reni.", "vi": "Làm ơn nộp bài tập viết văn bản tiếng Indonesia cho cô Reni."}, {"idn": "Tugas tersebut harus dikumpulkan pada hari Selasa sebelum pukul 12.00 di ruang kelas.", "vi": "Bài tập này phải được nộp vào thứ Ba trước 12 giờ tại phòng học."}, {"idn": "Atas perhatian Anda, kami ucapkan terima kasih.", "vi": "Xin cảm ơn sự chú ý của các bạn."}]}, {"title": "Wawasan — Kentungan (kẻng)", "kind": "text", "lines": [{"idn": "Pada zaman dahulu, sebelum membacakan pengumuman, masyarakat Indonesia lebih dahulu memukul kentongan.", "vi": "Thời xưa, trước khi đọc thông báo, người Indonesia thường gõ kẻng trước."}, {"idn": "Fungsi kentungan ini adalah untuk menarik perhatian orang-orang supaya berkumpul.", "vi": "Công dụng của kẻng này là thu hút sự chú ý để mọi người tập trung."}, {"idn": "Setelah orang-orang berkumpul, pengumuman disampaikan.", "vi": "Sau khi mọi người tập trung, thông báo được truyền đạt."}, {"idn": "Saat ini, kentungan masih dipakai di beberapa daerah di Indonesia.", "vi": "Hiện nay, kẻng vẫn còn được dùng ở một số vùng của Indonesia."}]}], "grammar": [{"title": "beberapa: vài, một số", "body": "**Beberapa** là từ chỉ số lượng, nghĩa là *nhiều hơn hai nhưng chưa biết chính xác bao nhiêu*.", "examples": [{"idn": "Pasar Raya Sentosa memberi potongan harga untuk beberapa sembako.", "vi": "Siêu thị Pasar Raya Sentosa giảm giá cho một số nhu yếu phẩm."}, {"idn": "Kentungan masih dipakai di beberapa daerah.", "vi": "Kẻng vẫn còn dùng ở một số vùng."}]}, {"title": "sering: thường, chỉ tần suất", "body": "**Sering** chỉ việc *hay xảy ra*. Cùng nhóm tần suất: *selalu* (luôn luôn), *sering* (thường), *kadang-kadang* (thỉnh thoảng), *jarang* (hiếm), *tidak pernah* (không bao giờ).", "examples": [{"idn": "Potongan harga sering kami lakukan pada setiap akhir bulan.", "vi": "Chúng tôi thường giảm giá vào cuối mỗi tháng."}, {"idn": "Saya sering membaca pengumuman di sekolah.", "vi": "Tôi thường đọc thông báo ở trường."}]}, {"title": "Cấu trúc thông báo nói", "body": "Thông báo nói thường có: **lời chào** (*Bapak dan Ibu yang kami hormati*), **nội dung** (cái gì, giá bao nhiêu, khi nào), **lời kết** (*Demikian pengumuman ini kami sampaikan*).", "examples": [{"idn": "Bapak dan Ibu yang kami hormati.", "vi": "Kính thưa quý ông bà."}, {"idn": "Demikian pengumuman ini kami sampaikan.", "vi": "Trên đây là thông báo của chúng tôi."}]}, {"title": "Cấu trúc thông báo viết", "body": "Thông báo viết (Teks 3) gồm **nội dung yêu cầu** (*Tolong kumpulkan...*) và **thời gian, địa điểm** (*pada hari Selasa sebelum pukul 12.00 di ruang kelas*), kết bằng lời cảm ơn. Mẫu thời gian: **pada hari + thứ + sebelum pukul + giờ**.", "examples": [{"idn": "Tolong kumpulkan tugas kepada Ibu Reni.", "vi": "Làm ơn nộp bài cho cô Reni."}, {"idn": "Tugas harus dikumpulkan pada hari Selasa sebelum pukul 12.00.", "vi": "Bài phải nộp vào thứ Ba trước 12 giờ."}]}], "exercises": [{"id": "u03-x01", "t": "mcq", "q": "\"pengumuman\" nghĩa là", "opts": ["thông báo", "quảng cáo", "bài tập", "vé"], "a": 0, "e": "pengumuman = thông báo."}, {"id": "u03-x02", "t": "mcq", "q": "\"potongan harga\" nghĩa là", "opts": ["giảm giá", "tăng giá", "trả giá", "giá gốc"], "a": 0, "e": "potongan = phần cắt bớt."}, {"id": "u03-x03", "t": "mcq", "q": "Pasar Raya Sentosa thường giảm giá vào", "opts": ["cuối tháng", "đầu tháng", "giữa tháng", "mỗi ngày"], "a": 0, "e": "setiap akhir bulan."}, {"id": "u03-x04", "t": "mcq", "q": "Giá 1 kg ớt trong thông báo là", "opts": ["18.000 rupiah", "16.000 rupiah", "6.000 rupiah", "60.000 rupiah"], "a": 0, "e": "cabai seharga Rp18.000."}, {"id": "u03-x05", "t": "mcq", "q": "Giá 1 kg hành trong thông báo là", "opts": ["16.000 rupiah", "18.000 rupiah", "6.000 rupiah", "61.000 rupiah"], "a": 0, "e": "bawang seharga Rp16.000."}, {"id": "u03-x06", "t": "mcq", "q": "Giá 1 kg cà chua trong thông báo là", "opts": ["6.000 rupiah", "16.000 rupiah", "18.000 rupiah", "60.000 rupiah"], "a": 0, "e": "tomat Rp6.000."}, {"id": "u03-x07", "t": "mcq", "q": "\"Demikian pengumuman ini kami sampaikan\" dùng để", "opts": ["kết thúc thông báo", "mở đầu thông báo", "hỏi giá", "mời đi chợ"], "a": 0, "e": "Đây là câu kết thông báo."}, {"id": "u03-x08", "t": "mcq", "q": "Teks 3 yêu cầu làm gì?", "opts": ["Nộp bài viết cho cô Reni", "Đăng ký học", "Mua sách", "Nghỉ học"], "a": 0, "e": "Tolong kumpulkan tugas ... kepada Ibu Reni."}, {"id": "u03-x09", "t": "mcq", "q": "Hạn nộp bài trong Teks 3 là", "opts": ["thứ Ba trước 12 giờ", "thứ Hai trước 10 giờ", "thứ Tư sau 12 giờ", "thứ Sáu"], "a": 0, "e": "hari Selasa sebelum pukul 12.00."}, {"id": "u03-x10", "t": "mcq", "q": "Bài tập được nộp ở", "opts": ["phòng học", "phòng giáo viên", "thư viện", "hội trường"], "a": 0, "e": "di ruang kelas."}, {"id": "u03-x11", "t": "mcq", "q": "\"beberapa\" nghĩa là", "opts": ["vài, một số", "tất cả", "một", "không có"], "a": 0, "e": "beberapa = lebih dari dua, belum tahu pasti."}, {"id": "u03-x12", "t": "mcq", "q": "Từ chỉ tần suất trong câu \"Potongan harga sering kami lakukan\" là", "opts": ["sering", "kami", "lakukan", "harga"], "a": 0, "e": "sering = thường."}, {"id": "u03-x13", "t": "fill", "q": "Tolong ___ tugas kepada Ibu Reni. (nộp)", "a": ["kumpulkan"], "e": "kumpulkan = hãy nộp."}, {"id": "u03-x14", "t": "mcq", "q": "Thời xưa, trước khi đọc thông báo người Indonesia", "opts": ["gõ kẻng", "đánh trống", "thổi sáo", "rung chuông"], "a": 0, "e": "memukul kentongan."}, {"id": "u03-x15", "t": "mcq", "q": "Công dụng của kẻng là", "opts": ["thu hút sự chú ý để mọi người tập trung", "báo giờ ăn", "báo cháy", "đánh thức trẻ nhỏ"], "a": 0, "e": "menarik perhatian supaya berkumpul."}, {"id": "u03-x16", "t": "mcq", "q": "\"Atas perhatian Anda, kami ucapkan terima kasih\" nghĩa là", "opts": ["Xin cảm ơn sự chú ý của quý vị", "Xin lỗi vì làm phiền", "Mời quý vị ghé thăm", "Hẹn gặp lại"], "a": 0, "e": "perhatian = sự chú ý."}], "culture": {"title": "Kentungan: kẻng báo thông báo", "vi": "Thời xưa, trước khi đọc thông báo, người Indonesia thường **gõ kentungan (kentongan)** để thu hút sự chú ý, giúp mọi người tập trung lại rồi mới nghe thông báo. Hiện nay một số vùng ở Indonesia vẫn dùng kẻng này."}}, {"id": "u04", "num": 4, "title": "Belanja di Pasar", "vi_title": "Đi chợ mua sắm", "goals": ["Hiểu hội thoại khi mua sắm", "Nói điều mình muốn mua", "Đọc văn bản mô tả chợ truyền thống và viết thông tin quan trọng"], "vocab": [{"id": "u04-v01", "idn": "belanja", "vi": "mua sắm"}, {"id": "u04-v02", "idn": "berbelanja", "vi": "đi mua sắm"}, {"id": "u04-v03", "idn": "pasar", "vi": "chợ"}, {"id": "u04-v04", "idn": "pasar tradisional", "vi": "chợ truyền thống"}, {"id": "u04-v05", "idn": "pasar pakaian", "vi": "chợ quần áo"}, {"id": "u04-v06", "idn": "toko", "vi": "cửa hàng"}, {"id": "u04-v07", "idn": "penjual
