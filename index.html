 baju", "vi": "người bán áo"}, {"id": "u04-v08", "idn": "pembeli", "vi": "người mua"}, {"id": "u04-v09", "idn": "cari apa", "vi": "bạn tìm gì"}, {"id": "u04-v10", "idn": "lihat-lihat", "vi": "xem xem, ngắm hàng"}, {"id": "u04-v11", "idn": "silakan", "vi": "xin mời"}, {"id": "u04-v12", "idn": "ingin", "vi": "muốn"}, {"id": "u04-v13", "idn": "membeli", "vi": "mua"}, {"id": "u04-v14", "idn": "blus", "vi": "áo blouse"}, {"id": "u04-v15", "idn": "rok", "vi": "váy"}, {"id": "u04-v16", "idn": "rok panjang", "vi": "váy dài"}, {"id": "u04-v17", "idn": "baju", "vi": "áo"}, {"id": "u04-v18", "idn": "celana", "vi": "quần"}, {"id": "u04-v19", "idn": "barang", "vi": "hàng, đồ"}, {"id": "u04-v20", "idn": "harga", "vi": "giá"}, {"id": "u04-v21", "idn": "murah", "vi": "rẻ"}, {"id": "u04-v22", "idn": "bagus", "vi": "đẹp, tốt"}, {"id": "u04-v23", "idn": "ambil", "vi": "lấy"}, {"id": "u04-v24", "idn": "saya ambil", "vi": "tôi lấy"}, {"id": "u04-v25", "idn": "uang", "vi": "tiền"}, {"id": "u04-v26", "idn": "ini uangnya", "vi": "đây là tiền"}, {"id": "u04-v27", "idn": "kembalian", "vi": "tiền thối"}, {"id": "u04-v28", "idn": "ada lagi", "vi": "còn gì nữa không"}, {"id": "u04-v29", "idn": "ini saja", "vi": "chỉ thế thôi"}, {"id": "u04-v30", "idn": "terima kasih sudah berbelanja", "vi": "cảm ơn đã mua sắm"}, {"id": "u04-v31", "idn": "kecil", "vi": "nhỏ, chật"}, {"id": "u04-v32", "idn": "karena", "vi": "vì"}, {"id": "u04-v33", "idn": "wilayah", "vi": "vùng, khu vực"}, {"id": "u04-v34", "idn": "pemerintah", "vi": "chính phủ"}, {"id": "u04-v35", "idn": "pemerintah daerah", "vi": "chính quyền địa phương"}, {"id": "u04-v36", "idn": "menata", "vi": "sắp xếp, bài trí"}, {"id": "u04-v37", "idn": "tertata rapi", "vi": "được sắp xếp gọn gàng"}, {"id": "u04-v38", "idn": "kotor", "vi": "bẩn"}, {"id": "u04-v39", "idn": "bersih", "vi": "sạch"}, {"id": "u04-v40", "idn": "kebersihan", "vi": "sự sạch sẽ"}, {"id": "u04-v41", "idn": "bangunan", "vi": "tòa nhà, công trình"}, {"id": "u04-v42", "idn": "permanen", "vi": "cố định, kiên cố"}, {"id": "u04-v43", "idn": "mengerti", "vi": "hiểu"}, {"id": "u04-v44", "idn": "aturan", "vi": "quy định"}, {"id": "u04-v45", "idn": "buang sampah", "vi": "vứt rác"}, {"id": "u04-v46", "idn": "sembarangan", "vi": "bừa bãi"}, {"id": "u04-v47", "idn": "nyaman", "vi": "thoải mái"}, {"id": "u04-v48", "idn": "dahulu", "vi": "ngày xưa"}, {"id": "u04-v49", "idn": "sekarang", "vi": "bây giờ"}, {"id": "u04-v50", "idn": "tidak lagi", "vi": "không còn"}, {"id": "u04-v51", "idn": "mari", "vi": "nào, xin mời"}, {"id": "u04-v52", "idn": "jangan", "vi": "đừng"}, {"id": "u04-v53", "idn": "larangan", "vi": "điều cấm"}, {"id": "u04-v54", "idn": "aplikasi", "vi": "ứng dụng"}, {"id": "u04-v55", "idn": "daring", "vi": "trực tuyến"}, {"id": "u04-v56", "idn": "dalam jaringan", "vi": "trực tuyến (online)"}, {"id": "u04-v57", "idn": "gemar", "vi": "thích, ham"}, {"id": "u04-v58", "idn": "menilai", "vi": "đánh giá"}, {"id": "u04-v59", "idn": "tidak perlu", "vi": "không cần"}, {"id": "u04-v60", "idn": "menunggu", "vi": "chờ"}, {"id": "u04-v61", "idn": "jasa kurir", "vi": "dịch vụ giao hàng"}, {"id": "u04-v62", "idn": "kondisi", "vi": "tình trạng"}, {"id": "u04-v63", "idn": "manfaat", "vi": "lợi ích"}], "dialogs": [{"title": "Audio 4 — Mua áo và váy", "kind": "dialog", "lines": [{"who": "Penjual Baju", "idn": "Cari apa, Bu? Silakan, lihat-lihat dulu.", "vi": "Chị tìm gì ạ? Mời chị cứ xem xem."}, {"who": "Pembeli", "idn": "Saya ingin membeli satu blus dan satu rok panjang.", "vi": "Tôi muốn mua một áo blouse và một váy dài."}, {"who": "Penjual Baju", "idn": "Oh, ada, Bu. Silakan. Ini banyak barangnya. Satu blus harganya Rp90.000,00. Satu rok harganya Rp80.000,00.", "vi": "À có ạ. Mời chị. Ở đây có nhiều hàng. Một áo blouse giá 90.000 rupiah. Một váy giá 80.000 rupiah."}, {"who": "Pembeli", "idn": "Oh, bagus. Murah juga. Saya ambil, ya. Ini uangnya.", "vi": "Ồ, đẹp. Rẻ nữa. Tôi lấy nhé. Đây là tiền."}, {"who": "Penjual Baju", "idn": "Ini barangnya, Bu dan ini kembaliannya Rp30.000. Ada lagi, Bu?", "vi": "Hàng của chị đây, và tiền thối là 30.000 rupiah. Chị cần gì nữa không ạ?"}, {"who": "Pembeli", "idn": "Ini saja. Terima kasih.", "vi": "Chỉ vậy thôi. Cảm ơn."}, {"who": "Penjual Baju", "idn": "Baik, sama-sama, Bu. Terima kasih sudah berbelanja di Toko Anisa.", "vi": "Vâng, không có gì ạ. Cảm ơn chị đã mua sắm ở cửa hàng Anisa."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/238BIPA_2_UMUM_UNIT_4_AUDIO_4.mp3"}, {"title": "Kegiatan 2 — Nói điều muốn mua", "kind": "text", "lines": [{"idn": "Saya ingin membeli baju dan celana karena baju dan celana saya sudah kecil.", "vi": "Tôi muốn mua áo và quần vì áo và quần của tôi đã chật."}]}, {"title": "Teks 4 — Chợ truyền thống", "kind": "text", "lines": [{"idn": "Pasar tradisional sekarang tidak lagi seperti yang dahulu.", "vi": "Chợ truyền thống bây giờ không còn như ngày xưa."}, {"idn": "Dahulu pasar tradisional sangat tidak tertata rapi dan kotor.", "vi": "Ngày xưa chợ truyền thống rất lộn xộn và bẩn."}, {"idn": "Saat ini pemerintah daerah di banyak wilayah Indonesia sudah menata pasar tradisional dengan lebih baik.", "vi": "Hiện nay chính quyền địa phương ở nhiều vùng của Indonesia đã sắp xếp chợ truyền thống tốt hơn."}, {"idn": "Sekarang bangunan pasar tradisional sudah banyak yang permanen.", "vi": "Bây giờ nhiều chợ truyền thống đã xây kiên cố."}, {"idn": "Pasar tradisional sekarang juga lebih bersih.", "vi": "Chợ truyền thống bây giờ cũng sạch hơn."}, {"idn": "Penjual dan pembeli sudah sangat mengerti tentang kebersihan pasar.", "vi": "Người bán và người mua đã rất hiểu về việc giữ vệ sinh chợ."}, {"idn": "Banyak pasar tradisional membuat aturan jangan buang sampah sembarangan.", "vi": "Nhiều chợ truyền thống đặt quy định đừng vứt rác bừa bãi."}, {"idn": "Semua itu dilakukan agar pembeli merasa nyaman saat berbelanja di pasar tradisional.", "vi": "Tất cả điều đó được làm để người mua cảm thấy thoải mái khi mua sắm ở chợ truyền thống."}]}, {"title": "Wawasan — Mua sắm qua ứng dụng trực tuyến", "kind": "text", "lines": [{"idn": "Pada zaman sekarang banyak orang gemar berbelanja melalui aplikasi belanja dalam jaringan (daring).", "vi": "Thời nay nhiều người thích mua sắm qua ứng dụng mua sắm trực tuyến."}, {"idn": "Mereka menilai bahwa berbelanja melalui aplikasi daring lebih mudah.", "vi": "Họ thấy rằng mua sắm qua ứng dụng trực tuyến dễ hơn."}, {"idn": "Dengan aplikasi itu, para pembeli tidak perlu datang ke toko atau pasar.", "vi": "Nhờ ứng dụng đó, người mua không cần đến cửa hàng hay chợ."}, {"idn": "Mereka hanya menunggu barang datang melalui jasa kurir.", "vi": "Họ chỉ cần chờ hàng được giao đến qua dịch vụ giao hàng."}]}], "grammar": [{"title": "mari: lời rủ; jangan: lời cấm", "body": "**Mari** dùng để mời, rủ ai cùng làm gì: *Mari lihat-lihat dahulu*. **Jangan** dùng để cấm, ngăn: *jangan buang sampah sembarangan*.", "examples": [{"idn": "Mari lihat-lihat dahulu.", "vi": "Mời cứ xem xem trước nhé."}, {"idn": "Banyak pasar membuat aturan jangan buang sampah sembarangan.", "vi": "Nhiều chợ đặt quy định đừng vứt rác bừa bãi."}]}, {"title": "Hỏi và nói muốn mua gì", "body": "Người bán hỏi: **Cari apa?** Người mua nói: **Saya ingin membeli + món hàng.** Chốt mua: **Saya ambil.** Hỏi thêm: **Ada lagi?** Trả lời: **Ini saja.**", "examples": [{"idn": "Cari apa, Bu?", "vi": "Chị tìm gì ạ?"}, {"idn": "Saya ingin membeli satu blus dan satu rok panjang.", "vi": "Tôi muốn mua một áo blouse và một váy dài."}, {"idn": "Saya ambil, ya.", "vi": "Tôi lấy nhé."}, {"idn": "Ada lagi? Ini saja.", "vi": "Còn gì nữa không? Chỉ vậy thôi."}]}, {"title": "Tiền tố meng- trong Teks 4", "body": "Trong Teks 4, **menata** (từ gốc *tata*) là động từ với tiền tố **meng-**: *sắp xếp, bài trí*. Dạng bị động *tertata* nghĩa là *được sắp xếp*.", "examples": [{"idn": "Pemerintah daerah menata pasar tradisional dengan lebih baik.", "vi": "Chính quyền địa phương sắp xếp chợ truyền thống tốt hơn."}, {"idn": "Dahulu pasar tradisional tidak tertata rapi.", "vi": "Ngày xưa chợ truyền thống không được sắp xếp gọn gàng."}]}, {"title": "Dahulu và sekarang; tidak lagi", "body": "**Dahulu** là ngày xưa, **sekarang** là bây giờ. **Tidak lagi** nghĩa là *không còn nữa*. Bài mô tả có thể so sánh xưa và nay.", "examples": [{"idn": "Pasar tradisional sekarang tidak lagi seperti yang dahulu.", "vi": "Chợ truyền thống bây giờ không còn như xưa."}, {"idn": "Dahulu pasar kotor, sekarang lebih bersih.", "vi": "Ngày xưa chợ bẩn, bây giờ sạch hơn."}]}, {"title": "Cấu trúc văn bản mô tả chợ", "body": "Gồm hai phần: **Identifikasi** (nêu đối tượng, thay đổi so với trước) và **Deskripsi** (bangunan, kebersihan, aturan, kết quả). Khi viết, nêu: tình trạng chợ hiện nay, công trình, quy định, lợi ích của quy định.", "examples": [{"idn": "Banyak pasar membuat aturan agar pembeli merasa nyaman.", "vi": "Nhiều chợ đặt quy định để người mua thấy thoải mái."}]}], "exercises": [{"id": "u04-x01", "t": "mcq", "q": "\"belanja\" nghĩa là", "opts": ["mua sắm", "bán hàng", "nấu ăn", "đi chơi"], "a": 0, "e": "belanja = mua sắm."}, {"id": "u04-x02", "t": "mcq", "q": "\"kembalian\" nghĩa là", "opts": ["tiền thối", "tiền trả", "giá bán", "thuế"], "a": 0, "e": "kembalian = tiền trả lại."}, {"id": "u04-x03", "t": "mcq", "q": "Người mua muốn mua gì?", "opts": ["Một áo blouse và một váy dài", "Hai áo", "Một quần", "Giày"], "a": 0, "e": "satu blus dan satu rok panjang."}, {"id": "u04-x04", "t": "mcq", "q": "Giá một váy trong Audio 4 là", "opts": ["80.000 rupiah", "90.000 rupiah", "30.000 rupiah", "70.000 rupiah"], "a": 0, "e": "satu rok harganya Rp80.000."}, {"id": "u04-x05", "t": "mcq", "q": "Giá một áo blouse trong Audio 4 là", "opts": ["90.000 rupiah", "80.000 rupiah", "30.000 rupiah", "19.000 rupiah"], "a": 0, "e": "satu blus harganya Rp90.000."}, {"id": "u04-x06", "t": "mcq", "q": "Tiền thối của người mua là", "opts": ["30.000 rupiah", "20.000 rupiah", "10.000 rupiah", "50.000 rupiah"], "a": 0, "e": "kembaliannya Rp30.000."}, {"id": "u04-x07", "t": "mcq", "q": "Tên cửa hàng là", "opts": ["Toko Anisa", "Toko Ani", "Toko Annisa Baru", "Toko Bu Dian"], "a": 0, "e": "Toko Anisa."}, {"id": "u04-x08", "t": "mcq", "q": "\"Saya ambil, ya\" nghĩa là", "opts": ["Tôi lấy nhé", "Tôi trả giá", "Tôi không lấy", "Tôi để lại"], "a": 0, "e": "ambil = lấy."}, {"id": "u04-x09", "t": "mcq", "q": "\"Ini saja\" nghĩa là", "opts": ["Chỉ vậy thôi", "Còn nữa", "Đây là tiền", "Tôi không biết"], "a": 0, "e": "Dùng để nói không mua thêm."}, {"id": "u04-x10", "t": "mcq", "q": "Ngày xưa chợ truyền thống", "opts": ["lộn xộn và bẩn", "rất sạch", "rất mới", "rất đắt"], "a": 0, "e": "tidak tertata rapi dan kotor."}, {"id": "u04-x11", "t": "mcq", "q": "Hiện nay nhiều chợ truyền thống", "opts": ["xây kiên cố", "xây tạm", "bị đóng", "chuyển ra ngoại ô"], "a": 0, "e": "sudah banyak yang permanen."}, {"id": "u04-x12", "t": "mcq", "q": "Quy định trong chợ truyền thống là", "opts": ["đừng vứt rác bừa bãi", "không được mặc cả", "không bán đồ ăn", "đóng cửa sớm"], "a": 0, "e": "jangan buang sampah sembarangan."}, {"id": "u04-x13", "t": "mcq", "q": "Mục đích của quy định đó là", "opts": ["để người mua thấy thoải mái", "để thu thuế", "để giảm giá", "để đóng cửa sớm"], "a": 0, "e": "agar pembeli merasa nyaman."}, {"id": "u04-x14", "t": "fill", "q": "___ lihat-lihat dahulu. (mời, rủ)", "a": ["Mari"], "e": "Mari = mời, rủ."}, {"id": "u04-x15", "t": "fill", "q": "Jangan ___ sampah sembarangan. (vứt)", "a": ["buang"], "e": "buang sampah = vứt rác."}, {"id": "u04-x16", "t": "mcq", "q": "\"Tidak lagi\" nghĩa là", "opts": ["không còn nữa", "vẫn còn", "chưa bao giờ", "sắp có"], "a": 0, "e": "lagi = nữa."}, {"id": "u04-x17", "t": "mcq", "q": "Vì sao nhiều người thích mua sắm trực tuyến?", "opts": ["Họ thấy dễ hơn", "Giá rẻ hơn", "Có nhiều quà", "Ít hàng giả"], "a": 0, "e": "lebih mudah."}, {"id": "u04-x18", "t": "mcq", "q": "Với mua sắm trực tuyến, người mua chỉ cần", "opts": ["chờ hàng được giao", "đến chợ", "đến cửa hàng", "gọi điện"], "a": 0, "e": "menunggu barang datang melalui jasa kurir."}], "culture": {"title": "Belanja melalui aplikasi daring", "vi": "Ngày nay nhiều người Indonesia thích **mua sắm qua ứng dụng trực tuyến (daring)** vì thấy dễ hơn: không cần đến cửa hàng hay chợ, chỉ cần chờ **jasa kurir** giao hàng tới nhà."}}, {"id": "u05", "num": 5, "title": "Makanan Kesukaan", "vi_title": "Món ăn yêu thích", "goals": ["Hiểu đoạn nghe về gọi món qua ứng dụng trực tuyến", "Nói về món ăn yêu thích và món đặc trưng của quê hương", "Hiểu văn bản quy trình về cách nấu cơm chiên đơn giản", "Viết văn bản quy trình (công thức) về món ăn yêu thích"], "vocab": [{"id": "u05-v01", "idn": "makanan", "vi": "thức ăn"}, {"id": "u05-v02", "idn": "makanan khas", "vi": "món đặc trưng"}, {"id": "u05-v03", "idn": "makanan kesukaan", "vi": "món ăn yêu thích"}, {"id": "u05-v04", "idn": "rendang", "vi": "món rendang"}, {"id": "u05-v05", "idn": "nasi goreng", "vi": "cơm chiên"}, {"id": "u05-v06", "idn": "mi goreng", "vi": "mì xào"}, {"id": "u05-v07", "idn": "sate ayam", "vi": "xiên gà nướng (sate)"}, {"id": "u05-v08", "idn": "gado-gado", "vi": "gado-gado (rau trộn sốt đậu phộng)"}, {"id": "u05-v09", "idn": "jus", "vi": "nước ép"}, {"id": "u05-v10", "idn": "jus jeruk", "vi": "nước cam ép"}, {"id": "u05-v11", "idn": "jus mangga", "vi": "sinh tố/nước ép xoài"}, {"id": "u05-v12", "idn": "jus apel", "vi": "nước táo ép"}, {"id": "u05-v13", "idn": "minuman", "vi": "đồ uống"}, {"id": "u05-v14", "idn": "minuman ringan", "vi": "nước giải khát"}, {"id": "u05-v15", "idn": "memesan", "vi": "gọi, đặt (món)"}, {"id": "u05-v16", "idn": "pesan", "vi": "gọi, đặt"}, {"id": "u05-v17", "idn": "aplikasi daring", "vi": "ứng dụng trực tuyến"}, {"id": "u05-v18", "idn": "sekarang", "vi": "bây giờ"}, {"id": "u05-v19", "idn": "sip", "vi": "được rồi, tuyệt"}, {"id": "u05-v20", "idn": "baiklah", "vi": "được thôi"}, {"id": "u05-v21", "idn": "resep", "vi": "công thức nấu ăn"}, {"id": "u05-v22", "idn": "bahan", "vi": "nguyên liệu"}, {"id": "u05-v23", "idn": "cara membuat", "vi": "cách làm"}, {"id": "u05-v24", "idn": "sosis", "vi": "xúc xích"}, {"id": "u05-v25", "idn": "sosis ayam", "vi": "xúc xích gà"}, {"id": "u05-v26", "idn": "bawang putih", "vi": "tỏi"}, {"id": "u05-v27", "idn": "bawang merah", "vi": "hành tím"}, {"id": "u05-v28", "idn": "bawang merah goreng", "vi": "hành phi"}, {"id": "u05-v29", "idn": "siung", "vi": "tép (tỏi)"}, {"id": "u05-v30", "idn": "iris", "vi": "thái lát"}, {"id": "u05-v31", "idn": "garam", "vi": "muối"}, {"id": "u05-v32", "idn": "nasi", "vi": "cơm"}, {"id": "u05-v33", "idn": "gram", "vi": "gam"}, {"id": "u05-v34", "idn": "penyedap rasa", "vi": "bột ngọt, gia vị nêm"}, {"id": "u05-v35", "idn": "kecap ikan", "vi": "nước mắm"}, {"id": "u05-v36", "idn": "merica", "vi": "tiêu"}, {"id": "u05-v37", "idn": "telur ayam", "vi": "trứng gà"}, {"id": "u05-v38", "idn": "butir", "vi": "quả, hạt (đếm trứng)"}, {"id": "u05-v39", "idn": "daun bawang", "vi": "hành lá"}, {"id": "u05-v40", "idn": "batang", "vi": "cây, thân (đếm hành lá)"}, {"id": "u05-v41", "idn": "daging ayam", "vi": "thịt gà"}, {"id": "u05-v42", "idn": "cincang", "vi": "băm nhỏ"}, {"id": "u05-v43", "idn": "dicincang halus", "vi": "được băm nhuyễn"}, {"id": "u05-v44", "idn": "tumis", "vi": "xào"}, {"id": "u05-v45", "idn": "harum", "vi": "thơm"}, {"id": "u05-v46", "idn": "tambahkan", "vi": "hãy thêm vào"}, {"id": "u05-v47", "idn": "orak-arik", "vi": "đánh trứng khuấy chín"}, {"id": "u05-v48", "idn": "masukkan", "vi": "cho vào"}, {"id": "u05-v49", "idn": "aduk", "vi": "khuấy, trộn"}, {"id": "u05-v50", "idn": "rata", "vi": "đều"}, {"id": "u05-v51", "idn": "aduk rata", "vi": "trộn đều"}, {"id": "u05-v52", "idn": "secara bersamaan", "vi": "cùng lúc"}, {"id": "u05-v53", "idn": "aroma", "vi": "mùi hương"}, {"id": "u05-v54", "idn": "sedap", "vi": "ngon, thơm"}, {"id": "u05-v55", "idn": "tercium", "vi": "ngửi thấy"}, {"id": "u05-v56", "idn": "pindahkan", "vi": "chuyển"}, {"id": "u05-v57", "idn": "piring", "vi": "đĩa"}, {"id": "u05-v58", "idn": "menaburkan", "vi": "rắc"}, {"id": "u05-v59", "idn": "tambahan", "vi": "phần thêm"}, {"id": "u05-v60", "idn": "sederhana", "vi": "đơn giản"}, {"id": "u05-v61", "idn": "berdasarkan", "vi": "dựa trên"}, {"id": "u05-v62", "idn": "bersamaan", "vi": "đồng thời"}, {"id": "u05-v63", "idn": "dibutuhkan", "vi": "cần đến"}, {"id": "u05-v64", "idn": "cnn", "vi": "CNN"}, {"id": "u05-v65", "idn": "peringkat", "vi": "thứ hạng"}, {"id": "u05-v66", "idn": "menduduki peringkat", "vi": "giữ vị trí"}, {"id": "u05-v67", "idn": "terenak", "vi": "ngon nhất"}, {"id": "u05-v68", "idn": "media sosial", "vi": "mạng xã hội"}, {"id": "u05-v69", "idn": "Sumatera Barat", "vi": "Tây Sumatra"}, {"id": "u05-v70", "idn": "sate", "vi": "xiên thịt nướng", "note": "bổ sung", "extra": true}, {"id": "u05-v71", "idn": "soto", "vi": "món súp soto", "note": "bổ sung", "extra": true}, {"id": "u05-v72", "idn": "bakso", "vi": "bò viên", "note": "bổ sung", "extra": true}, {"id": "u05-v73", "idn": "pedas", "vi": "cay", "note": "bổ sung", "extra": true}, {"id": "u05-v74", "idn": "manis", "vi": "ngọt", "note": "bổ sung", "extra": true}, {"id": "u05-v75", "idn": "asin", "vi": "mặn", "note": "bổ sung", "extra": true}], "dialogs": [{"title": "Audio 5 — Gọi món qua ứng dụng", "kind": "dialog", "lines": [{"who": "Ela", "idn": "Ari, saya mau pesan makanan melalui aplikasi daring. Kamu mau pesan apa?", "vi": "Ari, mình muốn gọi đồ ăn qua ứng dụng trực tuyến. Bạn muốn gọi gì?"}, {"who": "Ari", "idn": "Hem, saya pesan mi goreng saja.", "vi": "Ừm, mình gọi mì xào thôi."}, {"who": "Ela", "idn": "Minumannya?", "vi": "Đồ uống thì sao?"}, {"who": "Ari", "idn": "Jus jeruk saja, Ela.", "vi": "Nước cam ép thôi, Ela."}, {"who": "Ela", "idn": "Baiklah. Saya pesan, hem..., sate ayam saja. Minumannya, ... jus mangga. Pesan sekarang, ya?", "vi": "Được rồi. Mình gọi, ừm..., sate gà thôi. Đồ uống thì... nước ép xoài. Gọi ngay bây giờ nhé?"}, {"who": "Ari", "idn": "Sip.", "vi": "Được."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/735BIPA_2_UMUM_UNIT_5_AUDIO_5.mp3"}, {"title": "Kegiatan 2 và 3 — Món ăn yêu thích", "kind": "dialog", "lines": [{"who": "A", "idn": "Apa makanan kesukaanmu?", "vi": "Món ăn yêu thích của bạn là gì?"}, {"who": "B", "idn": "Kalau saya suka nasi goreng.", "vi": "Mình thì thích cơm chiên."}, {"who": "A", "idn": "Apa makanan khas dari negara Anda?", "vi": "Món đặc trưng của đất nước bạn là gì?"}, {"who": "B", "idn": "Makanan khas negara saya adalah gado-gado.", "vi": "Món đặc trưng của nước mình là gado-gado."}]}, {"title": "Teks 5 — Cách làm cơm chiên đơn giản", "kind": "text", "lines": [{"idn": "Cara Membuat Nasi Goreng Sederhana", "vi": "Cách làm cơm chiên đơn giản"}, {"idn": "Bahan:", "vi": "Nguyên liệu:"}, {"idn": "1. sosis ayam satu buah, 2. bawang putih 3 siung, iris halus, 3. garam, 4. nasi 600 gram, 5. penyedap rasa", "vi": "1. một cây xúc xích gà, 2. 3 tép tỏi, thái nhỏ, 3. muối, 4. 600 gam cơm, 5. bột nêm"}, {"idn": "6. kecap ikan, 7. merica, 8. telur ayam 1 butir, 9. daun bawang 1 batang, iris halus, 10. daging ayam 125 gram, cincang halus", "vi": "6. nước mắm, 7. tiêu, 8. 1 quả trứng gà, 9. 1 cây hành lá, thái nhỏ, 10. 125 gam thịt gà băm nhuyễn"}, {"idn": "Cara membuat:", "vi": "Cách làm:"}, {"idn": "1. Tumis bawang putih hingga harum. Tambahkan telur lalu orak-arik.", "vi": "1. Xào tỏi đến khi thơm. Thêm trứng rồi đánh khuấy cho chín."}, {"idn": "2. Tambahkan ayam yang telah dicincang halus.", "vi": "2. Thêm thịt gà đã băm nhuyễn."}, {"idn": "3. Tambahkan sosis.", "vi": "3. Thêm xúc xích."}, {"idn": "4. Masukkan daun bawang, kemudian tumis lagi.", "vi": "4. Cho hành lá vào, rồi xào tiếp."}, {"idn": "5. Masukkan nasi, kemudian aduk hingga rata.", "vi": "5. Cho cơm vào, rồi trộn cho đến khi đều."}, {"idn": "6. Tambahkan kecap ikan, garam, merica, dan penyedap rasa secara bersamaan. Aduk rata hingga aroma sedap atau harum tercium.", "vi": "6. Thêm nước mắm, muối, tiêu và bột nêm cùng lúc. Trộn đều đến khi ngửi thấy mùi thơm ngon."}, {"idn": "7. Pindahkan nasi goreng pada piring. Anda bisa menaburkan bawang merah goreng sebagai tambahan.", "vi": "7. Chuyển cơm chiên ra đĩa. Bạn có thể rắc thêm hành phi."}, {"idn": "Berdasarkan resep di atas, silakan membuat nasi goreng sederhana.", "vi": "Dựa vào công thức trên, mời bạn làm cơm chiên đơn giản."}]}, {"title": "Wawasan — Rendang và nasi goreng", "kind": "text", "lines": [{"idn": "Cable News Network (CNN) telah merilis daftar lima puluh makanan terenak sedunia lewat 35.000 pilihan makanan di media sosial Facebook.", "vi": "CNN đã công bố danh sách năm mươi món ăn ngon nhất thế giới qua 35.000 lượt chọn món trên mạng xã hội Facebook."}, {"idn": "Hasilnya, rendang khas Sumatera Barat kembali menduduki peringkat pertama.", "vi": "Kết quả, món rendang đặc trưng của Tây Sumatra lại giữ vị trí thứ nhất."}, {"idn": "Menariknya, CNN melansir bukan hanya rendang, tetapi juga nasi goreng menempati peringkat kedua.", "vi": "Điều thú vị là CNN cho biết không chỉ rendang mà cơm chiên cũng đứng thứ hai."}]}], "grammar": [{"title": "ber-...-kan: dựa trên, bắt nguồn từ", "body": "Khung **ber-...-kan** có nghĩa *bersumber pada* (dựa trên). Ví dụ khác: *berlandaskan*, *beralaskan*.", "examples": [{"idn": "Berdasarkan resep di atas, silakan membuat nasi goreng.", "vi": "Dựa vào công thức trên, mời bạn làm cơm chiên."}, {"idn": "Tulisan ini berlandaskan pengalaman saya.", "vi": "Bài viết này dựa trên kinh nghiệm của tôi."}]}, {"title": "ber-...-an: đồng thời, cùng lúc", "body": "Khung **ber-...-an** có nghĩa *sejalan dengan* (đi cùng, đồng thời). Ví dụ khác: *bertepatan*, *berbarengan*.", "examples": [{"idn": "Tambahkan semua bumbu secara bersamaan.", "vi": "Thêm tất cả gia vị cùng lúc."}, {"idn": "Anda bisa membuat minuman ringan secara bersamaan.", "vi": "Bạn có thể làm nước giải khát cùng lúc."}]}, {"title": "Câu mệnh lệnh trong công thức", "body": "Văn bản quy trình dùng **động từ mệnh lệnh** (*tumis, tambahkan, masukkan, aduk, pindahkan*) và từ chỉ thứ tự (*kemudian, lalu, setelah itu*). Phần Bahan dùng **con số** (600 gram, 3 siung, 1 butir).", "examples": [{"idn": "Masukkan nasi, kemudian aduk hingga rata.", "vi": "Cho cơm vào, rồi trộn cho đều."}, {"idn": "Tumis bawang putih hingga harum.", "vi": "Xào tỏi đến khi thơm."}]}, {"title": "Hỏi số lượng: berapa banyak / berapa", "body": "Dùng **Berapa banyak ... yang dibutuhkan?** để hỏi số lượng nguyên liệu. Trả lời: **... yang dibutuhkan adalah + số lượng.**", "examples": [{"idn": "Berapa banyak sosis yang dibutuhkan?", "vi": "Cần bao nhiêu xúc xích?"}, {"idn": "Sosis yang dibutuhkan adalah satu buah.", "vi": "Xúc xích cần là một cây."}]}, {"title": "Hỏi và nói món ăn yêu thích", "body": "Hỏi: **Apa makanan kesukaanmu?** Trả lời: **Saya suka + món.** Món đặc trưng: **Makanan khas negara saya adalah ...**", "examples": [{"idn": "Apa makanan kesukaanmu?", "vi": "Món ăn yêu thích của bạn là gì?"}, {"idn": "Kalau saya suka nasi goreng.", "vi": "Mình thì thích cơm chiên."}]}], "exercises": [{"id": "u05-x01", "t": "mcq", "q": "\"makanan khas\" nghĩa là", "opts": ["món đặc trưng", "món tráng miệng", "món chay", "món ăn nhanh"], "a": 0, "e": "khas = đặc trưng."}, {"id": "u05-x02", "t": "mcq", "q": "\"resep\" nghĩa là", "opts": ["công thức nấu ăn", "thực đơn", "nhà hàng", "đồ uống"], "a": 0, "e": "resep = công thức."}, {"id": "u05-x03", "t": "mcq", "q": "Trong Audio 5, họ gọi món qua", "opts": ["ứng dụng trực tuyến", "điện thoại bàn", "trực tiếp ở quán", "thư"], "a": 0, "e": "melalui aplikasi daring."}, {"id": "u05-x04", "t": "mcq", "q": "Ari gọi món gì?", "opts": ["Mì xào", "Xiên gà nướng", "Cơm chiên", "Rendang"], "a": 0, "e": "Saya pesan mi goreng saja."}, {"id": "u05-x05", "t": "mcq", "q": "Ari gọi đồ uống gì?", "opts": ["Nước cam ép", "Nước xoài", "Nước táo", "Trà nóng"], "a": 0, "e": "Jus jeruk saja."}, {"id": "u05-x06", "t": "mcq", "q": "Ela gọi món gì?", "opts": ["Xiên gà nướng", "Mì xào", "Cơm chiên", "Gado-gado"], "a": 0, "e": "sate ayam saja."}, {"id": "u05-x07", "t": "mcq", "q": "Ela gọi đồ uống gì?", "opts": ["Nước xoài ép", "Nước cam ép", "Nước táo ép", "Cà phê"], "a": 0, "e": "jus mangga."}, {"id": "u05-x08", "t": "mcq", "q": "\"bawang putih\" là", "opts": ["tỏi", "hành tím", "hành lá", "gừng"], "a": 0, "e": "putih = trắng, bawang putih = tỏi."}, {"id": "u05-x09", "t": "mcq", "q": "\"kecap ikan\" là", "opts": ["nước mắm", "xì dầu", "tương ớt", "dầu ăn"], "a": 0, "e": "kecap ikan = nước mắm."}, {"id": "u05-x10", "t": "mcq", "q": "\"telur ayam\" là", "opts": ["trứng gà", "thịt gà", "gà con", "cơm gà"], "a": 0, "e": "telur = trứng."}, {"id": "u05-x11", "t": "mcq", "q": "Cần bao nhiêu gam cơm (nasi)?", "opts": ["600 gam", "125 gam", "300 gam", "1 kg"], "a": 0, "e": "nasi 600 gram."}, {"id": "u05-x12", "t": "mcq", "q": "Cần bao nhiêu quả trứng gà?", "opts": ["1 quả", "2 quả", "3 quả", "6 quả"], "a": 0, "e": "telur ayam 1 butir."}, {"id": "u05-x13", "t": "mcq", "q": "Bước đầu tiên khi nấu cơm chiên là", "opts": ["xào tỏi đến khi thơm", "cho cơm", "thêm xúc xích", "rắc hành phi"], "a": 0, "e": "Tumis bawang putih hingga harum."}, {"id": "u05-x14", "t": "mcq", "q": "Thứ được băm nhuyễn là", "opts": ["thịt gà", "xúc xích", "cơm", "hành lá"], "a": 0, "e": "daging ayam ... cincang halus."}, {"id": "u05-x15", "t": "mcq", "q": "Có thể rắc thêm để trang trí", "opts": ["hành phi", "muối", "tiêu", "đường"], "a": 0, "e": "menaburkan bawang merah goreng."}, {"id": "u05-x16", "t": "mcq", "q": "\"dicincang halus\" nghĩa là", "opts": ["được băm nhuyễn", "được luộc", "được chiên", "được nướng"], "a": 0, "e": "cincang = băm."}, {"id": "u05-x17", "t": "fill", "q": "Berdasarkan resep di atas, silakan ___ nasi goreng. (làm)", "a": ["membuat"], "e": "membuat = làm."}, {"id": "u05-x18", "t": "fill", "q": "Masukkan nasi, kemudian ___ hingga rata. (khuấy, trộn)", "a": ["aduk"], "e": "aduk rata = trộn đều."}, {"id": "u05-x19", "t": "mcq", "q": "\"secara bersamaan\" nghĩa là", "opts": ["cùng lúc", "lần lượt", "một mình", "sau cùng"], "a": 0, "e": "bersamaan = đồng thời."}, {"id": "u05-x20", "t": "mcq", "q": "Theo CNN, món xếp thứ nhất là", "opts": ["rendang", "nasi goreng", "sate", "gado-gado"], "a": 0, "e": "rendang menduduki peringkat pertama."}, {"id": "u05-x21", "t": "mcq", "q": "Theo CNN, nasi goreng xếp thứ", "opts": ["hai", "nhất", "ba", "mười"], "a": 0, "e": "peringkat kedua."}], "culture": {"title": "Rendang và nasi goreng trong danh sách món ngon nhất thế giới", "vi": "CNN từng công bố danh sách **50 món ăn ngon nhất thế giới** dựa trên khoảng 35.000 lượt bình chọn trên Facebook. **Rendang** (món đặc trưng của Tây Sumatra, Sumatera Barat) giữ vị trí số 1, còn **nasi goreng** (cơm chiên) đứng thứ 2."}}, {"id": "u06", "num": 6, "title": "Lingkungan Rumahku", "vi_title": "Khu vực quanh nhà tôi", "goals": ["Chỉ ra vị trí theo chỉ dẫn nghe được", "Mời và từ chối lời mời bằng lời nói", "Vẽ sơ đồ đơn giản dựa trên thông tin đọc được", "Viết lời mời đơn giản"], "vocab": [{"id": "u06-v01", "idn": "lingkungan", "vi": "khu vực xung quanh, môi trường"}, {"id": "u06-v02", "idn": "rumah", "vi": "nhà"}, {"id": "u06-v03", "idn": "tinggal", "vi": "sống, ở"}, {"id": "u06-v04", "idn": "jalan", "vi": "đường"}, {"id": "u06-v05", "idn": "Jalan Supratman", "vi": "đường Supratman"}, {"id": "u06-v06", "idn": "masjid", "vi": "nhà thờ Hồi giáo"}, {"id": "u06-v07", "idn": "taman kanak-kanak", "vi": "trường mẫu giáo"}, {"id": "u06-v08", "idn": "kantor pos", "vi": "bưu điện"}, {"id": "u06-v09", "idn": "toko kelontong", "vi": "tiệm tạp hóa"}, {"id": "u06-v10", "idn": "tetangga", "vi": "hàng xóm"}, {"id": "u06-v11", "idn": "warung", "vi": "quán nhỏ, tiệm nhỏ"}, {"id": "u06-v12", "idn": "halaman", "vi": "sân, khoảng sân"}, {"id": "u06-v13", "idn": "pohon", "vi": "cây"}, {"id": "u06-v14", "idn": "pohon mangga", "vi": "cây xoài"}, {"id": "u06-v15", "idn": "taman", "vi": "công viên, vườn hoa"}, {"id": "u06-v16", "idn": "taman bermain", "vi": "khu vui chơi"}, {"id": "u06-v17", "idn": "rumah dua lantai", "vi": "nhà hai tầng"}, {"id": "u06-v18", "idn": "lantai", "vi": "tầng, sàn"}, {"id": "u06-v19", "idn": "b "idn": "syukuran", "vi": "tiệc tạ ơn, tiệc mừng"}, {"id": "u06-v54", "idn": "ulang tahun", "vi": "sinh nhật"}, {"id": "u06-v55", "idn": "makan bersama", "vi": "ăn cùng nhau"}, {"id": "u06-v56", "idn": "makan malam", "vi": "bữa tối"}, {"id": "u06-v57", "idn": "pentas seni", "vi": "buổi biểu diễn nghệ thuật"}, {"id": "u06-v58", "idn": "basket", "vi": "bóng rổ"}, {"id": "u06-v59", "idn": "main basket", "vi": "chơi bóng rổ"}, {"id": "u06-v60", "idn": "minggu depan", "vi": "tuần tới"}, {"id": "u06-v61", "idn": "besok", "vi": "ngày mai"}, {"id": "u06-v62", "idn": "lapangan", "vi": "sân"}, {"id": "u06-v63", "idn": "gedung rektorat", "vi": "tòa nhà hiệu bộ"}, {"id": "u06-v64", "idn": "kantin", "vi": "căng tin"}, {"id": "u06-v65", "idn": "universitas", "vi": "đại học"}, {"id": "u06-v66", "idn": "seorang", "vi": "một (người)"}, {"id": "u06-v67", "idn": "sebuah", "vi": "một (vật)"}, {"id": "u06-v68", "idn": "seekor", "vi": "một (con vật)"}, {"id": "u06-v69", "idn": "penggolong", "vi": "từ loại đếm"}, {"id": "u06-v70", "idn": "kebun", "vi": "vườn"}, {"id": "u06-v71", "idn": "kebun cabai", "vi": "vườn ớt"}, {"id": "u06-v72", "idn": "pangkas rambut", "vi": "cắt tóc"}, {"id": "u06-v73", "idn": "tempat pangkas rambut", "vi": "tiệm cắt tóc"}, {"id": "u06-v74", "idn": "supermarket", "vi": "siêu thị"}, {"id": "u06-v75", "idn": "minyak tanah", "vi": "dầu hỏa"}, {"id": "u06-v76", "idn": "gas", "vi": "gas"}, {"id": "u06-v77", "idn": "sekolah", "vi": "trường học"}, {"id": "u06-v78", "idn": "gotong royong", "vi": "tương trợ, cùng nhau làm việc chung"}, {"id": "u06-v79", "idn": "bekerja bersama-sama", "vi": "làm việc cùng nhau"}, {"id": "u06-v80", "idn": "tolong-menolong", "vi": "giúp đỡ nhau"}, {"id": "u06-v81", "idn": "bantu-membantu", "vi": "giúp đỡ lẫn nhau"}, {"id": "u06-v82", "idn": "akhir minggu", "vi": "cuối tuần"}, {"id": "u06-v83", "idn": "fasilitas umum", "vi": "cơ sở vật chất công cộng"}, {"id": "u06-v84", "idn": "membersihkan", "vi": "dọn dẹp"}, {"id": "u06-v85", "idn": "membangun", "vi": "xây dựng"}, {"id": "u06-v86", "idn": "kamar tidur", "vi": "phòng ngủ", "note": "bổ sung", "extra": true}, {"id": "u06-v87", "idn": "dapur", "vi": "bếp", "note": "bổ sung", "extra": true}, {"id": "u06-v88", "idn": "kamar mandi", "vi": "phòng tắm", "note": "bổ sung", "extra": true}, {"id": "u06-v89", "idn": "ruang tamu", "vi": "phòng khách", "note": "bổ sung", "extra": true}], "dialogs": [{"title": "Audio 6 — Nhà của Budi", "kind": "text", "lines": [{"idn": "Nama saya Budi. Saya tinggal di Jalan Supratman.", "vi": "Tôi tên là Budi. Tôi sống ở đường Supratman."}, {"idn": "Di seberang rumah saya ada masjid.", "vi": "Đối diện nhà tôi có một nhà thờ Hồi giáo."}, {"idn": "Di sebelah kiri masjid ada taman kanak-kanak.", "vi": "Bên trái nhà thờ có một trường mẫu giáo."}, {"idn": "Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Salim.", "vi": "Bên phải nhà tôi là nhà hàng xóm của tôi, ông Salim."}, {"idn": "Di sebelah kiri rumah saya ada kantor pos.", "vi": "Bên trái nhà tôi có bưu điện."}, {"idn": "Di belakang rumah saya ada toko kelontong.", "vi": "Phía sau nhà tôi có tiệm tạp hóa."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/230BIPA_2_UMUM_UNIT_6_AUDIO_6.mp3"}, {"title": "Dialog 6.1 — Mời đi tiệc nhà mới", "kind": "dialog", "lines": [{"who": "Pras", "idn": "Halo, Dinda. Apakah kamu ada acara besok?", "vi": "Chào Dinda. Ngày mai bạn có việc gì không?"}, {"who": "Dinda", "idn": "Hem, tidak ada. Ada apa?", "vi": "Ừm, không có. Có chuyện gì vậy?"}, {"who": "Pras", "idn": "Aku ingin mengundang teman-teman makan bersama. Aku baru pindah rumah.", "vi": "Mình muốn mời các bạn cùng ăn. Mình mới chuyển nhà."}, {"who": "Dinda", "idn": "Wah, selamat, ya. Di mana rumah barumu?", "vi": "Ồ, chúc mừng nhé. Nhà mới của bạn ở đâu?"}, {"who": "Pras", "idn": "Di Jalan Mawar Nomor 10. Di sebelah kantor pos.", "vi": "Ở đường Mawar số 10. Cạnh bưu điện."}, {"who": "Dinda", "idn": "Oh, di sana. Aku tahu tempatnya. Acaranya pukul berapa?", "vi": "À, ở đó. Mình biết chỗ đó. Buổi tiệc mấy giờ?"}, {"who": "Pras", "idn": "Acaranya mulai pukul 10 pagi.", "vi": "Tiệc bắt đầu lúc 10 giờ sáng."}, {"who": "Dinda", "idn": "Oke, aku pasti datang. Terima kasih, Pras.", "vi": "Được, mình chắc chắn sẽ đến. Cảm ơn Pras."}]}, {"title": "Dialog 6.2 — Mời chơi bóng rổ (từ chối)", "kind": "dialog", "lines": [{"who": "Handi", "idn": "Wulan, aku ingin mengundang kamu main basket minggu depan.", "vi": "Wulan, mình muốn mời bạn chơi bóng rổ tuần tới."}, {"who": "Wulan", "idn": "Main basket? Di mana, Han?", "vi": "Chơi bóng rổ à? Ở đâu, Han?"}, {"who": "Handi", "idn": "Di lapangan universitas kita saja.", "vi": "Ở sân của trường đại học mình thôi."}, {"who": "Wulan", "idn": "Lapangan sebelah gedung rektorat? Di seberang kantin?", "vi": "Sân bên cạnh tòa nhà hiệu bộ à? Đối diện căng tin?"}, {"who": "Handi", "idn": "Iya, di sana.", "vi": "Ừ, ở đó."}, {"who": "Wulan", "idn": "Aduh, maaf sekali. Minggu depan aku sudah ada rencana.", "vi": "Ôi, xin lỗi nhiều. Tuần tới mình đã có kế hoạch rồi."}, {"who": "Handi", "idn": "Oh, begitu. Ya sudah tidak apa-apa.", "vi": "À, vậy à. Thôi được rồi không sao."}, {"who": "Wulan", "idn": "Mudah-mudahan aku bisa ikut lain waktu, ya.", "vi": "Hy vọng mình có thể tham gia dịp khác nhé."}]}, {"title": "Teks 6 — Nhà của Raisa", "kind": "text", "lines": [{"idn": "Nama saya Raisa. Saya tinggal di Jalan Sukasenang.", "vi": "Tôi tên là Raisa. Tôi sống ở đường Sukasenang."}, {"idn": "Rumah saya adalah rumah dua lantai. Rumah saya berwarna putih.", "vi": "Nhà tôi là nhà hai tầng. Nhà tôi màu trắng."}, {"idn": "Di depan rumah saya ada halaman. Di sana ada pohon mangga.", "vi": "Phía trước nhà tôi có sân. Ở đó có cây xoài."}, {"idn": "Di belakang rumah saya ada warung Ibu Yayan.", "vi": "Phía sau nhà tôi có quán của bà Yayan."}, {"idn": "Di sebelah kiri rumah saya ada toko kelontong.", "vi": "Bên trái nhà tôi có tiệm tạp hóa."}, {"idn": "Di samping kanan rumah saya ada rumah seorang tetangga saya, Pak Bandi.", "vi": "Bên phải nhà tôi là nhà một người hàng xóm của tôi, ông Bandi."}, {"idn": "Di seberang rumah saya ada taman bermain.", "vi": "Đối diện nhà tôi có khu vui chơi."}]}, {"title": "Kegiatan 6 — Mô tả để vẽ sơ đồ", "kind": "text", "lines": [{"idn": "Rumah saya ada di Jalan Bambu. Rumah saya ada di belakang Masjid Al-Furqon.", "vi": "Nhà tôi ở đường Bambu. Nhà tôi ở sau nhà thờ Al-Furqon."}, {"idn": "Di sebelah kanan masjid ada kebun cabai.", "vi": "Bên phải nhà thờ có vườn ớt."}, {"idn": "Di sebelah kiri rumah saya ada toko yang menjual gas dan minyak tanah.", "vi": "Bên trái nhà tôi có cửa hàng bán gas và dầu hỏa."}, {"idn": "Di seberang toko gas ada toko air minum.", "vi": "Đối diện cửa hàng gas có cửa hàng nước uống."}, {"idn": "Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Resa.", "vi": "Bên phải nhà tôi là nhà hàng xóm tôi, ông Resa."}, {"idn": "Di seberang rumah Pak Resa ada supermarket.", "vi": "Đối diện nhà ông Resa có siêu thị."}, {"idn": "Di sebelah kiri supermarket ada tempat pangkas rambut.", "vi": "Bên trái siêu thị có tiệm cắt tóc."}, {"idn": "Di seberang rumah saya ada taman bermain anak.", "vi": "Đối diện nhà tôi có khu vui chơi trẻ em."}, {"idn": "Di belakang taman bermain anak ada sekolah, yaitu SDN Ajitunggal.", "vi": "Phía sau khu vui chơi trẻ em có một trường học, đó là trường tiểu học SDN Ajitunggal."}]}, {"title": "Wawasan — Gotong royong", "kind": "text", "lines": [{"idn": "Salah satu budaya masyarakat Indonesia adalah gotong royong.", "vi": "Một trong những nét văn hóa của người Indonesia là gotong royong."}, {"idn": "Gotong royong berarti bekerja bersama-sama, tolong-menolong, dan bantu-membantu.", "vi": "Gotong royong nghĩa là làm việc cùng nhau, giúp đỡ nhau và hỗ trợ lẫn nhau."}, {"idn": "Kegiatan gotong-royong biasanya dilaksanakan pada akhir minggu.", "vi": "Hoạt động gotong royong thường được tổ chức vào cuối tuần."}, {"idn": "Masyarakat biasanya bergotong-royong untuk membersihkan lingkungan dan membangun fasilitas umum.", "vi": "Người dân thường gotong royong để dọn dẹp khu vực xung quanh và xây dựng cơ sở vật chất công cộng."}]}], "grammar": [{"title": "Giới từ chỉ vị trí", "body": "Dùng giới từ để nói vị trí: **di depan** (phía trước), **di belakang** (phía sau), **di sebelah kiri** (bên trái), **di sebelah kanan/di samping kanan** (bên phải), **di seberang** (đối diện), **di sebelah** (cạnh).", "examples": [{"idn": "Di depan rumah saya ada halaman.", "vi": "Phía trước nhà tôi có sân."}, {"idn": "Di seberang rumah saya ada masjid.", "vi": "Đối diện nhà tôi có nhà thờ Hồi giáo."}, {"idn": "Di sebelah kiri rumah saya ada kantor pos.", "vi": "Bên trái nhà tôi có bưu điện."}]}, {"title": "Cách mời", "body": "Mẫu mời: **Aku ingin mengundang kamu + hoạt động.** / **Saya mengundang Anda untuk + hoạt động.** / **Saya mengundang Anda untuk menghadiri + sự kiện.**", "examples": [{"idn": "Aku ingin mengundang teman-teman makan bersama.", "vi": "Mình muốn mời các bạn cùng ăn."}, {"idn": "Saya mengundang Anda untuk makan malam.", "vi": "Tôi mời bạn dùng bữa tối."}, {"idn": "Saya mengundang Anda untuk menghadiri acara pentas seni.", "vi": "Tôi mời bạn tham dự buổi biểu diễn nghệ thuật."}]}, {"title": "Cách nhận lời mời", "body": "Dùng: **Wah, ayo.** / **Baik, saya akan hadir/datang. Terima kasih.** / **Saya pasti hadir. Terima kasih sudah mengundang.** / **Saya senang sekali Anda mengundang saya. Tentu saja saya akan datang.**", "examples": [{"idn": "Baik, saya akan datang. Terima kasih.", "vi": "Vâng, tôi sẽ đến. Cảm ơn."}, {"idn": "Saya pasti hadir. Terima kasih sudah mengundang.", "vi": "Tôi chắc chắn sẽ có mặt. Cảm ơn đã mời."}]}, {"title": "Cách từ chối lời mời", "body": "Dùng: **Aduh, maaf sekali. + lý do.** / **Sayang sekali. Saya sudah ada janji.** / **Maaf sekali, saya tidak bisa. Mudah-mudahan saya bisa datang lain waktu.**", "examples": [{"idn": "Aduh, maaf sekali. Minggu depan aku sudah ada rencana.", "vi": "Ôi, xin lỗi nhiều. Tuần tới mình đã có kế hoạch."}, {"idn": "Maaf sekali, saya tidak bisa hadir karena ada acara lain.", "vi": "Xin lỗi nhiều, tôi không thể tham dự vì có việc khác."}, {"idn": "Mudah-mudahan saya bisa datang lain waktu.", "vi": "Hy vọng tôi có thể đến dịp khác."}]}, {"title": "Từ loại đếm: seorang, sebuah, seekor", "body": "**Seorang** dùng cho người, **sebuah** cho vật, **seekor** cho động vật.", "examples": [{"idn": "Rumah seorang tetangga saya.", "vi": "Nhà của một người hàng xóm của tôi."}, {"idn": "Sebuah rumah dua lantai.", "vi": "Một ngôi nhà hai tầng."}, {"idn": "Seekor kucing.", "vi": "Một con mèo."}]}, {"title": "Cấu trúc văn bản mô tả", "body": "Văn bản mô tả gồm **Pernyataan umum** (giới thiệu, nêu đối tượng: *Nama saya Raisa. Rumah saya berwarna putih.*) và **Deskripsi** (mô tả chi tiết, dùng giới từ vị trí). Phần giới thiệu bản thân không bắt buộc trong mọi văn bản mô tả.", "examples": [{"idn": "Nama saya Raisa. Saya tinggal di Jalan Sukasenang.", "vi": "Tôi tên Raisa. Tôi sống ở đường Sukasenang."}]}], "exercises": [{"id": "u06-x01", "t": "mcq", "q": "\"di seberang\" nghĩa là", "opts": ["đối diện", "phía sau", "bên trái", "bên cạnh"], "a": 0, "e": "seberang = đối diện."}, {"id": "u06-x02", "t": "mcq", "q": "\"di belakang\" nghĩa là", "opts": ["phía sau", "phía trước", "bên phải", "đối diện"], "a": 0, "e": "belakang = sau."}, {"id": "u06-x03", "t": "mcq", "q": "\"tetangga\" nghĩa là", "opts": ["hàng xóm", "họ hàng", "bạn học", "đồng nghiệp"], "a": 0, "e": "tetangga = hàng xóm."}, {"id": "u06-x04", "t": "mcq", "q": "Budi sống ở đường nào?", "opts": ["Supratman", "Sudirman", "Mawar", "Bambu"], "a": 0, "e": "Jalan Supratman."}, {"id": "u06-x05", "t": "mcq", "q": "Đối diện nhà Budi là", "opts": ["nhà thờ Hồi giáo", "bưu điện", "tiệm tạp hóa", "trường mẫu giáo"], "a": 0, "e": "Di seberang rumah saya ada masjid."}, {"id": "u06-x06", "t": "mcq", "q": "Bên trái nhà Budi có", "opts": ["bưu điện", "nhà thờ", "tiệm tạp hóa", "hàng xóm"], "a": 0, "e": "Di sebelah kiri rumah saya ada kantor pos."}, {"id": "u06-x07", "t": "mcq", "q": "Bên phải nhà Budi là nhà của", "opts": ["ông Salim", "ông Bandi", "ông Resa", "bà Yayan"], "a": 0, "e": "rumah tetangga saya, Pak Salim."}, {"id": "u06-x08", "t": "mcq", "q": "Phía sau nhà Budi có", "opts": ["tiệm tạp hóa", "bưu điện", "nhà thờ", "trường học"], "a": 0, "e": "Di belakang rumah saya ada toko kelontong."}, {"id": "u06-x09", "t": "mcq", "q": "Trường mẫu giáo ở đâu?", "opts": ["Bên trái nhà thờ", "Bên phải nhà Budi", "Phía sau bưu điện", "Đối diện nhà ông Salim"], "a": 0, "e": "Di sebelah kiri masjid ada taman kanak-kanak."}, {"id": "u06-x10", "t": "mcq", "q": "Nhà mới của Pras ở đâu?", "opts": ["Đường Mawar số 10, cạnh bưu điện", "Đường Bambu", "Đường Supratman", "Cạnh siêu thị"], "a": 0, "e": "Di Jalan Mawar Nomor 10. Di sebelah kantor pos."}, {"id": "u06-x11", "t": "mcq", "q": "Tiệc nhà mới của Pras bắt đầu lúc", "opts": ["10 giờ sáng", "8 giờ tối", "12 giờ trưa", "3 giờ chiều"], "a": 0, "e": "mulai pukul 10 pagi."}, {"id": "u06-x12", "t": "mcq", "q": "Wulan trả lời lời mời chơi bóng rổ như thế nào?", "opts": ["Từ chối vì có kế hoạch", "Nhận lời ngay", "Hẹn ngày mai", "Không nghe"], "a": 0, "e": "Minggu depan aku sudah ada rencana."}, {"id": "u06-x13", "t": "mcq", "q": "Câu nhận lời mời là", "opts": ["Saya pasti hadir.", "Maaf sekali, saya tidak bisa.", "Sayang sekali.", "Aduh, maaf."], "a": 0, "e": "Saya pasti hadir = nhận lời."}, {"id": "u06-x14", "t": "mcq", "q": "Câu từ chối lời mời là", "opts": ["Maaf sekali, saya tidak bisa.", "Wah, ayo.", "Saya akan datang.", "Dengan senang hati."], "a": 0, "e": "Maaf sekali, saya tidak bisa = từ chối."}, {"id": "u06-x15", "t": "fill", "q": "Saya ___ Anda untuk makan malam. (mời)", "a": ["mengundang"], "e": "mengundang = mời."}, {"id": "u06-x16", "t": "fill", "q": "Aku ingin ___ teman-teman makan bersama. (mời)", "a": ["mengundang"], "e": "ingin mengundang = muốn mời."}, {"id": "u06-x17", "t": "mcq", "q": "Nhà Raisa có màu", "opts": ["trắng", "đỏ", "xanh", "vàng"], "a": 0, "e": "berwarna putih."}, {"id": "u06-x18", "t": "mcq", "q": "Ở sân nhà Raisa có", "opts": ["cây xoài", "cây ổi", "cây chuối", "cây dừa"], "a": 0, "e": "pohon mangga."}, {"id": "u06-x19", "t": "mcq", "q": "Quán phía sau nhà Raisa là của", "opts": ["bà Yayan", "ông Bandi", "ông Salim", "bà Dinda"], "a": 0, "e": "warung Ibu Yayan."}, {"id": "u06-x20", "t": "mcq", "q": "Ông Bandi là", "opts": ["hàng xóm bên phải nhà Raisa", "chủ quán", "thợ cắt tóc", "thầy giáo"], "a": 0, "e": "tetangga saya, Pak Bandi."}, {"id": "u06-x21", "t": "mcq", "q": "Từ đếm dùng cho người là", "opts": ["seorang", "sebuah", "seekor", "sebuah dan seekor"], "a": 0, "e": "seorang = một người."}, {"id": "u06-x22", "t": "fill", "q": "Rumah ini adalah ___ rumah dua lantai. (một ngôi, dùng cho vật)", "a": ["sebuah"], "e": "sebuah dùng cho vật."}, {"id": "u06-x23", "t": "mcq", "q": "Gotong royong nghĩa là", "opts": ["làm việc cùng nhau, giúp đỡ nhau", "làm việc một mình", "đi chơi", "mua sắm"], "a": 0, "e": "bekerja bersama-sama, tolong-menolong."}, {"id": "u06-x24", "t": "mcq", "q": "Gotong royong thường được tổ chức", "opts": ["vào cuối tuần", "vào đầu tuần", "vào buổi tối", "vào giữa tháng"], "a": 0, "e": "biasanya pada akhir minggu."}], "culture": {"title": "Gotong royong", "vi": "**Gotong royong** là nét văn hóa tiêu biểu của người Indonesia: *làm việc cùng nhau, giúp đỡ nhau, hỗ trợ lẫn nhau*. Thường được tổ chức vào **cuối tuần**, người dân cùng dọn dẹp khu phố và xây dựng cơ sở vật chất công cộng."}}, {"id": "u07", "num": 7, "title": "Olahraga Kesukaanku", "vi_title": "Môn thể thao yêu thích của tôi", "goals": ["Xác định các bước thực hiện một việc dựa trên đoạn nghe", "Giao tiếp bằng lời với cấu trúc quy trình và lời cấm về thể thao", "Nhận biết cấu trúc văn bản quy trình trong bài đọc", "Viết văn bản quy trình"], "vocab": [{"id": "u07-v01", "idn": "olahraga", "vi": "thể thao"}, {"id": "u07-v02", "idn": "berolahraga", "vi": "tập thể thao"}, {"id": "u07-v03", "idn": "kesukaan", "vi": "điều yêu thích"}, {"id": "u07-v04", "idn": "pemana i giáo"}, {"id": "u07-v74", "idn": "nanti sore", "vi": "chiều nay"}, {"id": "u07-v75", "idn": "sampai ketemu", "vi": "hẹn gặp lại"}, {"id": "u07-v76", "idn": "yuk", "vi": "nào, đi nào"}, {"id": "u07-v77", "idn": "push-up", "vi": "hít đất"}, {"id": "u07-v78", "idn": "sit-up", "vi": "gập bụng"}, {"id": "u07-v79", "idn": "hari bebas kendaraan bermotor", "vi": "ngày không phương tiện cơ giới"}, {"id": "u07-v80", "idn": "kendaraan bermotor", "vi": "xe cơ giới"}, {"id": "u07-v81", "idn": "melintas", "vi": "đi qua"}, {"id": "u07-v82", "idn": "berdagang", "vi": "buôn bán"}, {"id": "u07-v83", "idn": "mengobrol", "vi": "trò chuyện"}, {"id": "u07-v84", "idn": "berjalan-jalan", "vi": "đi dạo"}, {"id": "u07-v85", "idn": "bersepeda", "vi": "đạp xe"}, {"id": "u07-v86", "idn": "santai", "vi": "thư thả"}, {"id": "u07-v87", "idn": "sepak bola", "vi": "bóng đá", "note": "bổ sung", "extra": true}, {"id": "u07-v88", "idn": "renang", "vi": "bơi", "note": "bổ sung", "extra": true}, {"id": "u07-v89", "idn": "lari", "vi": "chạy bộ", "note": "bổ sung", "extra": true}, {"id": "u07-v90", "idn": "bulu tangkis", "vi": "cầu lông", "note": "bổ sung", "extra": true}, {"id": "u07-v91", "idn": "senam", "vi": "thể dục nhịp điệu", "note": "bổ sung", "extra": true}], "dialogs": [{"title": "Audio 7 — Cách khởi động", "kind": "text", "lines": [{"idn": "Sebelum berolahraga, kita harus melakukan pemanasan.", "vi": "Trước khi tập thể thao, chúng ta phải khởi động."}, {"idn": "Contoh pemanasan adalah sebagai berikut.", "vi": "Ví dụ về khởi động như sau."}, {"idn": "Langkah pertama, gerakkan kepala ke kanan dan ke kiri.", "vi": "Bước đầu tiên, xoay đầu sang phải và sang trái."}, {"idn": "Setelah itu, regangkan tangan ke atas dan ke bawah.", "vi": "Sau đó, duỗi tay lên trên và xuống dưới."}, {"idn": "Terakhir, angkat kaki secara bergantian.", "vi": "Cuối cùng, nâng chân luân phiên."}, {"idn": "Lakukan tiap gerakan selama delapan detik.", "vi": "Thực hiện mỗi động tác trong tám giây."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/932BIPA_2_UMUM_UNIT_7_AUDIO_7.mp3"}, {"title": "Dialog 7 — Cùng thả lỏng sau tập", "kind": "dialog", "lines": [{"who": "Eki", "idn": "Ayu, kamu sudah selesai berolahraga?", "vi": "Ayu, bạn tập xong chưa?"}, {"who": "Ayu", "idn": "Sudah, aku sekarang sedang pendinginan.", "vi": "Xong rồi, bây giờ mình đang thả lỏng."}, {"who": "Eki", "idn": "Bagaimana kalau kita lakukan bersama?", "vi": "Hay là chúng ta cùng làm nhé?"}, {"who": "Ayu", "idn": "Ayo. Pertama regangkan tangan. Setelah itu, regangkan kaki.", "vi": "Được thôi. Đầu tiên duỗi tay. Sau đó duỗi chân."}, {"who": "Eki", "idn": "Gerakan selanjutnya?", "vi": "Động tác tiếp theo?"}, {"who": "Ayu", "idn": "Tarik nafas dalam-dalam lalu keluarkan.", "vi": "Hít thở thật sâu rồi thở ra."}, {"who": "Eki", "idn": "Wah, segarnya. Terima kasih, Ayu.", "vi": "Ồ, sảng khoái quá. Cảm ơn Ayu."}, {"who": "Ayu", "idn": "Sama-sama, Eki.", "vi": "Không có gì, Eki."}]}, {"title": "Teks 7 — Cách thả lỏng sau tập", "kind": "text", "lines": [{"idn": "Cara Melakukan Pendinginan", "vi": "Cách thả lỏng sau khi tập"}, {"idn": "Olahraga adalah aktivitas yang baik bagi tubuh.", "vi": "Thể thao là hoạt động tốt cho cơ thể."}, {"idn": "Setelah melakukan kegiatan inti Anda harus melakukan pendinginan.", "vi": "Sau khi thực hiện phần chính, bạn phải thả lỏng."}, {"idn": "Ada banyak cara untuk melakukan pendinginan. Berikut adalah salah satu caranya.", "vi": "Có nhiều cách để thả lỏng. Sau đây là một cách."}, {"idn": "Pertama, buka kaki selebar bahu.", "vi": "Thứ nhất, mở chân rộng bằng vai."}, {"idn": "Kedua, pegang pinggang Anda dengan tangan kiri.", "vi": "Thứ hai, dùng tay trái giữ eo."}, {"idn": "Setelah itu gerakkan tangan kanan Anda ke atas dan ke bawah.", "vi": "Sau đó đưa tay phải lên và xuống."}, {"idn": "Lakukan hal yang sama dengan tangan kiri.", "vi": "Làm điều tương tự với tay trái."}, {"idn": "Lalu, condongkan badan Anda ke arah kiri bawah sampai hampir jongkok kemudian regangkan kaki Anda ke kanan.", "vi": "Rồi nghiêng người sang trái xuống thấp gần như ngồi xổm, sau đó duỗi chân sang phải."}, {"idn": "Lakukan hal yang sama dengan kaki kiri Anda.", "vi": "Làm điều tương tự với chân trái."}, {"idn": "Tahan tiap gerakan selama 8 detik.", "vi": "Giữ mỗi động tác trong 8 giây."}, {"idn": "Setelah selesai pendinginan hindari meminum minuman bersoda.", "vi": "Sau khi thả lỏng xong, hãy tránh uống nước có ga."}, {"idn": "Minuman bersoda dapat membuat perut menjadi kembung.", "vi": "Nước có ga có thể làm bụng bị đầy hơi."}]}, {"title": "Kegiatan 6 — Cuộc gọi điện rủ chơi cầu lông", "kind": "dialog", "lines": [{"who": "Putu", "idn": "Halo, ini Putu. Apa bisa bicara dengan Dian?", "vi": "Alô, mình là Putu. Cho mình nói chuyện với Dian được không?"}, {"who": "Dian", "idn": "Hai, Putu. Ini aku. Ada apa menelepon?", "vi": "Chào Putu. Mình đây. Có chuyện gì mà gọi vậy?"}, {"who": "Putu", "idn": "Nanti sore kita main badminton, yuk!", "vi": "Chiều nay mình chơi cầu lông nhé!"}, {"who": "Dian", "idn": "Hem, ayo! Main di mana?", "vi": "Ừm, được! Chơi ở đâu?"}, {"who": "Putu", "idn": "Di lapangan samping masjid saja. Sampai ketemu nanti, ya.", "vi": "Ở sân cạnh nhà thờ Hồi giáo thôi. Hẹn gặp lại lúc đó nhé."}, {"who": "Dian", "idn": "Oke kalau begitu. Sampai ketemu.", "vi": "Được thôi. Hẹn gặp lại."}]}, {"title": "Wawasan — Ngày không phương tiện cơ giới (Car Free Day)", "kind": "text", "lines": [{"idn": "Di Indonesia ada hari bebas kendaraan bermotor (Car Free Day).", "vi": "Ở Indonesia có ngày không phương tiện cơ giới (Car Free Day)."}, {"idn": "Acara itu biasanya dilaksanakan setiap hari Minggu pagi.", "vi": "Sự kiện này thường diễn ra vào sáng Chủ nhật hằng tuần."}, {"idn": "Di beberapa jalan tertentu kendaraan bermotor dilarang melintas.", "vi": "Ở một số tuyến đường nhất định, xe cơ giới bị cấm đi qua."}, {"idn": "Di sana orang-orang ada yang mengobrol, berdagang, berjalan-jalan, atau berolahraga.", "vi": "Ở đó có người trò chuyện, buôn bán, đi dạo hoặc tập thể thao."}, {"idn": "Salah satu kegiatan favorit orang-orang pada acara itu adalah bersepeda.", "vi": "Một trong những hoạt động được yêu thích nhất là đạp xe."}, {"idn": "Mereka dapat bersepeda dengan santai karena tidak ada kendaraan bermotor.", "vi": "Họ có thể đạp xe thư thả vì không có xe cơ giới."}]}], "grammar": [{"title": "Từ chỉ thứ tự các bước", "body": "Dùng **pertama, kedua, ketiga, setelah itu, kemudian, lalu, terakhir** để nói thứ tự các bước trong văn bản quy trình.", "examples": [{"idn": "Pertama, buka kaki selebar bahu.", "vi": "Đầu tiên, mở chân rộng bằng vai."}, {"idn": "Setelah itu, regangkan tangan.", "vi": "Sau đó, duỗi tay."}, {"idn": "Terakhir, angkat kaki secara bergantian.", "vi": "Cuối cùng, nâng chân luân phiên."}]}, {"title": "Câu mệnh lệnh trong quy trình", "body": "Động từ mệnh lệnh thường có hậu tố **-kan**: *gerakkan, regangkan, tolehkan, condongkan*; hoặc là động từ gốc: *buka, pegang, tahan, lakukan*.", "examples": [{"idn": "Gerakkan kepala ke kanan.", "vi": "Hãy xoay đầu sang phải."}, {"idn": "Pegang pinggang Anda dengan tangan kiri.", "vi": "Hãy giữ eo bằng tay trái."}, {"idn": "Tahan tiap gerakan selama 8 detik.", "vi": "Giữ mỗi động tác trong 8 giây."}]}, {"title": "Cách nói cấm", "body": "Có nhiều cách cấm: **hindari + động từ** (hãy tránh), **Jangan + động từ!** (đừng), **dilarang + động từ** (bị cấm), **tidak boleh + động từ** (không được).", "examples": [{"idn": "Hindari meminum minuman bersoda.", "vi": "Hãy tránh uống nước có ga."}, {"idn": "Jangan buang sampah sembarangan!", "vi": "Đừng vứt rác bừa bãi!"}, {"idn": "Siswa dilarang berlari di koridor.", "vi": "Học sinh bị cấm chạy ở hành lang."}, {"idn": "Pengemudi tidak boleh berhenti tiba-tiba.", "vi": "Tài xế không được dừng đột ngột."}]}, {"title": "Cấu trúc cuộc gọi điện thoại", "body": "Khi gọi điện: (1) **chào và tự giới thiệu** (*Halo, ini Putu.*), (2) **nêu mục đích gọi** (*Nanti sore kita main badminton, yuk!*), (3) **kết thúc** (*Sampai ketemu.*).", "examples": [{"idn": "Halo, ini Putu. Apa bisa bicara dengan Dian?", "vi": "Alô, mình là Putu. Cho mình nói chuyện với Dian được không?"}, {"idn": "Sampai ketemu nanti, ya.", "vi": "Hẹn gặp lại lúc đó nhé."}]}, {"title": "Cấu trúc văn bản quy trình", "body": "Văn bản quy trình (prosedur) giải thích **các bước làm một việc**. Có từ chỉ thứ tự và động từ mệnh lệnh, có thể kèm lời cấm và lợi ích.", "examples": [{"idn": "Setelah melakukan kegiatan inti Anda harus melakukan pendinginan.", "vi": "Sau phần chính, bạn phải thả lỏng."}]}], "exercises": [{"id": "u07-x01", "t": "mcq", "q": "\"pemanasan\" nghĩa là", "opts": ["khởi động", "thả lỏng", "nghỉ ngơi", "thi đấu"], "a": 0, "e": "pemanasan = khởi động."}, {"id": "u07-x02", "t": "mcq", "q": "\"pendinginan\" nghĩa là", "opts": ["thả lỏng sau tập", "khởi động", "đi ngủ", "ăn uống"], "a": 0, "e": "pendinginan = thả lỏng sau tập."}, {"id": "u07-x03", "t": "mcq", "q": "Trước khi tập thể thao, ta phải", "opts": ["khởi động", "ăn no", "ngủ", "uống nước có ga"], "a": 0, "e": "harus melakukan pemanasan."}, {"id": "u07-x04", "t": "mcq", "q": "Bước đầu tiên khi khởi động (Audio 7) là", "opts": ["xoay đầu sang phải và trái", "duỗi tay", "nâng chân", "ngồi xổm"], "a": 0, "e": "gerakkan kepala ke kanan dan ke kiri."}, {"id": "u07-x05", "t": "mcq", "q": "Tay được duỗi theo hướng", "opts": ["lên trên và xuống dưới", "sang trái", "ra sau", "ra trước"], "a": 0, "e": "regangkan tangan ke atas dan ke bawah."}, {"id": "u07-x06", "t": "mcq", "q": "Bước ba (cuối) khi khởi động là", "opts": ["nâng chân luân phiên", "xoay đầu", "duỗi tay", "chạy"], "a": 0, "e": "Terakhir, angkat kaki secara bergantian."}, {"id": "u07-x07", "t": "mcq", "q": "Mỗi động tác khởi động kéo dài", "opts": ["tám giây", "hai giây", "mười lăm giây", "một phút"], "a": 0, "e": "selama delapan detik."}, {"id": "u07-x08", "t": "mcq", "q": "\"secara bergantian\" nghĩa là", "opts": ["luân phiên", "cùng lúc", "một lần", "nhanh"], "a": 0, "e": "bergantian = lần lượt."}, {"id": "u07-x09", "t": "mcq", "q": "Eki hỏi Ayu điều gì?", "opts": ["Đã tập xong chưa", "Mấy giờ", "Ở đâu", "Ai tập cùng"], "a": 0, "e": "kamu sudah selesai berolahraga?"}, {"id": "u07-x10", "t": "mcq", "q": "Trong Dialog 7, Ayu đang", "opts": ["thả lỏng", "khởi động", "nghỉ", "thi đấu"], "a": 0, "e": "sedang pendinginan."}, {"id": "u07-x11", "t": "mcq", "q": "Hít thở thật sâu rồi", "opts": ["thở ra", "nín thở", "ngồi xuống", "chạy"], "a": 0, "e": "Tarik nafas dalam-dalam lalu keluarkan."}, {"id": "u07-x12", "t": "mcq", "q": "Theo Teks 7, sau thả lỏng nên tránh", "opts": ["nước có ga", "nước lọc", "trái cây", "nghỉ ngơi"], "a": 0, "e": "hindari meminum minuman bersoda."}, {"id": "u07-x13", "t": "mcq", "q": "Nước có ga có thể làm", "opts": ["bụng đầy hơi", "đau đầu", "chóng mặt", "buồn ngủ"], "a": 0, "e": "membuat perut menjadi kembung."}, {"id": "u07-x14", "t": "mcq", "q": "Bước thứ nhất trong Teks 7 là", "opts": ["mở chân rộng bằng vai", "giữ eo", "nghiêng người", "giữ 8 giây"], "a": 0, "e": "Pertama, buka kaki selebar bahu."}, {"id": "u07-x15", "t": "mcq", "q": "Mỗi động tác trong Teks 7 được giữ", "opts": ["8 giây", "3 giây", "10 giây", "20 giây"], "a": 0, "e": "Tahan tiap gerakan selama 8 detik."}, {"id": "u07-x16", "t": "mcq", "q": "\"kembung\" nghĩa là", "opts": ["đầy hơi", "đau", "mệt", "khát"], "a": 0, "e": "perut kembung = bụng đầy hơi."}, {"id": "u07-x17", "t": "fill", "q": "Pertama, ___ kaki selebar bahu. (mở)", "a": ["buka"], "e": "buka = mở."}, {"id": "u07-x18", "t": "fill", "q": "Siswa ___ berlari di koridor. (bị cấm)", "a": ["dilarang"], "e": "dilarang = bị cấm."}, {"id": "u07-x19", "t": "mcq", "q": "Câu nào là lời cấm?", "opts": ["Jangan buang sampah sembarangan!", "Pertama, buka kaki", "Setelah itu regangkan tangan", "Saya suka berolahraga"], "a": 0, "e": "Jangan = đừng."}, {"id": "u07-x20", "t": "mcq", "q": "Putu gọi điện để", "opts": ["rủ chơi cầu lông", "hỏi bài", "mượn sách", "hẹn ăn cơm"], "a": 0, "e": "Nanti sore kita main badminton, yuk!"}, {"id": "u07-x21", "t": "mcq", "q": "Họ chơi cầu lông ở", "opts": ["sân cạnh nhà thờ Hồi giáo", "trường học", "nhà Putu", "công viên"], "a": 0, "e": "lapangan samping masjid."}, {"id": "u07-x22", "t": "mcq", "q": "Ba bước chính khi gọi điện là", "opts": ["chào, nêu mục đích, kết thúc", "chào, hỏi giá, kết thúc", "hỏi, mua, trả", "chỉ chào"], "a": 0, "e": "menyapa, menyampaikan maksud, menutup."}, {"id": "u07-x23", "t": "mcq", "q": "Car Free Day thường diễn ra vào", "opts": ["sáng Chủ nhật", "tối thứ Sáu", "trưa thứ Hai", "đêm thứ Bảy"], "a": 0, "e": "setiap hari Minggu pagi."}, {"id": "u07-x24", "t": "mcq", "q": "Hoạt động được yêu thích ở Car Free Day là", "opts": ["đạp xe", "lái xe", "chạy xe máy", "đá bóng"], "a": 0, "e": "bersepeda."}], "culture": {"title": "Hari Bebas Kendaraan Bermotor (Car Free Day)", "vi": "Ở nhiều thành phố Indonesia có **Car Free Day** (hari bebas kendaraan bermotor), thường vào **sáng Chủ nhật**. Một số tuyến đường cấm xe cơ giới, người dân ra đường trò chuyện, buôn bán, đi dạo, tập thể thao. Hoạt động được ưa thích là **bersepeda** (đạp xe) vì không có xe cơ giới."}}, {"id": "u08", "num": 8, "title": "Naik Transportasi Umum", "vi_title": "Đi phương tiện công cộng", "goals": ["Nhận biết phương tiện công cộng qua đoạn nghe", "Kể về trải nghiệm đi phương tiện công cộng", "Nhận biết cấu trúc văn bản tường thuật (rekon) trong bài đọc", "Viết về trải nghiệm đi phương tiện công cộng"], "vocab": [{"id": "u08-v01", "idn": "transportasi", "vi": "giao thông, vận tải"}, {"id": "u08-v02", "idn": "transportasi umum", "vi": "phương tiện công cộng"}, {"id": "u08-v03", "idn": "sarana transportasi", "vi": "phương tiện giao thông"}, {"id": "u08-v04", "idn": "naik", "vi": "đi (bằng), lên"}, {"id": "u08-v05", "idn": "naik kereta", "vi": "đi tàu hỏa"}, {"id": "u08-v06", "idn": "naik bus", "vi": "đi xe buýt"}, {"id": "u08-v07", "idn": "naik MRT", "vi": "đi tàu điện ngầm MRT"}, {"id": "u08-v08", "idn": "kereta", "vi": "tàu hỏa"}, {"id": "u08-v09", "idn": "kereta api", "vi": "tàu hỏa"}, {"id": "u08 n": "ojek", "vi": "xe ôm"}, {"id": "u08-v46", "idn": "konser", "vi": "buổi hòa nhạc"}, {"id": "u08-v47", "idn": "menonton konser", "vi": "xem hòa nhạc"}, {"id": "u08-v48", "idn": "pawai", "vi": "diễu hành"}, {"id": "u08-v49", "idn": "pertandingan", "vi": "trận đấu"}, {"id": "u08-v50", "idn": "pertandingan tenis", "vi": "trận quần vợt"}, {"id": "u08-v51", "idn": "tenis", "vi": "quần vợt"}, {"id": "u08-v52", "idn": "Istora Senayan", "vi": "Istora Senayan (nhà thi đấu ở Jakarta)"}, {"id": "u08-v53", "idn": "seru", "vi": "hào hứng, vui"}, {"id": "u08-v54", "idn": "semoga", "vi": "mong là"}, {"id": "u08-v55", "idn": "lain kali", "vi": "lần khác"}, {"id": "u08-v56", "idn": "kemarin", "vi": "hôm qua"}, {"id": "u08-v57", "idn": "minggu lalu", "vi": "tuần trước"}, {"id": "u08-v58", "idn": "mencoba", "vi": "thử"}, {"id": "u08-v59", "idn": "menemukan", "vi": "gặp, tìm thấy"}, {"id": "u08-v60", "idn": "temui", "vi": "gặp"}, {"id": "u08-v61", "idn": "pengalaman", "vi": "trải nghiệm"}, {"id": "u08-v62", "idn": "rekon", "vi": "văn bản kể lại sự việc đã xảy ra"}, {"id": "u08-v63", "idn": "orientasi", "vi": "phần mở đầu"}, {"id": "u08-v64", "idn": "kejadian", "vi": "sự việc"}, {"id": "u08-v65", "idn": "kesimpulan", "vi": "kết luận"}, {"id": "u08-v66", "idn": "komentar", "vi": "nhận xét"}, {"id": "u08-v67", "idn": "perasaan", "vi": "cảm xúc"}, {"id": "u08-v68", "idn": "kesan", "vi": "ấn tượng"}, {"id": "u08-v69", "idn": "menyebutkan", "vi": "nói ra, nêu tên"}, {"id": "u08-v70", "idn": "disediakan", "vi": "được chuẩn bị sẵn"}, {"id": "u08-v71", "idn": "becak", "vi": "xe xích lô"}, {"id": "u08-v72", "idn": "roda tiga", "vi": "ba bánh"}, {"id": "u08-v73", "idn": "pengayuh", "vi": "người đạp"}, {"id": "u08-v74", "idn": "tukang becak", "vi": "người đạp xích lô"}, {"id": "u08-v75", "idn": "ongkos", "vi": "cước phí"}, {"id": "u08-v76", "idn": "kesepakatan", "vi": "thỏa thuận"}, {"id": "u08-v77", "idn": "komplek perumahan", "vi": "khu nhà ở"}, {"id": "u08-v78", "idn": "berbeda-beda", "vi": "khác nhau"}, {"id": "u08-v79", "idn": "oleh karena itu", "vi": "vì vậy"}, {"id": "u08-v80", "idn": "bus", "vi": "xe buýt", "note": "bổ sung", "extra": true}, {"id": "u08-v81", "idn": "taksi", "vi": "taxi", "note": "bổ sung", "extra": true}, {"id": "u08-v82", "idn": "pesawat", "vi": "máy bay", "note": "bổ sung", "extra": true}, {"id": "u08-v83", "idn": "kapal", "vi": "tàu thủy", "note": "bổ sung", "extra": true}, {"id": "u08-v84", "idn": "sepeda motor", "vi": "xe máy", "note": "bổ sung", "extra": true}], "dialogs": [{"title": "Audio 8 — Đi xem hòa nhạc bằng tàu", "kind": "dialog", "lines": [{"who": "Putu", "idn": "Hai, Lala.", "vi": "Chào Lala."}, {"who": "Lala", "idn": "Halo, Putu. Apakah kamu menonton konser kemarin?", "vi": "Chào Putu. Hôm qua bạn có đi xem hòa nhạc không?"}, {"who": "Putu", "idn": "Iya, La. Acaranya ramai sekali.", "vi": "Có, La. Chương trình rất đông."}, {"who": "Lala", "idn": "Wah, pasti seru. Kamu pergi naik apa?", "vi": "Ồ, chắc vui lắm. Bạn đi bằng gì?"}, {"who": "Putu", "idn": "Aku naik kereta.", "vi": "Mình đi tàu."}, {"who": "Lala", "idn": "Apakah naik kereta lebih cepat daripada naik bus?", "vi": "Đi tàu có nhanh hơn đi xe buýt không?"}, {"who": "Putu", "idn": "Iya. Dari stasiun kereta aku berjalan kaki ke tempat konsernya.", "vi": "Có. Từ ga tàu mình đi bộ đến nơi tổ chức hòa nhạc."}, {"who": "Lala", "idn": "Hem, semoga lain kali aku bisa ikut menonton.", "vi": "Ừm, mong lần sau mình có thể đi xem cùng."}], "audio": "https://bipa.kemendikdasmen.go.id/filebelajar/168BIPA_2_UMUM_UNIT_8_AUDIO_8.mp3"}, {"title": "Dialog 8.1 — Đi MRT", "kind": "dialog", "lines": [{"who": "Agung", "idn": "Pagi, Ti. Kemarin kamu berjalan-jalan ke Istora Senayan, ya?", "vi": "Chào Ti. Hôm qua bạn đi chơi ở Istora Senayan à?"}, {"who": "Risti", "idn": "Selamat pagi, Gung. Iya, kemarin aku nonton pertandingan tenis di sana.", "vi": "Chào Gung. Ừ, hôm qua mình xem trận quần vợt ở đó."}, {"who": "Agung", "idn": "Wah, bagaimana cara kamu pergi ke sana?", "vi": "Ồ, bạn đi đến đó bằng cách nào?"}, {"who": "Risti", "idn": "Aku naik MRT ke sana.", "vi": "Mình đi MRT đến đó."}, {"who": "Agung", "idn": "MRT? Aku belum pernah naik itu. Caranya bagaimana, Ti?", "vi": "MRT à? Mình chưa từng đi. Đi thế nào vậy Ti?"}, {"who": "Risti", "idn": "Kamu harus punya kartu uang elektronik dulu, Gung. Petugas akan mengecek barang bawaan kita sebelum masuk dan keluar stasiun. Setelah itu masuk lewat gerbang dengan cara mengetuk kartu.", "vi": "Bạn phải có thẻ tiền điện tử trước, Gung. Nhân viên sẽ kiểm tra hành lý mang theo của chúng ta trước khi vào và ra ga. Sau đó vào qua cổng bằng cách quẹt thẻ."}, {"who": "Agung", "idn": "Hem, menarik. Nanti aku juga mau coba naik MRT.", "vi": "Ừm, thú vị đấy. Lát nữa mình cũng muốn thử đi MRT."}, {"who": "Risti", "idn": "Ayo coba, Gung. Aku yakin kamu suka.", "vi": "Thử đi Gung. Mình chắc bạn sẽ thích."}]}, {"title": "Kegiatan 4 — Hỏi bạn về phương tiện", "kind": "dialog", "lines": [{"who": "A", "idn": "Kamu pergi naik apa?", "vi": "Bạn đi bằng gì?"}, {"who": "B", "idn": "Saya naik kereta api.", "vi": "Mình đi tàu hỏa."}]}, {"title": "Teks 8 — Đi tàu điện KRL", "kind": "text", "lines": [{"idn": "Naik Kereta Rel Listrik", "vi": "Đi tàu điện (KRL)"}, {"idn": "Saya mencoba naik kereta rel listrik (KRL) minggu lalu.", "vi": "Tuần trước tôi đã thử đi tàu điện (KRL)."}, {"idn": "Saya berangkat dari Bogor ke Jakarta.", "vi": "Tôi khởi hành từ Bogor đến Jakarta."}, {"idn": "Banyak hal yang baru saya temui ketika mencoba naik KRL.", "vi": "Có nhiều điều mới mẻ tôi gặp khi thử đi KRL."}, {"idn": "Pertama saya memesan tiket di loket yang ada.", "vi": "Đầu tiên tôi mua vé ở quầy vé."}, {"idn": "Saya harus menyebutkan stasiun yang ingin saya tuju.", "vi": "Tôi phải nói tên ga mà tôi muốn đến."}, {"idn": "Harganya cukup murah, hanya 10.000 rupiah.", "vi": "Giá khá rẻ, chỉ 10.000 rupiah."}, {"idn": "Setelah itu, saya mengetuk tiket di gerbang dan berjalan ke peron untuk menunggu kereta.", "vi": "Sau đó, tôi quẹt vé ở cổng và đi đến sân ga để chờ tàu."}, {"idn": "Ketika kereta tiba, saya langsung naik.", "vi": "Khi tàu đến, tôi lên ngay."}, {"idn": "Keadaan di dalam kereta cukup sesak.", "vi": "Bên trong tàu khá chật."}, {"idn": "Kereta pun tiba di Jakarta.", "vi": "Tàu cũng đến Jakarta."}, {"idn": "Saya turun, lalu berjalan keluar stasiun.", "vi": "Tôi xuống tàu, rồi đi ra khỏi ga."}, {"idn": "Saya harus mengetuk kembali tiket di gerbang yang telah disediakan.", "vi": "Tôi lại phải quẹt vé ở cổng đã được chuẩn bị."}, {"idn": "Pengalaman naik KRL cukup mengasyikkan.", "vi": "Trải nghiệm đi KRL khá thú vị."}, {"idn": "Penumpang memang harus bersabar ketika berada dalam kereta.", "vi": "Hành khách quả thật phải kiên nhẫn khi ở trong tàu."}, {"idn": "Namun, tempat tujuan bisa dicapai tepat waktu.", "vi": "Tuy nhiên, có thể đến nơi đúng giờ."}]}, {"title": "Wawasan — Becak", "kind": "text", "lines": [{"idn": "Becak adalah salah satu sarana transportasi unik di Indonesia.", "vi": "Becak là một phương tiện giao thông độc đáo ở Indonesia."}, {"idn": "Becak adalah kendaraan roda tiga.", "vi": "Becak là xe ba bánh."}, {"idn": "Pengayuh duduk di belakang, sedangkan penumpang duduk di depan.", "vi": "Người đạp ngồi phía sau, còn hành khách ngồi phía trước."}, {"idn": "Becak biasanya ada di depan komplek perumahan atau di depan pasar.", "vi": "Becak thường có ở trước khu nhà ở hoặc trước chợ."}, {"idn": "Ongkos naik becak berbeda-beda.", "vi": "Cước phí đi becak khác nhau."}, {"idn": "Oleh karena itu, penumpang dan tukang becak harus membuat kesepakatan.", "vi": "Vì vậy, hành khách và người đạp becak phải thỏa thuận với nhau."}]}], "grammar": [{"title": "Văn bản rekon: kể lại sự việc đã xảy ra", "body": "**Teks rekon** kể lại sự việc đã xảy ra. Cấu trúc: **Orientasi** (nhân vật, thời gian, nơi chốn: *Saya mencoba naik KRL minggu lalu.*), **Kejadian** (các sự việc theo thứ tự), **Kesimpulan/komentar** (cảm nghĩ). Dùng từ chỉ thời gian quá khứ như *minggu lalu, kemarin, tahun lalu*.", "examples": [{"idn": "Saya mencoba naik KRL minggu lalu.", "vi": "Tuần trước tôi thử đi KRL."}, {"idn": "Pengalaman naik KRL cukup mengasyikkan.", "vi": "Trải nghiệm đi KRL khá thú vị."}]}, {"title": "Hỏi bằng phương tiện gì", "body": "Hỏi: **Kamu pergi naik apa?** Trả lời: **Aku naik + phương tiện.** Hỏi cách làm: **Bagaimana cara ...?**", "examples": [{"idn": "Kamu pergi naik apa?", "vi": "Bạn đi bằng gì?"}, {"idn": "Aku naik kereta.", "vi": "Mình đi tàu."}, {"idn": "Bagaimana cara kamu pergi ke sana?", "vi": "Bạn đi đến đó bằng cách nào?"}]}, {"title": "So sánh: lebih ... daripada", "body": "**Lebih + tính từ + daripada** so sánh hơn: *lebih cepat daripada* (nhanh hơn).", "examples": [{"idn": "Apakah naik kereta lebih cepat daripada naik bus?", "vi": "Đi tàu có nhanh hơn đi xe buýt không?"}]}, {"title": "Hỏi trải nghiệm: belum pernah", "body": "**Belum pernah + động từ** nghĩa là *chưa từng*; **pernah** là *đã từng*.", "examples": [{"idn": "Aku belum pernah naik MRT.", "vi": "Mình chưa từng đi MRT."}, {"idn": "Apakah Anda pernah naik sarana transportasi itu?", "vi": "Bạn đã từng đi phương tiện đó chưa?"}]}, {"title": "Từ nối thời gian: ketika, setelah itu, pertama", "body": "Dùng **pertama, setelah itu, ketika, lalu, kemudian** để kể sự việc theo thứ tự.", "examples": [{"idn": "Ketika kereta tiba, saya langsung naik.", "vi": "Khi tàu đến, tôi lên ngay."}, {"idn": "Saya turun, lalu berjalan keluar stasiun.", "vi": "Tôi xuống tàu rồi đi ra khỏi ga."}]}], "exercises": [{"id": "u08-x01", "t": "mcq", "q": "\"kereta\" nghĩa là", "opts": ["tàu hỏa", "xe buýt", "máy bay", "xe máy"], "a": 0, "e": "kereta = tàu hỏa."}, {"id": "u08-x02", "t": "mcq", "q": "\"tiket\" nghĩa là", "opts": ["vé", "thẻ", "tiền", "ga"], "a": 0, "e": "tiket = vé."}, {"id": "u08-x03", "t": "mcq", "q": "\"stasiun\" nghĩa là", "opts": ["nhà ga", "bến xe", "sân bay", "cảng"], "a": 0, "e": "stasiun = ga."}, {"id": "u08-x04", "t": "mcq", "q": "\"sesak\" nghĩa là", "opts": ["đông chật", "vắng", "rộng", "lạnh"], "a": 0, "e": "sesak = chật cứng người."}, {"id": "u08-x05", "t": "mcq", "q": "Putu đã làm gì hôm qua?", "opts": ["Xem hòa nhạc", "Xem diễu hành", "Xem bóng đá", "Đi chợ"], "a": 0, "e": "menonton konser kemarin."}, {"id": "u08-x06", "t": "mcq", "q": "Putu đi bằng gì?", "opts": ["Tàu hỏa", "Xe buýt", "Xe ôm", "Xe máy"], "a": 0, "e": "Aku naik kereta."}, {"id": "u08-x07", "t": "mcq", "q": "Từ ga, Putu đến nơi hòa nhạc bằng", "opts": ["đi bộ", "xe ôm", "xe buýt", "taxi"], "a": 0, "e": "berjalan kaki."}, {"id": "u08-x08", "t": "mcq", "q": "Theo Putu, đi tàu so với xe buýt", "opts": ["nhanh hơn", "chậm hơn", "đắt hơn", "ít người hơn"], "a": 0, "e": "lebih cepat daripada naik bus."}, {"id": "u08-x09", "t": "mcq", "q": "Lala", "opts": ["mong lần sau cũng đi xem", "không muốn đi", "đã đi rồi", "đi cùng Putu"], "a": 0, "e": "semoga lain kali aku bisa ikut menonton."}, {"id": "u08-x10", "t": "mcq", "q": "Risti đi xem gì ở Istora Senayan?", "opts": ["Trận quần vợt", "Hòa nhạc", "Diễu hành", "Bóng đá"], "a": 0, "e": "pertandingan tenis."}, {"id": "u08-x11", "t": "mcq", "q": "Để đi MRT, trước tiên cần có", "opts": ["thẻ tiền điện tử", "vé giấy", "hộ chiếu", "xe đạp"], "a": 0, "e": "harus punya kartu uang elektronik."}, {"id": "u08-x12", "t": "mcq", "q": "Nhân viên MRT kiểm tra", "opts": ["hành lý mang theo", "hộ chiếu", "giấy phép", "tiền mặt"], "a": 0, "e": "mengecek barang bawaan."}, {"id": "u08-x13", "t": "mcq", "q": "Vào cổng MRT bằng cách", "opts": ["quẹt thẻ", "đưa vé giấy", "trả tiền mặt", "gọi nhân viên"], "a": 0, "e": "dengan cara mengetuk kartu."}, {"id": "u08-x14", "t": "mcq", "q": "Tác giả Teks 8 đi từ đâu đến đâu?", "opts": ["Bogor đến Jakarta", "Jakarta đến Bogor", "Bandung đến Jakarta", "Depok đến Bogor"], "a": 0, "e": "dari Bogor ke Jakarta."}, {"id": "u08-x15", "t": "mcq", "q": "Giá vé KRL trong Teks 8 là", "opts": ["10.000 rupiah", "5.000 rupiah", "20.000 rupiah", "100.000 rupiah"], "a": 0, "e": "hanya 10.000 rupiah."}, {"id": "u08-x16", "t": "mcq", "q": "Trong tàu KRL", "opts": ["khá chật", "rất vắng", "rất lạnh", "rất rộng"], "a": 0, "e": "cukup sesak."}, {"id": "u08-x17", "t": "mcq", "q": "Tác giả thấy trải nghiệm KRL", "opts": ["khá thú vị", "rất tệ", "nhàm chán", "đáng sợ"], "a": 0, "e": "cukup mengasyikkan."}, {"id": "u08-x18", "t": "mcq", "q": "Hành khách KRL cần", "opts": ["kiên nhẫn", "chạy nhanh", "trả thêm", "mang nhiều đồ"], "a": 0, "e": "harus bersabar."}, {"id": "u08-x19", "t": "mcq", "q": "Phần mở đầu của văn bản rekon gọi là", "opts": ["Orientasi", "Kejadian", "Kesimpulan", "Identifikasi"], "a": 0, "e": "Orientasi = nhân vật, thời gian, nơi chốn."}, {"id": "u08-x20", "t": "fill", "q": "Saya mencoba naik KRL ___ lalu. (tuần)", "a": ["minggu"], "e": "minggu lalu = tuần trước."}, {"id": "u08-x21", "t": "fill", "q": "Aku ___ pernah naik MRT. (chưa)", "a": ["belum"], "e": "belum pernah = chưa từng."}, {"id": "u08-x22", "t": "mcq", "q": "\"lebih cepat daripada\" nghĩa là", "opts": ["nhanh hơn", "chậm hơn", "nhanh nhất", "bằng nhau"], "a": 0, "e": "lebih ... daripada = hơn."}, {"id": "u08-x23", "t": "mcq", "q": "Becak là xe", "opts": ["ba bánh", "hai bánh", "bốn bánh", "một bánh"], "a": 0, "e": "kendaraan roda tiga."}, {"id": "u08-x24", "t": "mcq", "q": "Trên becak, hành khách ngồi", "opts": ["phía trước", "phía sau", "bên cạnh", "trên mui"], "a": 0, "e": "penumpang duduk di depan."}, {"id": "u08-x25", "t": "mcq", "q": "Cước phí becak", "opts": ["phải thỏa thuận", "cố định", "miễn phí", "trả trước"], "a": 0, "e": "harus membuat kesepakatan."}], "culture": {"title": "Becak, xe ba bánh độc đáo", "vi": "**Becak** là phương tiện độc đáo của Indonesia: xe **ba bánh**, người đạp (pengayuh) ngồi phía sau, hành khách ngồi phía trước. Thường đậu trước khu nhà ở hoặc trước chợ. Cước phí không cố định nên hành khách và người đạp phải **thỏa thuận (kesepakatan)** trước khi đi."}}, {"id": "u09", "num": 9, "title": "Cerita Liburanku", "vi_title": "Kể chuyện kỳ nghỉ của tôi", "goals": ["Kể lại nội dung đoạn nghe về kế hoạch nghỉ lễ", "
